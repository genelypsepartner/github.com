              <a href={l.url} target="_blank" rel="noreferrer" style={{ fontSize:11, color:"#60A5FA", textDecoration:"none", flexShrink:0 }}>🔗 Abrir</a>
              <button onClick={()=>deleteLink(l.id)} style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:14, flexShrink:0 }}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── PIZARRA (dibujo libre) ────────────────────────────────────────────────────
function PizarraTab({ data, onChange }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const lastPt = useRef(null);
  const [color, setColor] = useState("#8B5CF6");
  const [brush, setBrush] = useState(4);
  const [tool, setTool] = useState("pen"); // "pen" | "eraser"
  const loadedOnce = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext && canvas.getContext("2d");
    if (!ctx) return; // entorno sin soporte de canvas 2D
    ctx.fillStyle = "#0a0a0b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!loadedOnce.current && data.pizarra?.image) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = data.pizarra.image;
    }
    loadedOnce.current = true;
    // eslint-disable-next-line
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX-rect.left) * (canvas.width/rect.width), y: (clientY-rect.top) * (canvas.height/rect.height) };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawingRef.current = true;
    lastPt.current = getPos(e);
  };
  const draw = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext && canvas.getContext("2d");
    if (!ctx) return;
    const pt = getPos(e);
    ctx.strokeStyle = tool==="eraser" ? "#0a0a0b" : color;
    ctx.lineWidth = tool==="eraser" ? brush*4 : brush;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(lastPt.current.x, lastPt.current.y);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
    lastPt.current = pt;
  };
  const endDraw = () => {
    if (!drawingRef.current) return;
    drawingRef.current = false;
    const canvas = canvasRef.current;
    try {
      const img = canvas.toDataURL("image/png");
      onChange({ ...data, pizarra: { ...(data.pizarra||{}), image: img, updatedAt: Date.now() } });
    } catch (e) { console.warn("No se pudo guardar la pizarra:", e); }
  };

  const clearBoard = () => {
    if (!window.confirm("¿Borrar todo el contenido de la pizarra?")) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext && canvas.getContext("2d");
    if (ctx) { ctx.fillStyle = "#0a0a0b"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    onChange({ ...data, pizarra: { image: null, updatedAt: Date.now() } });
  };

  const downloadPng = () => {
    try {
      const canvas = canvasRef.current;
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "pizarra-genelypse.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { console.warn("No se pudo descargar la pizarra:", e); }
  };

  const btnStyle = (active) => ({ padding:"6px 12px", background: active?GOLD:"#222225", color: active?"#141414":WHITE, border:`1px solid ${active?GOLD:BORDER}`, borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:600 });

  return (
    <div>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:18, flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Lienzo compartido</div>
          <h2 style={{ color:WHITE, fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.3 }}>Pizarra</h2>
          <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>Dibuja libremente — se guarda automáticamente al soltar el trazo.</div>
        </div>
      </div>

      <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:10, padding:"8px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8 }}>
        <button style={btnStyle(tool==="pen")} onClick={()=>setTool("pen")}>✏️ Lápiz</button>
        <button style={btnStyle(tool==="eraser")} onClick={()=>setTool("eraser")}>🧽 Borrador</button>
        <input type="color" value={color} onChange={e=>setColor(e.target.value)}
          style={{ width:34, height:30, border:`1px solid ${BORDER}`, borderRadius:6, background:"none", cursor:"pointer" }} title="Color" />
        <select value={brush} onChange={e=>setBrush(parseInt(e.target.value,10))}
          style={{ background:"#222225", border:`1px solid ${BORDER}`, borderRadius:6, color:WHITE, fontSize:12, padding:"6px 8px" }}>
          {[2,4,6,10,16].map(b=><option key={b} value={b}>Grosor {b}px</option>)}
        </select>
        <button style={btnStyle(false)} onClick={downloadPng}>📥 Descargar PNG</button>
        <button style={{...btnStyle(false), color:"#EF4444", borderColor:"#EF444444"}} onClick={clearBoard}>🗑 Limpiar</button>
      </div>

      <canvas
        ref={canvasRef}
        width={1100}
        height={600}
        style={{ width:"100%", maxWidth:1100, height:"auto", aspectRatio:"1100/600", background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:10, cursor:"crosshair", touchAction:"none" }}
        onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
        onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
      />
    </div>
  );
}

// ─── BITÁCORA GLOBAL ────────────────────────────────────────────────────────────
// Agrega cronológicamente el registro de actividad de todas las tareas de todas
// las empresas, agrupado por día.
function BitacoraGlobalTab({ data }) {
  const clients = data.clients || [];
  const team = data.team || [];
  const [empresaFilter, setEmpresaFilter] = useState("Todas");
  const [userFilter, setUserFilter] = useState("Todos");

  const entries = [];
  clients.forEach(c => {
    (c.tasks||[]).forEach(t => {
      (t.registroActividad||[]).forEach(r => {
        entries.push({ ...r, empresa: c.name, empresaId: c.id, taskTitle: t.title, taskId: t.id });
      });
    });
  });

  const filtered = entries.filter(e => {
    if (empresaFilter !== "Todas" && e.empresaId !== empresaFilter) return false;
    if (userFilter !== "Todos" && e.userId !== userFilter) return false;
    return true;
  });

  const byDay = {};
  filtered.forEach(e => {
    const day = new Date(e.ts).toISOString().slice(0,10);
    (byDay[day] = byDay[day]||[]).push(e);
  });
  const days = Object.keys(byDay).sort((a,b)=>b.localeCompare(a));

  return (
    <div style={{ maxWidth:820 }}>
      <div style={{ marginBottom:18 }}>
        <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Historial</div>
        <h2 style={{ color:WHITE, fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.3 }}>Bitácora Global</h2>
        <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>Todo lo registrado en la bitácora de cada tarea, de todas las empresas, en orden cronológico.</div>
      </div>

      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:18 }}>
        <select value={empresaFilter} onChange={e=>setEmpresaFilter(e.target.value)}
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"6px 10px", color:WHITE, fontSize:12 }}>
          <option value="Todas">Todas las empresas</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select value={userFilter} onChange={e=>setUserFilter(e.target.value)}
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"6px 10px", color:WHITE, fontSize:12 }}>
          <option value="Todos">Todos los usuarios</option>
          {team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      </div>

      {days.length === 0 ? (
        <div style={{ textAlign:"center", padding:"50px 0", color:GRAY, fontSize:13 }}>Aún no hay entradas de bitácora registradas.</div>
      ) : (
        days.map(day => {
          const dayEntries = [...byDay[day]].sort((a,b)=>a.ts-b.ts);
          return (
            <div key={day} style={{ marginBottom:20 }}>
              <div style={{ fontSize:12, fontWeight:700, color:GOLD, textTransform:"capitalize", marginBottom:8, borderBottom:`1px solid ${BORDER}`, paddingBottom:6 }}>
                {new Date(day+"T00:00").toLocaleDateString("es-CO",{weekday:"long", day:"2-digit", month:"long", year:"numeric"})}
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {dayEntries.map(e => {
                  const u = team.find(m=>m.id===e.userId);
                  return (
                    <div key={e.id} style={{ display:"flex", gap:8, fontSize:12.5, alignItems:"baseline", flexWrap:"wrap" }}>
                      <span style={{ color:GOLD_DIM, minWidth:44 }}>{new Date(e.ts).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}</span>
                      <span style={{ color:GRAY, fontSize:10.5, background:"rgba(139,92,246,0.08)", padding:"1px 7px", borderRadius:10 }}>🏢 {e.empresa}</span>
                      <span style={{ color:GOLD_DIM, fontWeight:600 }}>{e.taskTitle}</span>
                      {u && <span style={{ color:WHITE, fontWeight:600 }}>· {u.name}:</span>}
                      <span style={{ color:WHITE }}>{e.text}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ─── REPORTES AUTOMÁTICOS ───────────────────────────────────────────────────────
function ReportesTab({ data }) {
  const clients = data.clients || [];
  const team = data.team || [];
  const [empresaId, setEmpresaId] = useState("Todas");

  const scoped = empresaId === "Todas" ? clients : clients.filter(c=>c.id===empresaId);
  const allTasks = scoped.flatMap(c => (c.tasks||[]).map(t => ({ ...t, empresa: c.name })));
  const total = allTasks.length;
  const done = allTasks.filter(t=>t.done).length;
  const pctTotal = total ? Math.round(done/total*100) : 0;

  const porArea = AREAS.map(area => {
    const at = allTasks.filter(t=>(t.fase||t.area)===area);
    const ad = at.filter(t=>t.done).length;
    return { area, total: at.length, done: ad, pct: at.length ? Math.round(ad/at.length*100) : 0 };
  });

  const porEstado = ESTADOS_TAREA.map(es => ({
    ...es, count: allTasks.filter(t => (t.estado || (t.done?"listo":"pendiente")) === es.id).length,
  }));

  const porPersona = team.map(m => {
    const asignadas = allTasks.filter(t => (t.assigneeIds||[]).includes(m.id));
    const completadas = asignadas.filter(t=>t.done).length;
    const entradas = asignadas.reduce((n,t)=>n+((t.registroActividad||[]).length),0);
    return { ...m, asignadas: asignadas.length, completadas, entradas };
  }).filter(p=>p.asignadas>0);

  const generarInformeMetodologico = () => {
    const lines = [];
    lines.push(`# Informe Metodológico — Genelypse Growth Partner`);
    lines.push(`Generado: ${new Date().toLocaleString("es-CO")}`);
    lines.push(`Alcance: ${empresaId==="Todas" ? "Todas las empresas" : scoped[0]?.name}`);
    lines.push("");
    lines.push(`## Resumen general`);
    lines.push(`- Progreso total: ${pctTotal}% (${done}/${total} tareas)`);
    lines.push("");
    AREAS.forEach(area => {
      const areaTasks = allTasks.filter(t=>(t.fase||t.area)===area);
      if (!areaTasks.length) return;
      const ad = areaTasks.filter(t=>t.done).length;
      lines.push(`## ${area} — ${ad}/${areaTasks.length} completadas`);
      areaTasks.forEach(t => {
        const asign = (t.assigneeIds||[]).map(id=>team.find(m=>m.id===id)?.name).filter(Boolean).join(", ") || "Sin asignar";
        lines.push(`### ${t.done?"✅":"⬜"} ${t.title} (${t.empresa})`);
        lines.push(`- Responsable(s): ${asign}`);
        if (t.estado) lines.push(`- Estado: ${ESTADOS_TAREA.find(s=>s.id===t.estado)?.label||t.estado}`);
        if (t.prioridad) lines.push(`- Prioridad: ${PRIORIDADES.find(p=>p.id===t.prioridad)?.label||t.prioridad}`);
        if (t.fechaLimite) lines.push(`- Fecha límite: ${t.fechaLimite}`);
        if (t.descripcion) lines.push(`- Descripción: ${t.descripcion}`);
        if ((t.checklist||[]).length) {
          lines.push(`- Checklist: ${t.checklist.map(c=>`${c.done?"☑":"☐"} ${c.label}`).join(" ")}`);
        }
        if ((t.evidencias||[]).length) {
          lines.push(`- Evidencias: ${t.evidencias.map(e=>`📎 ${e.name}`).join(" ")}`);
        }
        if (t.observaciones) lines.push(`- Observaciones: ${t.observaciones}`);
        if ((t.registroActividad||[]).length) {
          lines.push(`- Registro de actividad:`);
          [...t.registroActividad].sort((a,b)=>a.ts-b.ts).forEach(r => {
            const u = team.find(m=>m.id===r.userId);
            lines.push(`  - ${new Date(r.ts).toLocaleString("es-CO")}${u?` — ${u.name}`:""}: ${r.text}`);
          });
        }
        lines.push("");
      });
    });
    const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `informe-metodologico-${new Date().toISOString().slice(0,10)}.md`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };

  const th = { textAlign:"left", color:GRAY, fontSize:10.5, textTransform:"uppercase", letterSpacing:0.5, padding:"6px 10px", borderBottom:`1px solid ${BORDER}` };
  const td = { padding:"6px 10px", fontSize:12.5, color:WHITE, borderBottom:`1px solid ${BORDER}55` };

  return (
    <div style={{ maxWidth:900 }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Automáticos</div>
          <h2 style={{ color:WHITE, fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.3 }}>Reportes</h2>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <select value={empresaId} onChange={e=>setEmpresaId(e.target.value)}
            style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:12 }}>
            <option value="Todas">Todas las empresas</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          <button onClick={generarInformeMetodologico}
            style={{ padding:"9px 16px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:12.5 }}>
            📄 Generar informe metodológico (.md)
          </button>
        </div>
      </div>

      {/* Resumen */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, marginBottom:24 }}>
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderTop:`2px solid ${GOLD}55`, borderRadius:12, padding:"14px 16px" }}>
          <div style={{ fontSize:9, color:GOLD_DIM, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>Progreso</div>
          <div style={{ fontSize:26, fontWeight:900, color:GOLD }}>{pctTotal}%</div>
          <div style={{ fontSize:11, color:GRAY, marginTop:4 }}>{done}/{total} tareas completadas</div>
        </div>
        {porEstado.map(es => (
          <div key={es.id} style={{ background:CARD, border:`1px solid ${BORDER}`, borderTop:`2px solid ${es.color}55`, borderRadius:12, padding:"14px 16px" }}>
            <div style={{ fontSize:9, color:es.color, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>{es.label}</div>
            <div style={{ fontSize:26, fontWeight:900, color:es.color }}>{es.count}</div>
            <div style={{ fontSize:11, color:GRAY, marginTop:4 }}>tarea(s)</div>
          </div>
        ))}
      </div>

      {/* Por fase/área */}
      <div style={{ marginBottom:24 }}>
        <div style={{ fontSize:13, fontWeight:700, color:WHITE, marginBottom:10 }}>Progreso por fase</div>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead><tr><th style={th}>Fase</th><th style={th}>Completadas</th><th style={th}>Total</th><th style={th}>%</th></tr></thead>
          <tbody>
            {porArea.map(a => (
              <tr key={a.area}>
                <td style={td}>{a.area}</td><td style={td}>{a.done}</td><td style={td}>{a.total}</td>
                <td style={td}><span style={{ color: a.pct>=100?GREEN:a.pct>=50?GOLD:GRAY }}>{a.pct}%</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Por persona */}
      <div>
        <div style={{ fontSize:13, fontWeight:700, color:WHITE, marginBottom:10 }}>Seguimiento por persona</div>
        {porPersona.length === 0 ? (
          <div style={{ color:GRAY, fontSize:12 }}>No hay tareas asignadas todavía en este alcance.</div>
        ) : (
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr><th style={th}>Persona</th><th style={th}>Asignadas</th><th style={th}>Completadas</th><th style={th}>Entradas de bitácora</th></tr></thead>
            <tbody>
              {porPersona.map(p => (
                <tr key={p.id}>
                  <td style={td}>{p.name}</td><td style={td}>{p.asignadas}</td><td style={td}>{p.completadas}</td><td style={td}>{p.entradas}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function CalendarioTab({ clients, team }) {
  const today = nowBogota();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth()); // 0-11
  const [selectedDay, setSelectedDay] = useState(null); // "YYYY-MM-DD"

  // Agregar todas las reuniones (con empresa) y visitas (con empresa) de todas las empresas
  const events = [];
  (clients||[]).forEach(c => {
    (c.meetings||[]).forEach(m => {
      events.push({
        id: "m_"+m.id, kind:"reunion", date: m.date.slice(0,10), time: m.date.slice(11,16),
        title: m.title, type: m.type||"virtual", guestEmails: m.guestEmails||"",
        empresa: c.name, desc: m.desc||"",
      });
    });
    (c.visits||[]).forEach(v => {
      const u = (team||[]).find(t=>t.id===v.userId);
      events.push({
        id: "v_"+v.id, kind:"visita", date: v.date, time:"",
        title: `Visita presencial · ${u?u.name:"Usuario"}`, type:"presencial",
        empresa: c.name, desc: v.context||"",
      });
    });
    (c.conexiones||[]).forEach(cx => {
      const u = (team||[]).find(t=>t.id===cx.userId);
      events.push({
        id: "cx_"+cx.id, kind:"conexion", date: cx.date, time:"",
        title: `Conexión digital · ${u?u.name:"Usuario"}`, type:"digital",
        empresa: c.name, desc: cx.context||"", link: cx.link||"",
      });
    });
  });

  const eventsByDay = {};
  events.forEach(e => { (eventsByDay[e.date] = eventsByDay[e.date]||[]).push(e); });

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // lunes=0
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  const cells = [];
  for (let i=0; i<startWeekday; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);

  const goMonth = (delta) => {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m); setViewYear(y);
  };

  const dayEvents = selectedDay ? (eventsByDay[selectedDay]||[]) : [];

  return (
    <div>
      <div style={{ marginBottom:18, padding:"12px 16px", background:`${GOLD}10`, border:`1px solid ${GOLD}30`, borderRadius:10 }}>
        <div style={{ fontSize:12, color:GOLD, fontWeight:600, marginBottom:2 }}>📅 Calendario Genelypse — Colombia {today.getFullYear()}</div>
        <div style={{ fontSize:11, color:GRAY }}>Vista en vivo (hora de Colombia). Muestra reuniones, visitas presenciales y conexiones digitales de todas las empresas. El envío real a Google Calendar de los correos invitados se activa cuando se conecte la integración.</div>
      </div>

      <div style={{ marginBottom:14 }}>
        <button onClick={()=>{
          const monthEvents = events.filter(e => e.date.slice(0,7) === `${viewYear}-${String(viewMonth+1).padStart(2,"0")}`);
          downloadIcs(`genelypse-${viewYear}-${String(viewMonth+1).padStart(2,"0")}.ics`, buildIcs(monthEvents));
        }}
          style={{ padding:"7px 14px", background:"transparent", border:`1px solid ${GOLD_DIM}`, borderRadius:8, color:GOLD, cursor:"pointer", fontSize:12, fontWeight:600 }}>
          📥 Descargar calendario del mes (.ics)
        </button>
      </div>

      <div style={{ display:"flex", gap:20, flexWrap:"wrap", alignItems:"flex-start" }}>
        {/* Grid del mes */}
        <div style={{ flex:"1 1 480px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
            <button onClick={()=>goMonth(-1)} style={{ background:"none", border:`1px solid ${BORDER}`, borderRadius:7, color:GRAY, cursor:"pointer", padding:"4px 10px", fontSize:13 }}>‹</button>
            <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:0.2 }}>{MESES_CO[viewMonth]} {viewYear}</div>
            <button onClick={()=>goMonth(1)} style={{ background:"none", border:`1px solid ${BORDER}`, borderRadius:7, color:GRAY, cursor:"pointer", padding:"4px 10px", fontSize:13 }}>›</button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
            {DIAS_CO.map(d=>(
              <div key={d} style={{ textAlign:"center", color:GRAY, fontSize:10, fontWeight:700, textTransform:"uppercase" }}>{d}</div>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
            {cells.map((d, i) => {
              if (d === null) return <div key={"e"+i} />;
              const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const dayEv = eventsByDay[dateStr] || [];
              const isToday = dateStr === todayStr;
              const isSelected = dateStr === selectedDay;
              return (
                <button key={dateStr} onClick={()=>setSelectedDay(dateStr)}
                  style={{
                    aspectRatio:"1", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2,
                    borderRadius:8, cursor:"pointer", padding:2,
                    background: isSelected ? `${GOLD}22` : isToday ? "rgba(255,255,255,0.04)" : "transparent",
                    border: isSelected ? `1px solid ${GOLD}` : isToday ? `1px solid ${GOLD_DIM}` : "1px solid transparent",
                  }}>
                  <span style={{ fontSize:12, color: isToday ? GOLD : WHITE, fontWeight: isToday ? 800 : 500 }}>{d}</span>
                  {dayEv.length > 0 && (
                    <div style={{ display:"flex", gap:2 }}>
                      {dayEv.slice(0,3).map((e,idx)=>(
                        <span key={idx} style={{ width:5, height:5, borderRadius:"50%", background: e.kind==="visita" ? GREEN : e.kind==="conexion" ? "#60A5FA" : (e.type==="presencial" ? "#F59E0B" : "#60A5FA") }} />
                      ))}
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {/* Agenda del día seleccionado */}
        <div style={{ flex:"1 1 280px", minWidth:260, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:16 }}>
          <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:12 }}>
            {selectedDay ? new Date(selectedDay+"T00:00").toLocaleDateString("es-CO",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}) : "Selecciona un día"}
          </div>
          {selectedDay && dayEvents.length === 0 && (
            <div style={{ color:GRAY, fontSize:12 }}>Sin reuniones ni visitas este día.</div>
          )}
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {dayEvents.map(e => (
              <div key={e.id} style={{ padding:"10px 12px", borderRadius:8, background:"#111113", border:`1px solid ${BORDER}` }}>
                <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:4 }}>
                  <span style={{ fontSize:10, fontWeight:700, padding:"1px 7px", borderRadius:10,
                    color: e.kind==="visita" ? GREEN : e.kind==="conexion" ? "#60A5FA" : (e.type==="presencial" ? "#F59E0B" : "#60A5FA"),
                    background: e.kind==="visita" ? "rgba(76,175,125,0.12)" : e.kind==="conexion" ? "rgba(96,165,250,0.12)" : (e.type==="presencial" ? "rgba(245,158,11,0.12)" : "rgba(96,165,250,0.12)") }}>
                    {e.kind==="visita" ? "📍 Visita" : e.kind==="conexion" ? "💻 Conexión" : (e.type==="presencial" ? "📍 Presencial" : "💻 Virtual")}
                  </span>
                  {e.time && <span style={{ fontSize:11, color:GRAY }}>{e.time}</span>}
                </div>
                <div style={{ color:WHITE, fontSize:12.5, fontWeight:600 }}>{e.title}</div>
                <div style={{ color:GOLD_DIM, fontSize:11, marginTop:2 }}>🏢 {e.empresa}</div>
                {e.desc && <div style={{ color:GRAY, fontSize:11, marginTop:4, lineHeight:1.4 }}>{e.desc}</div>}
                {e.link && <div style={{ marginTop:4 }}><a href={e.link} target="_blank" rel="noreferrer" style={{ color:"#60A5FA", fontSize:11 }}>🔗 Unirse a la reunión</a></div>}
                {e.guestEmails && <div style={{ color:GRAY, fontSize:10, marginTop:4 }}>✉ {e.guestEmails}</div>}
              </div>
            ))}
            {selectedDay && dayEvents.length > 0 && (
              <button onClick={()=>downloadIcs(`genelypse-${selectedDay}.ics`, buildIcs(dayEvents))}
                style={{ marginTop:6, padding:"7px 12px", background:"transparent", border:`1px solid ${GOLD_DIM}`, borderRadius:7, color:GOLD, cursor:"pointer", fontSize:11.5, fontWeight:600 }}>
                📥 Descargar este día (.ics)
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function MetodoGrowthPartner() {
  const [data, setData] = useState(getInitialData);
  const [tab, setTab] = useState("inicio");
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [saved, setSaved] = useState(true);
  const [fbStatus, setFbStatus] = useState("sync"); // "sync" | "ok" | "error"
  const saveTimer = useRef(null);
  const lastSaveTs = useRef(0);
  const firebaseInitDone = useRef(false); // protege auto-save de disparar antes de que Firebase responda

  // "Quién eres" — identidad local (NO se sincroniza a Firebase), usada para
  // atribuir automáticamente las entradas de la bitácora a quien las escribe.
  const [currentUserId, setCurrentUserId] = useState(() => {
    try { return localStorage.getItem("gp_current_user_id") || ""; } catch(_) { return ""; }
  });
  const setCurrentUser = (id) => {
    setCurrentUserId(id);
    try { localStorage.setItem("gp_current_user_id", id); } catch(_) {}
  };

  // Firebase: carga inicial + polling cada 30 segundos
  useEffect(() => {
    const ref = getFbRef();
    if (!ref) { setFbStatus("error"); return; }

    const syncFromFirebase = (isInitial = false) => {
      ref.once("value").then(snap => {
        const fbRaw = snap.val();
        const localTs = storageGetTs();

        if (fbRaw && fbRaw.clients) {
          const { _ts: fbTs, ...rest } = fbRaw;
          const fbTime = fbTs || 0;
          const clean = fbToJs(rest);

          if (fbTime > localTs + 2000) {
            // Firebase es más nuevo → usar Firebase
            firebaseInitDone.current = true;
            setData(getInitialData(clean));
            storageSet(clean);
            storageSetTs(fbTime);
            lastSaveTs.current = fbTime;
          } else if (isInitial && localTs >= fbTime) {
            // Local es más nuevo o igual → mantener local y empujar a Firebase
            firebaseInitDone.current = true;
            const localData = storageGet();
            if (localData && localData.clients) {
              const ts = localTs || Date.now();
              lastSaveTs.current = ts;
              ref.set({ ...localData, _ts: ts }).catch(() => {});
            }
          } else if (!isInitial && fbTime > lastSaveTs.current + 2000) {
            // Polling: Firebase tiene datos del socio
            setData(getInitialData(clean));
            storageSet(clean);
            storageSetTs(fbTime);
            lastSaveTs.current = fbTime;
          } else if (isInitial) {
            firebaseInitDone.current = true;
          }
        } else if (isInitial) {
          // Firebase vacío → subir datos locales
          firebaseInitDone.current = true;
          const localData = storageGet();
          if (localData && localData.clients) {
            const ts = localTs || Date.now();
            lastSaveTs.current = ts;
            ref.set({ ...localData, _ts: ts }).catch(() => {});
          }
        }
        setFbStatus("ok");
      }).catch(() => setFbStatus("error"));
    };

    syncFromFirebase(true);
    const interval = setInterval(() => syncFromFirebase(false), 30000);
    return () => clearInterval(interval);
  }, []);

  // Auto-save: localStorage + Firebase
  // Protegido: no escribe a Firebase hasta que la sincronización inicial de Firebase haya terminado
  // Esto evita que un dispositivo con localStorage vacío pise datos reales antes de recibirlos
  useEffect(() => {
    clearTimeout(saveTimer.current);
    setSaved(false);
    saveTimer.current = setTimeout(() => {
      const ts = Date.now();
      storageSet(data);
      storageSetTs(ts);
      if (!firebaseInitDone.current) return; // esperar a Firebase antes de escribir
      const ref = getFbRef();
      if (ref) {
        lastSaveTs.current = ts;
        ref.set({ ...data, _ts: ts }).catch(() => setFbStatus("error"));
      }
      setSaved(true);
    }, 1500); // aumentado a 1.5s para dar más margen a Firebase en redes lentas (ej. celular)
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const updateData = (newData) => setData(newData);

  const createClient = (name, channel) => {
    const c = makeClient(name, channel);
    setData(d => ({ ...d, clients: [...d.clients, c] }));
    setSelectedClientId(c.id);
  };

  const updateClient = (updatedClient) => {
    setData(d => ({ ...d, clients: d.clients.map(c => c.id === updatedClient.id ? updatedClient : c) }));
  };

  const deleteClient = (id) => {
    setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));
    if (selectedClientId === id) setSelectedClientId(null);
  };

  const saveTemplate = (name, flow) => {
    setData(d => ({ ...d, flowTemplates: [...(d.flowTemplates||[]), { id:uid(), name, createdAt:Date.now(), nodes:flow.nodes, edges:flow.edges }] }));
  };
  const deleteTemplate = (templateId) => {
    setData(d => ({ ...d, flowTemplates: (d.flowTemplates||[]).filter(t=>t.id!==templateId) }));
  };

  const selectedClient = data.clients.find(c=>c.id===selectedClientId);

  return (
    <div style={{ minHeight:"100vh", background:"transparent", color:WHITE }}>
      {/* Header */}
      <div style={{ background:"rgba(23,23,26,0.88)", backdropFilter:"blur(14px)", WebkitBackdropFilter:"blur(14px)", borderBottom:"1px solid rgba(42,42,46,0.7)", padding:"0 24px", position:"sticky", top:0, zIndex:100, boxShadow:"0 1px 0 rgba(139,92,246,0.07), 0 4px 30px rgba(0,0,0,0.35)" }}>
        <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", gap:0 }}>
          {/* Logo */}
          <div style={{ padding:"10px 0", marginRight:28, display:"flex", alignItems:"center", gap:10 }}>
            <img src={LOGO_DATA_URI} alt="Genelypse" style={{ width:30, height:30, objectFit:"contain", borderRadius:6, flexShrink:0 }} />
            <div style={{ display:"flex", flexDirection:"column", lineHeight:1.15 }}>
              <span className="gp-logo-text" style={{ fontWeight:900, fontSize:15, letterSpacing:0.3 }}>GENELYPSE</span>
              <span style={{ color:"rgba(155,155,159,0.55)", fontWeight:400, fontSize:9, letterSpacing:2, textTransform:"uppercase" }}>Growth Partner</span>
            </div>
          </div>
          {/* Separator */}
          <div style={{ width:1, height:22, background:"rgba(42,42,46,0.8)", marginRight:4 }} />
          {/* Main nav */}
          <div style={{ display:"flex", gap:0 }}>
            {[["inicio","Inicio"],["clientes","Empresas"],["metodo","Método"],["calendario","Calendario"],["trazabilidad","Trazabilidad"],["plantillas","Plantillas"],["pizarra","Pizarra"],["bitacora","Bitácora"],["reportes","Reportes"]].map(([id,label]) => (
              <button key={id}
                className={`gp-nav-tab${tab===id&&!selectedClientId?" active":""}`}
                onClick={()=>{ setTab(id); setSelectedClientId(null); }}>
                {label}
              </button>
            ))}
          </div>
          <div style={{ flex:1 }} />
          {/* Tool icons */}
          <div style={{ display:"flex", gap:3, paddingRight:14, borderRight:`1px solid rgba(42,42,46,0.6)`, marginRight:14 }}>
            {[["equipo","👥","Equipo y Roles"],["configuracion","⚙️","Configuración"]].map(([id,icon,label]) => {
              const isActive = tab===id && !selectedClientId;
              return (
                <button key={id} title={label}
                  className={`gp-tool-btn${isActive?" active":""}`}
                  onClick={()=>{ setTab(id); setSelectedClientId(null); }}>
                  {icon}
                  {isActive && <span style={{ position:"absolute", bottom:4, left:"50%", transform:"translateX(-50%)", width:4, height:4, borderRadius:2, background:GOLD, boxShadow:"0 0 4px "+GOLD }} />}
                </button>
              );
            })}
          </div>
          {/* Quién eres */}
          <select value={currentUserId} onChange={e=>setCurrentUser(e.target.value)} title="Quién eres (para la bitácora)"
            style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:7, padding:"5px 8px", color: currentUserId?WHITE:GRAY, fontSize:11, outline:"none", marginRight:14 }}>
            <option value="">👤 ¿Quién eres?</option>
            {(data.team||[]).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
          {/* Sync status */}
          <div style={{ display:"flex", alignItems:"center", fontSize:11 }}>
            <span className={`gp-status-dot ${!saved?"saving":fbStatus==="ok"?"online":fbStatus==="error"?"error":"sync"}`} />
            <span style={{ color: !saved ? GOLD_DIM : fbStatus==="ok" ? GREEN : fbStatus==="error" ? "#EF4444" : GRAY }}>
              {!saved ? "Guardando…" : fbStatus==="ok" ? "Sincronizado" : fbStatus==="error" ? "Sin conexión" : "Conectando…"}
            </span>
          </div>
        </div>
      </div>

      {/* Content */}
      <div key={tab} className="gp-fade-in" style={{ maxWidth:1200, margin:"0 auto", padding:"28px 24px" }}>
        {/* Client detail takes precedence */}
        {selectedClientId && selectedClient ? (
          <ClientDetail
            client={selectedClient} team={data.team}
            onBack={()=>setSelectedClientId(null)} onChange={updateClient}
            apiKey={data.settings?.apiKey || ""}
            flowTemplates={data.flowTemplates||[]}
            onSaveTemplate={saveTemplate} onDeleteTemplate={deleteTemplate}
            globalOrganigrama={data.globalOrganigramaFlow}
            issues={data.issues||[]}
            currentUserId={currentUserId}
          />
        ) : (
          <>
            {tab === "inicio" && (
              <HomeTab
                data={data}
                onGoToClients={()=>setTab("clientes")}
                onSelectClient={(id)=>{ setSelectedClientId(id); setTab("clientes"); }}
                onUpdateIssues={(issues)=>updateData({...data, issues})}
                onUpdateClient={updateClient}
              />
            )}
            {tab === "clientes" && (
              <ClientsList clients={data.clients} onSelect={setSelectedClientId} onCreate={createClient} onDelete={deleteClient} />
            )}
            {tab === "metodo" && (
              <MetodoTab data={data} onChange={updateData} />
            )}
            {tab === "calendario" && (
              <CalendarioTab clients={data.clients} team={data.team||[]} />
            )}
            {tab === "trazabilidad" && (
              <TrazabilidadTab data={data} onChange={updateData} />
            )}
            {tab === "plantillas" && (
              <EnlacesPlantillaTab data={data} onChange={updateData} />
            )}
            {tab === "pizarra" && (
              <PizarraTab data={data} onChange={updateData} />
            )}
            {tab === "bitacora" && (
              <BitacoraGlobalTab data={data} />
            )}
            {tab === "reportes" && (
              <ReportesTab data={data} />
            )}
            {tab === "equipo" && (
              <TeamTab data={data} onChange={updateData} />
            )}
            {tab === "configuracion" && (
              <SettingsTab data={data} onChange={updateData} />
            )}
          </>
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MetodoGrowthPartner />);
  </script>
</body>
</html>
