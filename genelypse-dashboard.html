                onPointerDown={e=>e.stopPropagation()}
                style={{ flex:1, accentColor:GOLD, cursor:"pointer" }} />
              <span style={{ color:GRAY, fontSize:11, minWidth:30, textAlign:"right" }}>{_pn.w||180}px</span>
            </div>
          )}
          {/* Swimlane size controls */}
          {_pc.swimlane && (
            <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:8 }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Tamaño:</span>
              <span style={{ color:GRAY, fontSize:10 }}>Ancho</span>
              <input type="number" min={200} max={2000} step={20}
                value={_pn.w || _pc.defaultW || 680}
                onChange={e=>updateNodeProp(_pn.id,{w:Number(e.target.value)})}
                onPointerDown={e=>e.stopPropagation()}
                style={{ width:70, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:WHITE, fontSize:11, outline:"none" }} />
              <span style={{ color:GRAY, fontSize:10 }}>Alto</span>
              <input type="number" min={80} max={800} step={20}
                value={_pn.h || _pc.defaultH || 200}
                onChange={e=>updateNodeProp(_pn.id,{h:Number(e.target.value)})}
                onPointerDown={e=>e.stopPropagation()}
                style={{ width:70, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:WHITE, fontSize:11, outline:"none" }} />
            </div>
          )}
          {/* Badge tipo */}
          {!_pc.swimlane && (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Tipo:</span>
              {[
                { id:"manual",   label:"✋ Manual",   color:"#60A5FA" },
                { id:"auto",     label:"⚡ Auto",     color:"#A78BFA" },
                { id:"critical", label:"🔴 Crítico",  color:"#EF4444" },
              ].map(b => (
                <button key={b.id} onClick={()=>updateNodeProp(_pn.id,{badge: _pn.badge===b.id ? null : b.id})}
                  style={{ padding:"2px 9px", borderRadius:10, fontSize:10, cursor:"pointer", fontWeight:600,
                    background: _pn.badge===b.id ? b.color+"22" : "#222225",
                    color: _pn.badge===b.id ? b.color : GRAY,
                    border:`1px solid ${_pn.badge===b.id ? b.color : BORDER}` }}>
                  {b.label}
                </button>
              ))}
            </div>
          )}
          {/* Text field */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Texto:</span>
            <textarea
              value={_pn.text || ""}
              onChange={e=>updateNodeProp(_pn.id, { text: e.target.value })}
              placeholder="Texto del nodo..."
              rows={2}
              onPointerDown={e=>e.stopPropagation()}
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:11, outline:"none", resize:"vertical", fontFamily:"inherit" }}
            />
          </div>
          {/* Link field */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
            <span style={{ color:GRAY, fontSize:11, fontWeight:600, minWidth:50 }}>Link:</span>
            <input
              value={_pn.link || ""}
              onChange={e=>updateNodeProp(_pn.id, { link: e.target.value })}
              placeholder="https://... (aparece como botón en el nodo)"
              style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:11, outline:"none" }}
            />
            {_pn.link && <a href={_pn.link} target="_blank" rel="noreferrer"
              style={{ padding:"3px 10px", borderRadius:6, background:GOLD, color:"#141414", fontSize:11, fontWeight:700, textDecoration:"none", flexShrink:0 }}>
              Abrir →
            </a>}
          </div>
        </div>
      )}

      {/* Edge properties panel */}
      {selectedEdgeId && (() => {
        const edge = edges.find(e=>e.id===selectedEdgeId);
        if (!edge) return null;
        const updateEdge = (patch) => update({ ...flow, edges: edges.map(e=>e.id===selectedEdgeId?{...e,...patch}:e) });
        return (
          <div style={{ padding:"10px 14px", background:"#1A1A1D", border:`1px solid ${GOLD_DIM}`, borderRadius:8, marginBottom:6 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span style={{ color:GRAY, fontSize:11, fontWeight:600 }}>Conexión:</span>
              {[["bezier","~ Curva"],["straight","— Recta"],["step","⌐ Escala"]].map(([r,l])=>(
                <button key={r} onClick={()=>updateEdge({edgeRouting:r})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeRouting||"bezier")===r?GOLD:"#222225",
                    color:(edge.edgeRouting||"bezier")===r?"#141414":GRAY,
                    border:`1px solid ${(edge.edgeRouting||"bezier")===r?GOLD:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              {[["","━ Sólida"],["8,4","╌ Guiones"],["2,4","┄ Puntos"],["8,4,2,4","╍ Mixta"]].map(([d,l])=>(
                <button key={d} onClick={()=>updateEdge({edgeDash:d})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeDash||"")===d?GOLD_DIM:"#222225",
                    color:(edge.edgeDash||"")===d?WHITE:GRAY,
                    border:`1px solid ${(edge.edgeDash||"")===d?GOLD_DIM:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              {[[1.5,"Fina"],[2.5,"Media"],[4,"Gruesa"]].map(([w,l])=>(
                <button key={w} onClick={()=>updateEdge({edgeWidth:w})}
                  style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer",
                    background:(edge.edgeWidth||1.5)===w?GOLD_DIM:"#222225",
                    color:(edge.edgeWidth||1.5)===w?WHITE:GRAY,
                    border:`1px solid ${(edge.edgeWidth||1.5)===w?GOLD_DIM:BORDER}` }}>{l}</button>
              ))}
              <div style={{ width:1, background:BORDER, height:20 }} />
              <input type="color" value={edge.edgeColor||"#9B9B9F"} onChange={e=>updateEdge({edgeColor:e.target.value})}
                style={{ width:24, height:24, borderRadius:4, border:`1px solid ${BORDER}`, padding:0, cursor:"pointer" }} />
              <div style={{ width:1, background:BORDER, height:20 }} />
              {["Sí","No","Aprobado","Rechazado"].map(p=>(
                <button key={p} onClick={()=>updateEdge({label:p})}
                  style={{ padding:"2px 8px", borderRadius:10, fontSize:10, cursor:"pointer",
                    background: edge.label===p ? (p==="Sí"||p==="Aprobado") ? "rgba(76,175,125,0.2)" : "rgba(224,108,108,0.2)" : "#222225",
                    color: edge.label===p ? (p==="Sí"||p==="Aprobado") ? GREEN : RED : GRAY,
                    border:`1px solid ${edge.label===p ? (p==="Sí"||p==="Aprobado") ? GREEN : RED : BORDER}`,
                    fontWeight: edge.label===p ? 700 : 400 }}>{p}</button>
              ))}
              <input value={edge.label||""} onChange={e=>updateEdge({label:e.target.value})}
                placeholder="Etiqueta libre..."
                style={{ flex:1, minWidth:80, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 8px", color:WHITE, fontSize:11, outline:"none" }} />
              <button onClick={()=>{ update({...flow, edges:edges.filter(e=>e.id!==selectedEdgeId)}); setSelectedEdgeId(null); }}
                style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer", border:`1px solid ${RED}`, color:RED, background:"transparent" }}>✕</button>
              <button onClick={()=>setSelectedEdgeId(null)}
                style={{ padding:"2px 8px", borderRadius:5, fontSize:10, cursor:"pointer", border:`1px solid ${BORDER}`, color:GRAY, background:"transparent" }}>Cerrar</button>
            </div>
          </div>
        );
      })()}

      {/* Canvas */}
      <div ref={outerRef}
        style={{ flex:1, position:"relative", overflow:"hidden", borderRadius:10, border:`1px solid ${BORDER}`, background:CANVAS_BG, cursor: isPanning ? "grabbing" : (toolMode==="pan" ? "grab" : "default"), minHeight:isFullscreen ? "calc(100vh - 120px)" : 420, userSelect:"none" }}
        onPointerDown={onOuterPointerDown}
        onPointerMove={onOuterPointerMove}
        onPointerUp={onOuterPointerUp}
        onPointerLeave={onOuterPointerUp}
      >
        {/* Dot grid */}
        <div style={{ position:"absolute", inset:0, backgroundImage:`radial-gradient(${CANVAS_DOT} 1px, transparent 1px)`, backgroundSize:"20px 20px", pointerEvents:"none" }} />

        <div style={{ position:"absolute", width:3200, height:2400, transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`, transformOrigin:"0 0" }}>
          {/* Edges */}
          <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", overflow:"visible", pointerEvents:"none" }}>
            <defs>
              {edges.map(edge => (
                <marker key={edge.id} id={`arrow-${edge.id}`} markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <polygon points="0 0, 8 3, 0 6" fill={edge.edgeColor || "#9B9B9F"} />
                </marker>
              ))}
            </defs>
            {edges.map(edge => {
              const fc = getPortPt(edge.from, edge.to);
              const tc = getPortPt(edge.to, edge.from);
              if (!fc || !tc) return null;
              const mx = (fc.x+tc.x)/2, my = (fc.y+tc.y)/2;
              const col = edge.edgeColor || "#9B9B9F";
              const width = edge.edgeWidth || 1.5;
              const dash = edge.edgeDash || "";
              const isSelEdge = selectedEdgeId === edge.id;
              const routing = edge.edgeRouting || "bezier";
              let d;
              if (routing === "straight") {
                d = `M ${fc.x} ${fc.y} L ${tc.x} ${tc.y}`;
              } else if (routing === "step") {
                // Direction-aware: horizontal-first when exiting left/right, vertical-first when exiting top/bottom
                const hExit = fc.side === "left" || fc.side === "right";
                if (hExit) {
                  d = `M ${fc.x} ${fc.y} L ${mx} ${fc.y} L ${mx} ${tc.y} L ${tc.x} ${tc.y}`;
                } else {
                  d = `M ${fc.x} ${fc.y} L ${fc.x} ${my} L ${tc.x} ${my} L ${tc.x} ${tc.y}`;
                }
              } else {
                // Direction-aware bezier: control points follow the exit direction
                const dist = Math.max(Math.abs(tc.x-fc.x), Math.abs(tc.y-fc.y)) * 0.45 + 30;
                const c1x = fc.side==="left" ? fc.x-dist : fc.side==="right" ? fc.x+dist : fc.x;
                const c1y = fc.side==="top"  ? fc.y-dist : fc.side==="bottom" ? fc.y+dist : fc.y;
                const c2x = tc.side==="left" ? tc.x-dist : tc.side==="right" ? tc.x+dist : tc.x;
                const c2y = tc.side==="top"  ? tc.y-dist : tc.side==="bottom" ? tc.y+dist : tc.y;
                d = `M ${fc.x} ${fc.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tc.x} ${tc.y}`;
              }
              return (
                <g key={edge.id} style={{ pointerEvents:"auto" }} onClick={()=>{ setSelectedEdgeId(edge.id); setSelectedIds(new Set()); }}>
                  <path d={d} stroke="transparent" strokeWidth={16} fill="none" style={{ cursor:"pointer" }} />
                  <path d={d} stroke={isSelEdge ? GOLD : col} strokeWidth={isSelEdge ? width+1 : width}
                    fill="none" strokeDasharray={dash}
                    markerEnd={`url(#arrow-${edge.id})`} />
                  {edge.label && (() => {
                    const pad = 10, fSize = 11;
                    const approxW = edge.label.length * (fSize * 0.62) + pad * 2;
                    const bh = 20, bw = Math.max(approxW, 28);
                    return (
                      <g style={{ cursor:"pointer", userSelect:"none" }}
                        onClick={e=>{ e.stopPropagation(); setSelectedEdgeId(edge.id); setSelectedIds(new Set()); }}>
                        <rect x={mx - bw/2} y={my - bh - 2} width={bw} height={bh}
                          rx={bh/2} fill="#1A1A1E" stroke={isSelEdge ? GOLD : col} strokeWidth={isSelEdge ? 2 : 1.5}
                          filter="drop-shadow(0 1px 3px rgba(0,0,0,0.5))" />
                        <text x={mx} y={my - 7} textAnchor="middle"
                          fill={isSelEdge ? GOLD : col} fontSize={fSize} fontWeight="700"
                          style={{ userSelect:"none" }}>
                          {edge.label}
                        </text>
                      </g>
                    );
                  })()}
                </g>
              );
            })}
            {/* Rubber band selection rect */}
            {selectionRect && (() => {
              const rx = Math.min(selectionRect.x1, selectionRect.x2);
              const ry = Math.min(selectionRect.y1, selectionRect.y2);
              const rw = Math.abs(selectionRect.x2 - selectionRect.x1);
              const rh = Math.abs(selectionRect.y2 - selectionRect.y1);
              return <rect x={rx} y={ry} width={rw} height={rh}
                fill="rgba(96,165,250,0.1)" stroke="#60A5FA" strokeWidth={1}
                strokeDasharray="4,2" />;
            })()}
          </svg>

          {/* Nodes — swimlanes rendered first so they sit behind */}
          {[...nodes].sort((a,b)=>(NODE_TYPES[a.type]?.swimlane?-1:0)-(NODE_TYPES[b.type]?.swimlane?-1:0)).map(node => {
            const cfg = NODE_TYPES[node.type] || NODE_TYPES.speech;
            const isConnSrc = connectFrom === node.id;
            const isSelected = selectedIds.has(node.id);
            const matchesSearch = nodeSearch && node.text?.toLowerCase().includes(nodeSearch.toLowerCase());
            const nodeBg = node.customBg !== undefined ? (node.customBg || cfg.bg) : cfg.bg;
            const nodeTextColor = node.customBg ? (contrastColor(node.customBg) || cfg.color) : cfg.color;
            const shapeStyle = getShapeStyle(node.shape);
            const isClipped = ["diamond","hexagon","parallelogram"].includes(node.shape);
            const bw = cfg.thick ? 5 : 2;
            const borderStyle = isClipped
              ? { border:"none", filter: matchesSearch ? `drop-shadow(0 0 0 3px #60A5FA) drop-shadow(0 0 8px #60A5FA66)` : isSelected ? `drop-shadow(0 0 0 2.5px ${GOLD})` : `drop-shadow(0 0 0 1.5px ${cfg.border})` }
              : cfg.note
                ? { borderTop:"none", borderRight:"none", borderBottom:"none", borderLeft:`3px solid ${isSelected?GOLD:cfg.border}`, borderRadius:0, boxShadow: isSelected?`0 0 0 2px ${GOLD}44`:"none" }
                : { border:`${bw}px solid ${matchesSearch ? "#60A5FA" : isSelected ? GOLD : isConnSrc ? "#60A5FA" : cfg.border}`, boxShadow: matchesSearch ? `0 0 0 3px #60A5FA, 0 0 12px #60A5FA66` : (isSelected ? `0 0 0 3px ${GOLD}44` : "0 2px 8px rgba(0,0,0,0.12)") };
            if (cfg.swimlane) {
              const sw = node.w || cfg.defaultW || 680;
              const sh = node.h || cfg.defaultH || 200;
              return (
                <div key={node.id}
                  style={{ position:"absolute", left:node.x, top:node.y, width:sw, height:sh,
                    background:nodeBg, border:`2px solid ${isSelected?GOLD:cfg.border}`,
                    borderRadius:8, cursor:"move", userSelect:"none",
                    boxShadow: isSelected?`0 0 0 3px ${GOLD}44`:"0 2px 12px rgba(0,0,0,0.08)" }}
                  onPointerDown={e=>onNodePointerDown(e,node.id)}>
                  {/* Label bar */}
                  <div style={{ position:"absolute", left:0, top:0, bottom:0, width:34,
                    background:`${cfg.border}22`, borderRight:`2px solid ${cfg.border}`,
                    borderRadius:"6px 0 0 6px", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    {editingNodeId===node.id ? (
                      <input autoFocus defaultValue={node.text}
                        onBlur={e=>{ update({...flow,nodes:nodes.map(n=>n.id===node.id?{...n,text:e.target.value}:n)}); setEditingNodeId(null); }}
                        style={{ writingMode:"vertical-rl", transform:"rotate(180deg)", background:"transparent", border:"none", outline:"none", color:cfg.color, fontSize:12, fontWeight:700, width:160, textAlign:"center" }}
                        onPointerDown={e=>e.stopPropagation()} />
                    ) : (
                      <span style={{ writingMode:"vertical-rl", transform:"rotate(180deg)", color:cfg.color, fontSize:12, fontWeight:700, letterSpacing:0.5 }}
                        onDoubleClick={e=>{ e.stopPropagation(); setEditingNodeId(node.id); }}>
                        {node.text}
                      </span>
                    )}
                  </div>
                  {/* Content hint */}
                  <div style={{ position:"absolute", left:42, top:8, color:cfg.border, fontSize:10, opacity:0.5, fontStyle:"italic" }}>
                    arrastrar nodos aquí
                  </div>
                  <button onClick={e=>{ e.stopPropagation(); deleteNode(node.id); }}
                    style={{ position:"absolute", top:4, right:6, background:"none", border:"none", color:cfg.color, opacity:0.4, cursor:"pointer", fontSize:13, padding:0 }}>×</button>
                </div>
              );
            }

            return (
              <div key={node.id}
                style={{
                  position:"absolute", left:node.x, top:node.y, width: node.w || 180, minHeight:56,
                  background:nodeBg,
                  padding:"8px 10px", cursor:"move",
                  userSelect:"none",
                  ...shapeStyle,
                  ...borderStyle,
                }}
                onPointerDown={e=>onNodePointerDown(e,node.id)}
              >
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:3 }}>
                  <span style={{ fontSize:9, fontWeight:700, color:nodeTextColor, opacity:0.6, textTransform:"uppercase", letterSpacing:0.5 }}>{cfg.label}</span>
                  {node.badge && (() => {
                    const BADGES = { manual:{ icon:"✋", color:"#60A5FA" }, auto:{ icon:"⚡", color:"#A78BFA" }, critical:{ icon:"🔴", color:"#EF4444" } };
                    const b = BADGES[node.badge];
                    return b ? <span style={{ fontSize:10, background:b.color+"22", color:b.color, border:`1px solid ${b.color}55`, borderRadius:8, padding:"0px 5px", fontWeight:700, lineHeight:1.6 }}>{b.icon}</span> : null;
                  })()}
                </div>
                {editingNodeId === node.id ? (
                  <textarea autoFocus defaultValue={node.text}
                    onBlur={e=>{ update({...flow,nodes:nodes.map(n=>n.id===node.id?{...n,text:e.target.value}:n)}); setEditingNodeId(null); }}
                    style={{ width:"100%", background:"transparent", border:"none", outline:"none", color:nodeTextColor, fontSize: node.fontSize || 12, resize:"none", fontFamily:"inherit", fontWeight: node.bold ? 700 : 400, textAlign: node.textAlign || "left" }}
                    rows={3}
                    onPointerDown={e=>e.stopPropagation()}
                  />
                ) : (
                  <div style={{ fontSize: node.fontSize || 12, color:nodeTextColor, lineHeight:1.4, fontWeight: node.bold ? 700 : 400, textAlign: node.textAlign || "left" }}
                    onDoubleClick={e=>{ e.stopPropagation(); setEditingNodeId(node.id); }}>
                    {node.text}
                  </div>
                )}
                <button onClick={e=>{ e.stopPropagation(); deleteNode(node.id); }}
                  style={{ position:"absolute", top:3, right:4, background:"none", border:"none", color:nodeTextColor, opacity:0.45, cursor:"pointer", fontSize:13, padding:0, lineHeight:1 }}>×</button>
              </div>
            );
          })}
        </div>


        {/* Hint */}
        {nodes.length === 0 && (
          <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none" }}>
            <div style={{ textAlign:"center", color:"#999" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>+</div>
              <div style={{ fontSize:13 }}>Agrega nodos con la barra de herramientas</div>
              <div style={{ fontSize:11, marginTop:4 }}>Arrastrar canvas para mover · Scroll para zoom · Doble clic en nodo para editar</div>
            </div>
          </div>
        )}
      </div>

      {/* Analysis panel */}
      {showAnalysis && (
        <div style={{ marginTop:12, background:CARD, border:`1px solid ${GOLD_DIM}`, borderRadius:10, padding:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:GOLD, fontWeight:600, fontSize:13 }}>
              {aiResult ? `✦ Análisis · ${clientName}` : "Datos del proceso para análisis"}
            </span>
            <div style={{ display:"flex", gap:8 }}>
              {aiResult && (
                <button onClick={()=>{ setAiResult(null); setAiError(null); }}
                  style={{ padding:"5px 12px", background:"transparent", color:GRAY, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:12 }}>
                  Limpiar
                </button>
              )}
              <button onClick={()=>navigator.clipboard.writeText(aiResult || analysisText).then(()=>alert("¡Copiado!"))}
                style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontWeight:700 }}>
                Copiar
              </button>
            </div>
          </div>

          {aiLoading && (
            <div style={{ color:GOLD, fontSize:13, padding:"16px 0", textAlign:"center" }}>Consultando a Claude…</div>
          )}

          {aiError && (
            <div style={{ color:RED, fontSize:12, marginBottom:8, padding:"8px 12px", background:"rgba(224,108,108,0.08)", borderRadius:6 }}>
              {aiError}
              {!apiKey && <span> — <strong>Configura tu API key en la pestaña Configuración.</strong></span>}
            </div>
          )}

          {aiResult ? (
            <pre style={{ background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, fontSize:12, color:WHITE, whiteSpace:"pre-wrap", lineHeight:1.6, overflowY:"auto", maxHeight:360 }}>
              {aiResult}
            </pre>
          ) : !aiLoading && (
            <>
              {!apiKey && (
                <p style={{ color:GOLD, fontSize:11, marginBottom:8 }}>
                  Sin API key activa — copia el bloque y pégalo en Claude, o configura tu key en Configuración para análisis directo.
                </p>
              )}
              <pre style={{ background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:8, padding:12, fontSize:11, color:WHITE, overflowX:"auto", whiteSpace:"pre-wrap", maxHeight:300, overflowY:"auto" }}>
                {analysisText}
              </pre>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PROCESO COMERCIAL TAB ────────────────────────────────────────────────────
function ProcesoComercialTab({ client, onChange, apiKey, flowTemplates, onSaveTemplate, onDeleteTemplate }) {
  const flows = Array.isArray(client.flows) ? client.flows : [];
  const [activeFlowId, setActiveFlowId] = useState(flows[0]?.id || null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const [showTemplates, setShowTemplates] = useState(false);
  const activeFlow = flows.find(f=>f.id===activeFlowId) || flows[0];

  const addFlow = () => {
    const name = window.prompt("Nombre del proceso:", "Proceso comercial v" + (flows.length+1));
    if (!name) return;
    const nf = { id:uid(), name, createdAt:Date.now(), nodes:[], edges:[] };
    const updated = { ...client, flows: [...flows, nf] };
    onChange(updated);
    setActiveFlowId(nf.id);
  };

  const deleteFlow = (id) => {
    if (flows.length === 1) { alert("Debe quedar al menos un proceso."); return; }
    if (!confirm("¿Eliminar este proceso?")) return;
    const updated = { ...client, flows: flows.filter(f=>f.id!==id) };
    onChange(updated);
    if (activeFlowId === id) setActiveFlowId(updated.flows[0]?.id);
  };

  const updateFlow = (updatedFlow) => {
    onChange({ ...client, flows: flows.map(f=>f.id===updatedFlow.id ? updatedFlow : f) });
  };

  const startRename = (f) => { setRenamingId(f.id); setRenameVal(f.name); };
  const commitRename = () => {
    if (renameVal.trim()) onChange({ ...client, flows: flows.map(f=>f.id===renamingId ? {...f,name:renameVal.trim()} : f) });
    setRenamingId(null);
  };

  const handleSaveTemplate = () => {
    if (!activeFlow) return;
    const name = window.prompt("Nombre del template:", activeFlow.name || "Mi template");
    if (!name) return;
    onSaveTemplate(name, activeFlow);
  };

  const handleLoadTemplate = (template) => {
    if (!activeFlow) return;
    if (!confirm(`¿Cargar template "${template.name}"? Se reemplazarán los nodos del proceso actual.`)) return;
    const idMap = {};
    const newNodes = template.nodes.map(n => { const newId=uid(); idMap[n.id]=newId; return {...n,id:newId}; });
    const newEdges = template.edges.map(ed => ({ ...ed, id:uid(), from:idMap[ed.from]||ed.from, to:idMap[ed.to]||ed.to }));
    updateFlow({ ...activeFlow, nodes:newNodes, edges:newEdges });
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", minHeight:600 }}>
      {/* Header */}
      <div style={{ background:"#0a0a0b", border:`1px solid ${GOLD}22`, borderLeft:`4px solid ${GOLD}`, borderRadius:10, padding:"12px 16px", marginBottom:14 }}>
        <div style={{ color:GOLD_DIM, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Visualización</div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:-0.2 }}>Proceso Comercial</div>
          <span style={{ color:GRAY, fontSize:11 }}>{flows.length} proceso{flows.length!==1?"s":""} · doble clic para renombrar</span>
        </div>
      </div>
      {/* Flow selector */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12, alignItems:"center" }}>
        {flows.map(f => (
          <div key={f.id} style={{ display:"flex", alignItems:"center", gap:2 }}>
            {renamingId === f.id ? (
              <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                onBlur={commitRename} onKeyDown={e=>{ if(e.key==="Enter") commitRename(); if(e.key==="Escape") setRenamingId(null); }}
                style={{ padding:"3px 8px", borderRadius:6, border:`1px solid ${GOLD}`, background:"#111113", color:WHITE, fontSize:12, outline:"none", minWidth:120 }} />
            ) : (
              <button onClick={()=>setActiveFlowId(f.id)} onDoubleClick={()=>startRename(f)}
                style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:500,
                  background: activeFlowId===f.id ? GOLD : "#222225", color: activeFlowId===f.id ? "#141414" : GRAY,
                  border:`1px solid ${activeFlowId===f.id ? GOLD : BORDER}` }}>
                {f.name}
              </button>
            )}
            <button onClick={()=>deleteFlow(f.id)}
              style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:12, padding:"2px 3px" }}>×</button>
          </div>
        ))}
        <button onClick={addFlow}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent", color:GOLD, border:`1px dashed ${GOLD_DIM}` }}>
          + Nuevo proceso
        </button>
        <div style={{ flex:1 }} />
        <button onClick={()=>setShowTemplates(s=>!s)}
          style={{ padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer",
            background: showTemplates ? "rgba(139,92,246,0.12)" : "#222225",
            color: showTemplates ? GOLD : GRAY,
            border:`1px solid ${showTemplates ? GOLD_DIM : BORDER}` }}>
          📋 Templates
        </button>
      </div>

      {/* Templates panel */}
      {showTemplates && (
        <div style={{ background:"#1A1A1D", border:`1px solid ${BORDER}`, borderRadius:8, padding:14, marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>Templates de proceso</span>
            <button onClick={handleSaveTemplate}
              style={{ padding:"5px 14px", background:GOLD, color:"#141414", border:"none", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:12 }}>
              + Guardar como template
            </button>
          </div>
          {(!flowTemplates || flowTemplates.length === 0) ? (
            <div style={{ color:GRAY, fontSize:12, padding:"8px 0" }}>No hay templates guardados. Guarda el proceso actual como template.</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {flowTemplates.map(t => (
                <div key={t.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", background:"rgba(255,255,255,0.02)", border:`1px solid ${BORDER}`, borderRadius:6 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:12, color:WHITE, fontWeight:500 }}>{t.name}</div>
                    <div style={{ fontSize:10, color:GRAY }}>{t.nodes.length} nodos · {t.edges.length} conexiones · {new Date(t.createdAt).toLocaleDateString("es-CO")}</div>
                  </div>
                  <button onClick={()=>handleLoadTemplate(t)}
                    style={{ padding:"4px 10px", borderRadius:5, fontSize:11, cursor:"pointer", background:GOLD, color:"#141414", border:"none", fontWeight:600 }}>
                    Cargar
                  </button>
                  <button onClick={()=>onDeleteTemplate(t.id)}
                    style={{ padding:"4px 8px", borderRadius:5, fontSize:11, cursor:"pointer", border:`1px solid ${RED}`, color:RED, background:"transparent" }}>✕</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {activeFlow && (
        <FlowCanvas
          flow={activeFlow}
          clientName={client.name}
          clientProfile={client.profile}
          clientTasks={client.tasks}
          onUpdate={updateFlow}
          apiKey={apiKey}
        />
      )}
    </div>
  );
}

function orgToRolesSummary(orgData) {
  if (!orgData) return "";
  // Legacy structured format
  if (orgData.areas) {
    const lines = [];
    if (orgData.ceo) lines.push(`${orgData.ceo.name} — ${orgData.ceo.title}`);
    orgData.areas.forEach(a => {
      lines.push(`\n${a.name.toUpperCase()} (${a.pct})`);
      a.roles.forEach(r => {
        const icon = r.status==="active" ? "✅" : r.status==="outsourced" ? "🔗" : "⏳";
        lines.push(`  ${icon} ${r.name}: ${r.desc}`);
      });
    });
    return lines.join("\n");
  }
  // Flow format (new canvas-based)
  if (!orgData.nodes) return "";
  const nodes = orgData.nodes;
  const edges = orgData.edges || [];
  const lines = [];
  const ceo = nodes.find(n => n.type === "inicio");
  if (ceo?.text) lines.push(ceo.text.split('\n')[0]);
  const ceoEdges = edges.filter(e => e.from === ceo?.id);
  ceoEdges.forEach(ce => {
    const area = nodes.find(n => n.id === ce.to);
    if (!area?.text) return;
    lines.push(`\n${area.text.split('\n')[0]}`);
    edges.filter(e => e.from === area.id).forEach(ae => {
      const role = nodes.find(n => n.id === ae.to);
      if (!role?.text) return;
      const icon = role.type==="accion" ? "✅" : role.type==="alerta" ? "⏳" : "🔗";
      const parts = role.text.split('\n');
      lines.push(`  ${icon} ${parts[0]}${parts[1] ? ': '+parts[1] : ''}`);
    });
  });
  return lines.join("\n");
}

  const totalItems = tasksTotal + issuesTotal;
  const totalDone = tasksDone + issuesDone;
  const efectividad = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;

  const comerciales = client.comerciales || [];
  const visits = [...(client.visits||[])].sort((a,b)=>b.date.localeCompare(a.date));

          <div style={{ fontSize:11, color:GRAY, marginTop:6 }}>{totalDone}/{totalItems || 0} completadas</div>
        </div>
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"16px 16px" }}>
          <div style={{ color:GRAY, fontSize:10, fontWeight:700, letterSpacing:1.5, textTransform:"uppercase", marginBottom:6 }}>Tareas onboarding</div>
          <div style={{ fontSize:30, fontWeight:900, color:WHITE, lineHeight:1 }}>{tasksDone}/{tasksTotal}</div>
          <div style={{ fontSize:11, color:GRAY, marginTop:6 }}>Checklist de ejecución</div>

        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"16px 16px" }}>

          <div style={{ fontSize:30, fontWeight:900, color:WHITE, lineHeight:1 }}>{visits.length}</div>
          <div style={{ fontSize:11, color:GRAY, marginTop:6 }}>Registradas en total</div>

      {/* Por comercial */}
      <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:18, marginBottom:18 }}>
        <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:12 }}>Tareas por comercial</div>
        {comerciales.length === 0 ? (
          <div style={{ color:GRAY, fontSize:12 }}>Esta empresa aún no tiene comerciales creados (agrégalos en la pestaña Perfil).</div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {byComercial.map(({comercial, total, done}) => {
              const pct = total ? Math.round(done/total*100) : 0;
              return (
                <div key={comercial.id} style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <span style={{ width:140, color:WHITE, fontSize:12.5, fontWeight:600, flexShrink:0 }}>👤 {comercial.name}</span>
                  <div style={{ flex:1, height:6, background:BORDER, borderRadius:3 }}>
                    <div style={{ height:6, width:`${pct}%`, background: pct>=80?GREEN:pct>=50?GOLD:"#E06C6C", borderRadius:3 }} />
                  </div>
                  <span style={{ fontSize:11, color:GRAY, minWidth:70, textAlign:"right" }}>{done}/{total} · {pct}%</span>
                </div>
              );
            })}
            {sinComercialAsignado.length > 0 && (
              <div style={{ fontSize:11, color:GRAY, marginTop:4 }}>+ {sinComercialAsignado.length} tarea(s) asignadas a "todos los comerciales".</div>
            )}
          </div>
        )}
      </div>

      {/* Visitas con usuarios */}
      <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:18 }}>
        <div style={{ color:WHITE, fontWeight:700, fontSize:13, marginBottom:12 }}>Visitas y usuarios</div>
        {visits.length === 0 ? (
          <div style={{ color:GRAY, fontSize:12 }}>Sin visitas registradas todavía.</div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {visits.map(v => {
              const u = (team||[]).find(m=>m.id===v.userId);
              return (
                <div key={v.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 0", borderBottom:`1px solid ${BORDER}33` }}>
                  <span style={{ fontSize:11, color:GREEN, minWidth:90 }}>{new Date(v.date+"T00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}</span>
                  <span style={{ fontSize:12.5, color:WHITE, fontWeight:600 }}>{u ? u.name : "—"}</span>
                  <span style={{ fontSize:11, color:GRAY, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{v.context || ""}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CLIENTS LIST ─────────────────────────────────────────────────────────────
function ClientsList({ clients, onSelect, onCreate, onDelete, teamPin }) {
  const [search, setSearch] = useState("");
  const [showModal, setShowModal] = useState(false);
  const [newName, setNewName] = useState("");
  const [newChannel, setNewChannel] = useState("Meta Ads");
  const [view, setView] = useState("cards");
  const [hoveredId, setHoveredId] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [deletePinInput, setDeletePinInput] = useState("");
  const [deletePinError, setDeletePinError] = useState(false);

  const requestDelete = (e, c) => {
    e.stopPropagation();
    setDeleteConfirm({ id: c.id, name: c.name });
    setDeletePinInput("");
    setDeletePinError(false);
  };

  const confirmDelete = () => {
    if (teamPin && deletePinInput !== teamPin) { setDeletePinError(true); return; }
    onDelete && onDelete(deleteConfirm.id);
    setDeleteConfirm(null);
    setDeletePinInput("");
  };

  const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));

  const handleCreate = () => {
    if (!newName.trim()) return;
    onCreate(newName.trim(), newChannel);
    setNewName(""); setNewChannel("Meta Ads"); setShowModal(false);
  };

  const getStage = (pct) => {
    if (pct === 0)   return { label:"Por iniciar", color:"#60A5FA" };
    if (pct < 50)    return { label:"En proceso",  color:GOLD };
    if (pct < 100)   return { label:"En cierre",   color:"#A78BFA" };
    return               { label:"Completado",  color:GREEN };
  };

  const nextMeeting = (c) => {
    const now = new Date();
    const m = (c.meetings||[]).filter(m=>new Date(m.date)>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];
    return m ? new Date(m.date).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—";
  };

  const KANBAN_STAGES = ["Por iniciar","En proceso","En cierre","Completado"];

  return (
    <div>
      {/* Delete confirmation modal */}
      {deleteConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div style={{ background:"#1A1A1D", border:"1px solid rgba(239,68,68,0.4)", borderRadius:12, padding:24, width:"100%", maxWidth:400 }}>
            <div style={{ fontSize:24, marginBottom:8 }}>🗑️</div>
            <div style={{ color:WHITE, fontWeight:700, fontSize:16, marginBottom:6 }}>Eliminar empresa</div>
            <div style={{ color:GRAY, fontSize:13, marginBottom:16, lineHeight:1.5 }}>
              Estás por eliminar a <strong style={{ color:WHITE }}>{deleteConfirm.name}</strong>. Esta acción no se puede deshacer y se perderán todos los datos, tareas y procesos de la empresa.
            </div>
            {teamPin && (
              <div style={{ marginBottom:14 }}>
                <div style={{ color:GRAY, fontSize:12, marginBottom:6 }}>Ingresá tu PIN para confirmar:</div>
                <input type="password" value={deletePinInput} onChange={e=>{ setDeletePinInput(e.target.value); setDeletePinError(false); }}
                  placeholder="PIN" autoFocus
                  style={{ width:"100%", background:BG, border:`1px solid ${deletePinError?"#EF4444":BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:14, outline:"none", letterSpacing:4 }} />
                {deletePinError && <div style={{ color:"#EF4444", fontSize:11, marginTop:5 }}>PIN incorrecto.</div>}
              </div>
            )}
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={()=>setDeleteConfirm(null)}
                style={{ padding:"8px 18px", borderRadius:7, fontSize:13, cursor:"pointer", background:"#222225", color:WHITE, border:`1px solid ${BORDER}` }}>
                Cancelar
              </button>
              <button onClick={confirmDelete} disabled={teamPin && !deletePinInput}
                style={{ padding:"8px 20px", borderRadius:7, fontSize:13, cursor:"pointer", background:"#EF4444", color:WHITE, border:"none", fontWeight:700, opacity: teamPin && !deletePinInput ? 0.5 : 1 }}>
                Eliminar definitivamente
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{ display:"flex", gap:10, marginBottom:20, alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar empresa..."
          style={{ flex:1, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"9px 14px", color:WHITE, fontSize:13, outline:"none" }} />
        {/* View toggle */}
        <div style={{ display:"flex", gap:2, background:"#111113", borderRadius:8, padding:3, border:`1px solid ${BORDER}` }}>
          {[["cards","▦ Cards"],["tabla","≡ Tabla"],["kanban","⬜ Kanban"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)}
              style={{ padding:"5px 12px", borderRadius:6, fontSize:12, cursor:"pointer", fontWeight:600,
                background:view===v?"linear-gradient(135deg,#8B5CF6,#6D4FC4)":"transparent",
                color:view===v?"#141414":GRAY, border:"none" }}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={()=>setShowModal(true)} className="gp-btn-gold"
          style={{ padding:"9px 20px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13, letterSpacing:0.2 }}>
          + Nueva empresa
        </button>
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 0", color:GRAY }}>
          {clients.length === 0 ? "No hay empresas. Crea la primera." : "Sin resultados."}
        </div>
      )}

      {/* ── CARDS VIEW ── */}
      {view === "cards" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:14 }}>
          {filtered.map(c => {
            const pct = overallPct(c.tasks);
            const isDone = pct === 100;
            const stage = getStage(pct);
            return (
              <div key={c.id}
                style={{ position:"relative", background:CARD, borderRadius:14, padding:"18px 16px", cursor:"pointer",
                  border:`1px solid ${hoveredId===c.id?GOLD+"66":isDone?GREEN+"44":BORDER}`,
                  borderTop:`2px solid ${hoveredId===c.id?GOLD:isDone?GREEN:BORDER}`,
                  boxShadow: hoveredId===c.id ? "0 6px 24px rgba(0,0,0,0.4)" : "0 2px 10px rgba(0,0,0,0.2)",
                  transform: hoveredId===c.id ? "translateY(-2px)" : "none",
                  transition:"all 0.2s ease" }}
                onClick={()=>onSelect(c.id)}
                onMouseEnter={()=>setHoveredId(c.id)}
                onMouseLeave={()=>setHoveredId(null)}>
                {onDelete && hoveredId===c.id && (
                  <button onClick={e=>requestDelete(e,c)}
                    title="Eliminar empresa"
                    style={{ position:"absolute", top:10, right:10, background:"rgba(239,68,68,0.12)", border:"1px solid rgba(239,68,68,0.25)", color:"#EF4444", cursor:"pointer", borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700, lineHeight:1.4, zIndex:1 }}>
                    🗑
                  </button>
                )}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12, paddingRight: onDelete && hoveredId===c.id ? 28 : 0 }}>
                  <div>
                    <div style={{ color:WHITE, fontWeight:700, fontSize:15, letterSpacing:-0.2 }}>{c.name}</div>
                    <div style={{ color:GRAY, fontSize:11, marginTop:3 }}>{c.profile?.channel||"Meta Ads"}</div>
                  </div>
                  <span style={{ fontSize:10, fontWeight:700, color:stage.color, background:stage.color+"18", padding:"3px 9px", borderRadius:10, border:`1px solid ${stage.color}30` }}>{stage.label}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6 }}>
                  {WEEKS.map(w => {
                    const s = weekStats(c.tasks, w);
                    const wp = s.total ? Math.round(s.done/s.total*100) : 0;
                    return (
                      <div key={w}>
                        <div style={{ fontSize:9, color:GRAY, marginBottom:3 }}>{w.replace("Semana ","S")}</div>
                        <ProgressBar pct={wp} height={3} />
                        <div style={{ fontSize:9, color:GRAY, marginTop:2 }}>{s.done}/{s.total}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── TABLA VIEW ── */}
      {view === "tabla" && filtered.length > 0 && (
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ borderBottom:`1px solid ${BORDER}` }}>
                {["Cliente","Canal","Contrato","Inicio","Progreso","Etapa","Próx. reunión",""].map(h=>(
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, color:GRAY, fontWeight:600, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((c,i) => {
                const pct = overallPct(c.tasks);
                const stage = getStage(pct);
                return (
                  <tr key={c.id} onClick={()=>onSelect(c.id)}
                    style={{ borderBottom:`1px solid ${BORDER}`, cursor:"pointer", transition:"background 0.1s" }}
                    onMouseEnter={e=>e.currentTarget.style.background="#1E1E22"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <td style={{ padding:"10px 14px", color:WHITE, fontWeight:600, fontSize:13 }}>{c.name}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile?.channel||"Meta Ads"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile?.contractValue ? `$${Number(c.profile.contractValue).toLocaleString("es-CO")}` : "—"}</td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{c.profile?.startDate ? new Date(c.profile.startDate).toLocaleDateString("es-CO",{day:"2-digit",month:"short"}) : "—"}</td>
                    <td style={{ padding:"10px 14px" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <div style={{ flex:1, height:6, background:BORDER, borderRadius:3 }}>
                          <div style={{ height:6, width:`${pct}%`, background:stage.color, borderRadius:3 }} />
                        </div>
                        <span style={{ fontSize:11, color:stage.color, fontWeight:700, minWidth:32 }}>{pct}%</span>
                      </div>
                    </td>
                    <td style={{ padding:"10px 14px" }}>
                      <span style={{ fontSize:11, color:stage.color, background:stage.color+"18", padding:"2px 8px", borderRadius:10, fontWeight:600 }}>{stage.label}</span>
                    </td>
                    <td style={{ padding:"10px 14px", color:GRAY, fontSize:12 }}>{nextMeeting(c)}</td>
                    <td style={{ padding:"6px 10px" }}>
                      {onDelete && (
                        <button onClick={e=>{ e.stopPropagation(); requestDelete(e,c); }}
                          style={{ background:"rgba(239,68,68,0.1)", border:"none", color:"#EF4444", cursor:"pointer", borderRadius:6, padding:"4px 8px", fontSize:12 }}>
                          🗑
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ── KANBAN VIEW ── */}
      {view === "kanban" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, alignItems:"start" }}>
          {KANBAN_STAGES.map(stage => {
            const stagePcts = { "Por iniciar":[0,0], "En proceso":[1,49], "En cierre":[50,99], "Completado":[100,100] };
            const [min,max] = stagePcts[stage];
            const stageClients = filtered.filter(c=>{ const p=overallPct(c.tasks); return p>=min&&p<=max; });
            const stageColor = getStage(min===0&&max===0?0:min===1?1:min===50?50:100).color;
            return (
              <div key={stage}>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
                  <span style={{ width:8, height:8, borderRadius:"50%", background:stageColor, display:"inline-block" }} />
                  <span style={{ color:WHITE, fontWeight:600, fontSize:13 }}>{stage}</span>
                  <span style={{ color:GRAY, fontSize:11, marginLeft:"auto" }}>{stageClients.length}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {stageClients.map(c => {
                    const pct = overallPct(c.tasks);
                    return (
                      <div key={c.id} style={{ position:"relative", background:CARD, border:`1px solid ${hoveredId===c.id?stageColor:BORDER}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", transition:"border-color 0.15s" }}
                        onClick={()=>onSelect(c.id)}
                        onMouseEnter={()=>setHoveredId(c.id)}
                        onMouseLeave={()=>setHoveredId(null)}>
                        {onDelete && hoveredId===c.id && (
                          <button onClick={e=>requestDelete(e,c)}
                            style={{ position:"absolute", top:8, right:8, background:"rgba(239,68,68,0.15)", border:"none", color:"#EF4444", cursor:"pointer", borderRadius:5, padding:"2px 6px", fontSize:11, lineHeight:1.4 }}>
                            🗑
                          </button>
                        )}
                        <div style={{ color:WHITE, fontWeight:600, fontSize:13, marginBottom:4, paddingRight: onDelete && hoveredId===c.id ? 26 : 0 }}>{c.name}</div>
                        <div style={{ color:GRAY, fontSize:11, marginBottom:8 }}>{c.profile?.channel||"Meta Ads"}</div>
                        <div style={{ height:4, background:BORDER, borderRadius:2 }}>
                          <div style={{ height:4, width:`${pct}%`, background:stageColor, borderRadius:2 }} />
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
                          <span style={{ fontSize:10, color:GRAY }}>{nextMeeting(c)}</span>
                          <span style={{ fontSize:10, color:stageColor, fontWeight:700 }}>{pct}%</span>
                        </div>
                      </div>
                    );
                  })}
                  {stageClients.length === 0 && (
                    <div style={{ border:`1px dashed ${BORDER}`, borderRadius:10, padding:"20px 0", textAlign:"center", color:GRAY, fontSize:11 }}>Sin clientes</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showModal && (
        <Modal title="Nueva empresa" onClose={()=>setShowModal(false)}>
          <Input label="Nombre de la empresa" value={newName} onChange={setNewName} placeholder="Empresa S.A.S." />
          <div style={{ marginBottom:16 }}>
            <label style={{ display:"block", color:GRAY, fontSize:12, marginBottom:4 }}>Canal de adquisición</label>
            <select value={newChannel} onChange={e=>setNewChannel(e.target.value)}
              style={{ width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:13, outline:"none" }}>
              {CHANNELS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <button onClick={handleCreate} style={{ width:"100%", padding:"10px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:14 }}>
            Crear empresa
          </button>
        </Modal>
      )}
    </div>
  );
}

function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
  const y = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-y)/86400000)+1)/7);
}

// ─── ENTRENAMIENTO SECTION ────────────────────────────────────────────────────
function EntrenamientoSection({ personal, onUpdate }) {
  const { useState: us } = React;
  const trainingLogs = personal.trainingLogs || {};
  const bodyLogs     = personal.bodyLogs     || {};
  const measurements = personal.measurements  || [];
  const manualPRs    = personal.manualPRs    || {};

  const today    = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const dowMap   = { 1:"lun",2:"mar",3:"mie",4:"jue",5:"vie",6:"sab" };
  const todayId  = dowMap[today.getDay()] || "lun";

  const [subTab,       setSubTab]       = us("sesion");
  const [selDayId,     setSelDayId]     = us(todayId);
  const [openExId,     setOpenExId]     = us(null);
  const [inputW,       setInputW]       = us("");
  const [inputR,       setInputR]       = us("");
  const [inputRIR,     setInputRIR]     = us("1");
  const [dfStage,      setDfStage]      = us(1); // 1=DF1, 2=DF2
  const [weekOffset,   setWeekOffset]   = us(0);
  // cuerpo inputs
  const [bw,   setBw]   = us(bodyLogs[todayStr]?.weight   || "");
  const [kcal, setKcal] = us(bodyLogs[todayStr]?.calories || "");
  const [prot, setProt] = us(bodyLogs[todayStr]?.protein  || "");
  const [slp,  setSlp]  = us(bodyLogs[todayStr]?.sleep    || "");
  const [pain, setPain] = us(bodyLogs[todayStr]?.pain     || "");
  const [fat,  setFat]  = us(bodyLogs[todayStr]?.fatigue  || "");
  const [mDate,setMDate]= us("");
  const [mArm, setMArm] = us("");
  const [mLeg, setMLeg] = us("");
  const [mWst, setMWst] = us("");

  const selDay = PPL_PLAN.find(d=>d.id===selDayId);
  const todayLog = trainingLogs[todayStr]?.[selDayId] || { completed:false, exercises:{} };

  const getSets = (exId) => todayLog.exercises?.[exId]?.sets || [];

  const setLog = (patch) => {
    const newLog = { ...todayLog, ...patch };
    onUpdate({ trainingLogs: { ...trainingLogs, [todayStr]: { ...(trainingLogs[todayStr]||{}), [selDayId]: newLog } } });
  };

  const addSet = (exId, type) => {
    const w = parseFloat(inputW); const r = parseInt(inputR);
    if (!w||!r) return;
    const sets = [...getSets(exId), { type, weight:w, reps:r, rir:parseInt(inputRIR)||0 }];
    setLog({ exercises: { ...todayLog.exercises, [exId]:{ sets } } });
    setInputW(""); setInputR("");
    if (type==="DF1") setDfStage(2);
    else { setDfStage(1); setOpenExId(null); }
  };

  const removeLastSet = (exId) => {
    const sets = getSets(exId).slice(0,-1);
    setLog({ exercises: { ...todayLog.exercises, [exId]:{ sets } } });
    if (selDay?.exercises.find(e=>e.id===exId)?.doubleF) setDfStage(sets.filter(s=>s.type==="DF1").length>sets.filter(s=>s.type==="DF2").length?2:1);
  };

  // PRs
  const getPR = (exId) => {
    let best = null;
    Object.entries(trainingLogs).forEach(([date, sess]) => {
      Object.values(sess).forEach(s => {
        (s.exercises?.[exId]?.sets||[]).filter(st=>st.type==="N").forEach(st => {
          if (!best || st.weight > best.weight || (st.weight===best.weight && st.reps>best.reps))
            best = { weight:st.weight, reps:st.reps, date };
        });
      });
    });
    return best;
  };

  // Effective volume for week
  const getVolume = (offset) => {
    const vol = {};
    Object.entries(trainingLogs).forEach(([date, daySess]) => {
      const d = new Date(date);
      if (isoWeek(d) !== isoWeek(new Date(Date.now() - offset*7*86400000))) return;
      Object.values(daySess).forEach(sess => {
        Object.entries(sess.exercises||{}).forEach(([exId, exData]) => {
          let muscle = "Otro";
          PPL_PLAN.forEach(day => { const ex = day.exercises.find(e=>e.id===exId); if(ex) muscle=ex.muscle; });
          const sets = exData.sets||[];
          const nSets = sets.filter(s=>s.type==="N").length;
          const df1 = sets.filter(s=>s.type==="DF1").length;
          const df2 = sets.filter(s=>s.type==="DF2").length;
          const eff = nSets + Math.min(df1,df2)*1.5 + Math.abs(df1-df2)*0.75;
          vol[muscle] = (vol[muscle]||0) + eff;
        });
      });
    });
    return vol;
  };

  // Progression
  const getProgression = (exId, repsMin, repsMax) => {
    const sessions = [];
    Object.entries(trainingLogs).sort().reverse().forEach(([date, daySess]) => {
      Object.values(daySess).forEach(sess => {
        const sets = (sess.exercises?.[exId]?.sets||[]).filter(s=>s.type==="N");
        if (sets.length) sessions.push(sets);
      });
    });
    if (sessions.length < 2) return "datos";
    const allMaxLast = sessions[0].every(s=>s.reps>=repsMax);
    const allMaxPrev = sessions[1].every(s=>s.reps>=repsMax);
    const anyLowLast = sessions[0].some(s=>s.reps<repsMin);
    const anyLowPrev = sessions[1].some(s=>s.reps<repsMin);
    if (allMaxLast && allMaxPrev) return "subir";
    if (anyLowLast && anyLowPrev) return "bajar";
    return "mantener";
  };

  const saveBodyLog = () => {
    const prev = bodyLogs[todayStr] || {};
    const entry = { ...prev,
      weight:parseFloat(bw)||null, calories:parseInt(kcal)||null,
      protein:parseInt(prot)||null, sleep:parseFloat(slp)||null,
      pain:parseInt(pain)||null, fatigue:parseInt(fat)||null,
    };
    onUpdate({ bodyLogs: { ...bodyLogs, [todayStr]: entry } });
  };

  const saveMeasurement = () => {
    if (!mDate) return;
    const entry = { date:mDate, arm:parseFloat(mArm)||null, leg:parseFloat(mLeg)||null, waist:parseFloat(mWst)||null };
    const existing = measurements.filter(m=>m.date!==mDate);
    onUpdate({ measurements: [...existing, entry].sort((a,b)=>a.date.localeCompare(b.date)) });
    setMDate(""); setMArm(""); setMLeg(""); setMWst("");
  };

  const tabs = [["sesion","Sesión"],["volumen","Volumen"],["alertas","Alertas"],["cuerpo","Cuerpo"]];
  const inp = (v,s,ph,w=70) => (
    <input value={v} onChange={e=>s(e.target.value)} placeholder={ph}
      style={{ width:w, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"5px 8px", color:WHITE, fontSize:12, outline:"none" }} />
  );

  const vol = subTab==="volumen" ? getVolume(weekOffset) : {};

  return (
    <div>
      {/* Sub-tabs */}
      <div style={{ display:"flex", gap:0, marginBottom:18, borderBottom:`1px solid ${BORDER}` }}>
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setSubTab(id)}
            className={`gp-nav-tab${subTab===id?" active":""}`}
            style={{ padding:"8px 14px" }}>
            {label}
          </button>
        ))}
      </div>

      {/* ── SESIÓN ── */}
      {subTab==="sesion" && (
        <div>
          {/* Day selector */}
          <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap" }}>
            {PPL_PLAN.map(d=>{
              const isToday = d.id===todayId;
              const sel = d.id===selDayId;
              const done = trainingLogs[todayStr]?.[d.id]?.completed;
              return (
                <button key={d.id} onClick={()=>{ setSelDayId(d.id); setOpenExId(null); setDfStage(1); }}
                  style={{ padding:"8px 14px", borderRadius:10, border:`2px solid ${sel?d.color:BORDER}`,
                    background: sel ? d.color+"22" : "transparent", color:sel?d.color:GRAY, cursor:"pointer", fontSize:12, fontWeight:sel?700:400,
                    position:"relative" }}>
                  {d.emoji} {d.day}
                  {isToday && <span style={{ position:"absolute", top:-4, right:-4, width:8, height:8, background:GOLD, borderRadius:"50%", display:"block" }} />}
                  {done && <span style={{ marginLeft:4, color:"#22C55E" }}>✓</span>}
                </button>
              );
            })}
          </div>

          {/* Session header */}
          <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
            <span style={{ fontSize:20 }}>{selDay?.emoji}</span>
            <div>
              <div style={{ color:WHITE, fontWeight:700, fontSize:15 }}>{selDay?.session}</div>
              <div style={{ color:GRAY, fontSize:12 }}>{selDay?.day}</div>
            </div>
            {!todayLog.completed && (
              <button onClick={()=>setLog({ completed:true })}
                style={{ marginLeft:"auto", padding:"6px 14px", background:"#22C55E22", color:"#22C55E", border:"1px solid #22C55E55", borderRadius:8, cursor:"pointer", fontSize:12, fontWeight:600 }}>
                ✓ Sesión completa
              </button>
            )}

      {/* ── VOLUMEN ── */}

                    {weekPRs.map((pr,i)=>(
                      <div key={i} style={{ padding:"4px 10px", background:"#8B5CF622", border:`1px solid ${GOLD}44`, borderRadius:8 }}>

                        <span style={{ color:GOLD, fontSize:11, fontWeight:700, marginLeft:6 }}>{pr.weight}kg×{pr.reps}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Rating */}
              <div style={{ marginBottom:12 }}>
                <div style={{ color:GRAY, fontSize:11, marginBottom:6 }}>Calificación de la semana</div>
                <div style={{ display:"flex", gap:6 }}>

              </div>
            </div>

            {/* Historial de semanas */}
            {Object.keys(weeklyReflections).length > 1 && (
              <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:18, marginBottom:14 }}>

                  ref.rating || ref.prs || ref.note ? (

                <span style={{ color:WHITE, fontWeight:600 }}>Esa es la única diferencia que importa.</span>

            </div>
          </div>
