            </div>

            <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:18, marginBottom:20 }}>
              <div style={{ color:GOLD, fontWeight:700, fontSize:13, marginBottom:14 }}>Calculadora de Ingeniería Inversa</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
                <Input  label="Meta ($ a facturar)" value={calc.metaMonto} onChange={v=>updateCalc({metaMonto:v})} type="number" placeholder="ej. 100000" />
                <Select label="Período de la meta" value={calc.metaPeriodo||"año"} onChange={v=>updateCalc({metaPeriodo:v})}
                  options={[{value:"año",label:"En un año"},{value:"mes",label:"En un mes"},{value:"trimestre",label:"En un trimestre"}]} />
                <Input label="Valor promedio del cliente ($)"    value={calc.valorCliente}    onChange={v=>updateCalc({valorCliente:v})}    type="number" />
                <Input label="Tasa de Cierre — TC (%)"           value={calc.tasaCierre}       onChange={v=>updateCalc({tasaCierre:v})}      type="number" />
                <Input label="Tasa de Show Up — SUR (%)"         value={calc.tasaShowUp}       onChange={v=>updateCalc({tasaShowUp:v})}       type="number" />
                <Input label="Tasa de Agenda — TA (%)"           value={calc.tasaAgenda}       onChange={v=>updateCalc({tasaAgenda:v})}       type="number" />
                <Input label="Días de vacaciones/feriados al año" value={calc.diasVacaciones}  onChange={v=>updateCalc({diasVacaciones:v})}  type="number" />
                <Input label="Mensajes por tanda"                value={calc.mensajesPorTanda} onChange={v=>updateCalc({mensajesPorTanda:v})} type="number" />
                <Input label="Minutos por tanda"                 value={calc.minutosPorTanda}  onChange={v=>updateCalc({minutosPorTanda:v})}  type="number" />
              </div>
              <div style={{ color:GRAY, fontSize:10, lineHeight:1.5, marginTop:8, fontStyle:"italic" }}>
                Una "tanda" es una ronda de mensajes seguidos (ej. 10 mensajes bien elaborados en 20 minutos). Estos 2 campos solo se usan para convertir "Mensajes/día" en "Horas/día en prospección" — ajustalos a tu ritmo real de escritura.
              </div>

              <div style={{ color:GRAY, fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", margin:"18px 0 10px" }}>Resultado — cascada de la meta a la acción diaria</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:10 }}>
                {[
                  { label:"Clientes requeridos",                   val: fmt0(clientesRequeridos) },
                  { label:"Llamadas efectivas requeridas (÷TC)",   val: fmt0(llamadasRequeridas) },
                  { label:"Llamadas Agendadas necesarias (÷SUR)",  val: fmt0(llamadasNecesarias) },
                  { label:"Mensajes en el período (÷TA)",          val: fmt0(mensajesEnPeriodo) },
                  { label:"Días hábiles/año",                      val: fmt0(diasHabiles), dim:true },
                  { label:"Mensajes/día",                          val: fmt0(mensajesPorDia), highlight:true },
                  { label:"Horas/día en prospección",              val: fmt1(horasPorDia)+"h", highlight:true },
                ].map(({label,val,highlight,dim})=>(
                  <div key={label} style={{ background:"#0a0a0b", border:`1px solid ${highlight?GOLD_DIM:BORDER}`, borderRadius:10, padding:"12px 14px" }}>
                    <div style={{ color:GRAY, fontSize:9, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:5 }}>{label}</div>
                    <div style={{ color: highlight?GOLD:(dim?GRAY:WHITE), fontWeight:800, fontSize:18 }}>{val}</div>
                  </div>
                ))}
              </div>
              {(!metaMonto || !valorCliente) && (
                <div style={{ color:GRAY, fontSize:11, marginTop:12, padding:"10px 14px", background:"#111113", borderRadius:8 }}>
                  Completá la meta y el valor de cliente para ver el resultado.
                </div>
              )}

              <div style={{ marginTop:14, padding:"12px 14px", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8 }}>
                <div style={{ color:GRAY, fontSize:9, fontWeight:700, letterSpacing:1.5, textTransform:"uppercase", marginBottom:8 }}>Cómo se lee la cascada</div>
                <div style={{ color:GRAY, fontSize:11, lineHeight:1.7 }}>
                  <b style={{ color:WHITE }}>Clientes requeridos</b> = Meta ÷ Valor de cliente.{" "}
                  <b style={{ color:WHITE }}>Llamadas efectivas requeridas</b> = clientes que necesitás dividido tu Tasa de Cierre — son las llamadas que sí se presentan y con las que cerrás.{" "}
                  <b style={{ color:WHITE }}>Llamadas Agendadas necesarias</b> = esas llamadas efectivas divididas tu Show Up Rate — es la cantidad que tenés que lograr que la gente agende (mismo campo "Llamadas Agendadas" que ves en Proyección → Resumen Anual/Mensual), sabiendo que no todas se van a presentar.{" "}
                  <b style={{ color:WHITE }}>Mensajes en el período</b> = esas llamadas agendadas divididas tu Tasa de Agenda — cuántas conversaciones/mensajes necesitás mandar para que esa cantidad agende. Repartido en los días hábiles del año te da <b style={{ color:GOLD }}>Mensajes/día</b>, y con "mensajes por tanda" y "minutos por tanda" eso se traduce a <b style={{ color:GOLD }}>Horas/día</b> reales de trabajo.
                </div>
              </div>
            </div>

            <div style={{ color:GOLD, fontWeight:700, fontSize:13, marginBottom:4 }}>Las 6 Ocultas — framework para sostener la meta</div>
            <div style={{ color:GRAY, fontSize:11, marginBottom:14 }}>Definir una meta no alcanza por sí solo — responder estas 6 preguntas ayuda a entender su verdadera naturaleza.</div>
            <div style={{ display:"grid", gap:10 }}>
              {OCULTAS.map(({key,label,sub}) => {
                const o = seis[key] || { ref:"", notas:"" };
                return (
                  <div key={key} style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:10, padding:14 }}>
                    <div style={{ color:WHITE, fontWeight:700, fontSize:12, marginBottom:2 }}>{label} <span style={{ color:GRAY, fontWeight:400, fontSize:11 }}>· {sub}</span></div>
                    <div style={{ color:GRAY, fontSize:11, lineHeight:1.5, marginTop:6, marginBottom:8 }}>{o.ref}</div>
                    <textarea value={o.notas||""} onChange={e=>updateOculta(key,{notas:e.target.value})} placeholder="Notas propias sobre esta pregunta..."
                      style={{ width:"100%", minHeight:44, background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px", color:WHITE, fontSize:12, outline:"none", boxSizing:"border-box", resize:"vertical", fontFamily:"inherit" }} />
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ─── PROYECCIÓN SECTION ───────────────────────────────────────────────────────
function ProyeccionSection({ personal, onUpdate }) {
  const { useState: us } = React;
  const proy    = personal.proyeccion || {};
  const metas   = proy.metas   || {};
  const kpis    = proy.kpis    || {};
  const anual   = proy.anual   || {};
  const mensual = proy.mensual || {};
  const optim   = proy.optimizacion || {};
  const diario  = proy.diario  || {};
  const finance = personal.finance || {};
  const monthlyData = finance.monthlyData || {};
  const trm = (finance.salesConfig && finance.salesConfig.usdRate) || 4200;

  // ── Estado (todos los hooks declarados arriba, sin condicionales) ──
  const [view, setView] = us("anual");
  const [guiaOpen, setGuiaOpen] = us(true);
  const [expandedMetrica, setExpandedMetrica] = us(null);
  const [newAccInputs, setNewAccInputs] = us({});
  const emptyEntryForm = () => ({ date: new Date().toISOString().slice(0,10), inversionAds: "", gastosMarketing: "", comisionesVenta: "", leads: "", llamadas: "", llamadasCanceladas: "", noShows: "", llamadasEfectivas: "", feccu: "", feccp: "", becc: "", notas: "" });
  const [entryForm, setEntryForm] = us(emptyEntryForm());
  const [selMesN, setSelMesN] = us(null);
  const emptyPipelineForm = () => ({ nombre: "", fecha: new Date().toISOString().slice(0,10), estado: "por_confirmar", notas: "" });
  const [pipelineForm, setPipelineForm] = us(emptyPipelineForm());
  const emptyClienteForm = () => ({ nombre: "", fecha: new Date().toISOString().slice(0,10), fuente: "ads", valor: "", mesesMinimos: "" });
  const [clienteForm, setClienteForm] = us(emptyClienteForm());

  // ── Formatters ──
  const fmtUSD0 = (v) => (v || v===0) ? "$"+Math.round(v).toLocaleString("en-US") : "—";
  const fmtN    = (v) => (v || v===0) ? Math.round(v).toLocaleString("en-US") : "—";

  // ── Lógica reusada de FinanzasSection (replicada, no importada — mismo objeto personal.finance.monthlyData) ──
  const toCOP = (i) => {
    const amt = parseFloat(i.amount) || 0;
    return i.currency === "USD" ? amt * trm : amt;
  };
  const getCashCollected = (key) => {
    const md = monthlyData[key] || {};
    const ingresos = md.ingresos || [];
    if (ingresos.length > 0) return ingresos.reduce((s, i) => s + toCOP(i), 0);
    return md.cashCollected || 0;
  };
  const getTotalGastos = (key) => {
    const md = monthlyData[key] || {};
    const ledger = (md.egresos || []).reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
    if (md.egresos !== undefined) return ledger;
    const gastoCategories = finance.gastoCategories || { personales: [], profesionales: [], otros: [] };
    const allCats = [
      ...(gastoCategories.personales || []).map(c => `personales_${c}`),
      ...(gastoCategories.profesionales || []).map(c => `profesionales_${c}`),
      ...(gastoCategories.otros || []).map(c => `otros_${c}`),
    ];
    const gi = md.gastoItems || {};
    const cat = allCats.reduce((s, k) => s + (gi[k] || 0), 0);
    return cat > 0 ? cat : (md.gastos || 0);
  };
  const cashCollectedUSD = (key) => getCashCollected(key) / trm;
  const totalGastosUSD   = (key) => getTotalGastos(key) / trm;
  const monthKey = (year, monthIdx0) => `${year}-${String(monthIdx0 + 1).padStart(2, "0")}`;

  const currentYear = new Date().getFullYear();
  const facturacionAcumulada = Array.from({ length: 12 }, (_, m) => cashCollectedUSD(monthKey(currentYear, m))).reduce((a, b) => a + b, 0);
  const egresosAcumulados    = Array.from({ length: 12 }, (_, m) => totalGastosUSD(monthKey(currentYear, m))).reduce((a, b) => a + b, 0);

  // ── Fechas relativas (Mes 1 = mes de metas.startDate) ──
  const startDateStr = metas.startDate || "2026-07-21";
  const startYear  = parseInt(startDateStr.slice(0, 4), 10);
  const startMonth = parseInt(startDateStr.slice(5, 7), 10) - 1;
  const mesNKey = (n) => {
    const idx = startMonth + (n - 1);
    const y = startYear + Math.floor(idx / 12);
    const m = ((idx % 12) + 12) % 12;
    return `${y}-${String(m + 1).padStart(2, "0")}`;
  };
  const mesNForDate = (dateStr) => {
    if (!dateStr) return null;
    const y = parseInt(dateStr.slice(0, 4), 10), m = parseInt(dateStr.slice(5, 7), 10) - 1;
    return (y - startYear) * 12 + (m - startMonth) + 1;
  };

  // ── Updaters ──
  const updateProy   = (patch) => onUpdate({ proyeccion: { ...proy, ...patch } });
  const updateMetas  = (patch) => updateProy({ metas: { ...metas, ...patch } });
  const updateKpis   = (patch) => updateProy({ kpis: { ...kpis, ...patch } });
  const updateAnual  = (patch) => updateProy({ anual: { ...anual, ...patch } });
  const updateQuarter = (q, patch) => updateAnual({ quarters: { ...(anual.quarters || {}), [q]: { ...((anual.quarters || {})[q] || {}), ...patch } } });
  const updateMensual = (patch) => updateProy({ mensual: { ...mensual, ...patch } });
  const updateOptim   = (patch) => updateProy({ optimizacion: { ...optim, ...patch } });
  const updateDiario  = (patch) => updateProy({ diario: { ...diario, ...patch } });

  // ── Clientes cerrados — lista propia, independiente de las semanas de "Registrar semana" ──
  // Cada cliente se agrega con un solo click (misma lógica que "Leads pendientes de seguimiento":
  // se guarda apenas tocás "+ Agregar cliente", no hace falta después tocar "+ Agregar semana").
  // Tiene su propia fecha porque un cliente puede cerrar un día sin que ese día tenga una entrada
  // de gasto/funnel cargada (semana 100% orgánica, por ejemplo).
  const diarioClientes = diario.clientes || [];
  // Respaldo para semanas viejas (antes de este cambio): esas entradas solo tenían Cierres/Meses
  // Mínimos/Ing. Totales como números sueltos por semana, sin nombre ni fuente — acá se
  // reconstruyen como "clientes sin dato" (mismo ticket promedio, misma duración) para seguir
  // sumando exactamente igual que antes, sin perder ni un dato viejo.
  const legacyClientesDeEntrada = (e) => {
    const cCierres = parseFloat(e.cierres) || 0;
    if (cCierres <= 0) return [];
    const cIngresos = parseFloat(e.ingresosTotales) || 0;
    const cMesesMin = parseFloat(e.mesesMinimos) || 0;
    const ticket = cIngresos / cCierres;
    return Array.from({ length: cCierres }, (_, i) => ({ id: `legacy_${e.id}_${i}`, nombre: "", fuente: "sin_dato", valor: ticket, mesesMinimos: cMesesMin, fecha: e.date }));
  };
  const diarioEntries = diario.entries || [];
  const todosLosClientes = [...diarioClientes, ...diarioEntries.flatMap(legacyClientesDeEntrada)];
  const clientesForMesN = (n) => todosLosClientes.filter(c => mesNForDate(c.fecha) === n);

  // ── Ingresos recurrentes comprometidos (compartido entre Vista B y Vista D) ──
  // Por cada cliente cargado con Valor + Meses Mínimos, ese valor se repite esa cantidad de meses
  // desde la fecha del cierre — por cliente individual, no por semana entera, para que dos
  // cierres del mismo mes con plata o duración distinta no se promedien mal.
  const recurringByMesN = {};
  todosLosClientes.forEach(c => {
    const startN = mesNForDate(c.fecha);
    const meses = parseFloat(c.mesesMinimos) || 0;
    const valor = parseFloat(c.valor) || 0;
    if (!startN || meses <= 0 || valor <= 0) return;
    for (let i = 0; i < meses; i++) {
      const n = startN + i;
      recurringByMesN[n] = (recurringByMesN[n] || 0) + valor;
    }
  });

  // ── Combinada / Leads Necesarios (bloque A) ──
  const combinedRate = ((kpis.tasaAgenda||0)/100) * ((kpis.tasaCalificacion||0)/100) * ((kpis.showUpRate||0)/100) * ((kpis.tasaCierre||0)/100);
  const mrrNuevoNecesario   = Math.max(0, (anual.objetivoCashCollected || 0) - (metas.mrrActual || 0));
  const clientesNecesarios  = (metas.ticketNuevo || 0) > 0 ? Math.ceil(mrrNuevoNecesario / metas.ticketNuevo) : 0;
  const leadsNecesarios     = combinedRate > 0 ? Math.ceil(clientesNecesarios / combinedRate) : 0;

  const hitoPct = (anual.objetivoCashCollected || 0) > 0 ? Math.min(100, (metas.hitoIntermedio || 0) / anual.objetivoCashCollected * 100) : 0;
  const facturacionPct = (anual.objetivoCashCollected || 0) > 0 ? Math.min(100, facturacionAcumulada / anual.objetivoCashCollected * 100) : 0;

  // ── "Qué hacer ahora" — real vs. plan del escenario activo, a la fecha de hoy ──
  const todayStr        = new Date().toISOString().slice(0, 10);
  const currentMesN     = Math.max(1, mesNForDate(todayStr) || 1);
  const escActivaTop    = mensual.escenarioActivo || "A";
  const escenariosTop   = mensual.escenarios || { A: [], B: [] };
  const mesesTop        = escenariosTop[escActivaTop] || [];
  const mesNumero       = (m) => parseInt((m.label || "").replace(/\D/g, ""), 10) || 0;
  const currentMesData  = mesesTop.find(m => mesNumero(m) === currentMesN);
  const mesesHastaAhora = mesesTop.filter(m => mesNumero(m) > 0 && mesNumero(m) <= currentMesN);
  const targetAcumuladoHastaAhora = mesesHastaAhora.reduce((s, m) =>
    s + ((parseFloat(m.feccu) || 0) + (parseFloat(m.feccp) || 0) + (parseFloat(m.becc) || 0)), 0);
  const gapVsPlan       = facturacionAcumulada - targetAcumuladoHastaAhora;
  const clientesParaPonerseAlDia = (metas.ticketNuevo || 0) > 0 && gapVsPlan < 0 ? Math.ceil(Math.abs(gapVsPlan) / metas.ticketNuevo) : 0;
  const gapAlHito       = Math.max(0, (metas.hitoIntermedio || 0) - facturacionAcumulada);
  const gapALaMeta      = Math.max(0, (metas.metaFinal || 0) - facturacionAcumulada);
  const hayDatosReales  = facturacionAcumulada > 0;
  const hayMesProyectado = mesesHastaAhora.length > 0;

  // ── Estilos compartidos ──
  // Mismo negro de fondo que el resto del dashboard (no cambia de golpe al entrar a esta
  // sección), pero los cuadros de acá van un poco más claros y con borde celeste — así se
  // distinguen del fondo en vez de fundirse en un solo bloque negro.
  const cardStyle = { background: "#1C1E26", borderRadius: 12, padding: 16, border: `1px solid rgba(96,165,250,0.18)` };
  const labelStyle = { color: GRAY, fontSize: 10, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 };
  const numInputStyle = { width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "5px 7px", color: WHITE, fontSize: 12, outline: "none", boxSizing: "border-box", textAlign: "right" };
  const thStyle = { textAlign: "right", padding: "6px 8px", borderBottom: `1px solid ${BORDER}`, color: GRAY, fontWeight: 600, fontSize: 11, whiteSpace: "nowrap" };
  const tdLabelStyle = { padding: "6px 8px", color: WHITE, fontSize: 12 };

  const QNumInput = ({ value, onChange }) => (
    <input type="number" value={value ?? ""} onChange={e => onChange(e.target.value)} style={numInputStyle} />
  );

  // ═══════════════════════════════════════════════════════════════════════
  // VISTA A — RESUMEN ANUAL
  // ═══════════════════════════════════════════════════════════════════════
  const renderAnual = () => {
    const q = anual.quarters || {};
    const ingresoRows = [
      { key: "leads",              label: "Leads" },
      { key: "llamadasAgendadas",  label: "Llamadas Agendadas" },
      { key: "llamadasEfectivas",  label: "Llamadas Efectivas" },
      { key: "cierres",            label: "Cierres" },
      { key: "aovTC",              label: "AOV TC", money: true },
      { key: "feccu",              label: "FECCU", money: true },
      { key: "feccp",              label: "FECCP", money: true },
      { key: "becc",               label: "BECC", money: true },
    ];
    const egresoRows = [
      { key: "personalVentas",       label: "Personal de Ventas" },
      { key: "personalProducto",     label: "Personal de Producto" },
      { key: "personalOperaciones",  label: "Personal de Operaciones" },
      { key: "personalMarketing",    label: "Personal de Marketing" },
      { key: "softwares",            label: "Softwares" },
      { key: "reembolsos",           label: "Reembolsos" },
      { key: "otros",                label: "Otros" },
      { key: "anuncios",             label: "Anuncios" },
    ];
    const quarterIngresosTotales = (qk) => {
      const qd = q[qk] || {};
      return (parseFloat(qd.feccu) || 0) + (parseFloat(qd.feccp) || 0) + (parseFloat(qd.becc) || 0);
    };
    const quarterEgresosTotales = (qk) => {
      const qd = q[qk] || {};
      return egresoRows.reduce((s, r) => s + (parseFloat(qd[r.key]) || 0), 0);
    };

    return (
      <div>
        {/* Barra grande de facturación acumulada */}
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
            <div style={{ color: WHITE, fontWeight: 700, fontSize: 14 }}>Facturación acumulada {currentYear}</div>
            <div style={{ color: GOLD, fontWeight: 900, fontSize: 18 }}>{fmtUSD0(facturacionAcumulada)} <span style={{ color: GRAY, fontWeight: 500, fontSize: 12 }}>/ {fmtUSD0(anual.objetivoCashCollected)} meta</span></div>
          </div>
          <div style={{ position: "relative", background: "rgba(255,255,255,0.04)", borderRadius: 8, height: 12, overflow: "visible" }}>
            <div style={{ height: "100%", borderRadius: 8, background: `linear-gradient(90deg,${GOLD_DIM},${GOLD})`, width: `${facturacionPct}%`, transition: "width 0.5s ease" }} />
            {hitoPct > 0 && hitoPct < 100 && (
              <div title={`Hito $${(metas.hitoIntermedio||0).toLocaleString("en-US")}`} style={{ position: "absolute", top: -3, bottom: -3, left: `${hitoPct}%`, width: 2, background: "#22C55E", boxShadow: "0 0 6px rgba(34,197,94,0.7)" }} />
            )}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", color: GRAY, fontSize: 10, marginTop: 6 }}>
            <span>$0</span>
            <span style={{ color: "#22C55E" }}>hito ${fmtN(metas.hitoIntermedio)}</span>
            <span>{fmtUSD0(anual.objetivoCashCollected)}</span>
          </div>
        </div>

        {/* KPIs + Ticket + Objetivo + Leads necesarios */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: 12, marginBottom: 16 }}>
          <div style={cardStyle}>
            <div style={labelStyle}>KPI's de Conversión</div>
            {[["tasaAgenda","Tasa de Agenda"],["tasaCalificacion","Tasa de Calificación"],["showUpRate","Tasa de Show Up"],["tasaCierre","Tasa de Cierre"]].map(([k,l]) => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
                <span style={{ color: GRAY, fontSize: 12 }}>{l}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
                  <input type="number" value={kpis[k] ?? ""} onChange={e => updateKpis({ [k]: e.target.value })} style={{ ...numInputStyle, width: 60 }} />
                  <span style={{ color: GRAY, fontSize: 11 }}>%</span>
                </div>
              </div>
            ))}
            <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8, display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: GRAY, fontSize: 11 }}>Ratio de Conversión combinado</span>
              <span style={{ color: GOLD, fontWeight: 700, fontSize: 12 }}>{(combinedRate*100).toFixed(4)}%</span>
            </div>
          </div>

          <div style={cardStyle}>
            <div style={labelStyle}>Ticket / AOV</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>Ticket a proyectar (clientes nuevos)</span>
              <input type="number" value={metas.ticketNuevo ?? ""} onChange={e => updateMetas({ ticketNuevo: e.target.value })} style={{ ...numInputStyle, width: 80 }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>AOV TC (referencia tabla)</span>
              <input type="number" value={anual.aovTC ?? ""} onChange={e => updateAnual({ aovTC: e.target.value })} style={{ ...numInputStyle, width: 80 }} />
            </div>
            <div style={{ color: GRAY, fontSize: 10, marginTop: 10 }}>MRR actual: <span style={{ color: WHITE, fontWeight: 700 }}>{fmtUSD0(metas.mrrActual)}</span></div>
          </div>

          <div style={cardStyle}>
            <div style={labelStyle}>Objetivo Cash Collected</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>Monto meta</span>
              <input type="number" value={anual.objetivoCashCollected ?? ""} onChange={e => updateAnual({ objetivoCashCollected: e.target.value })} style={{ ...numInputStyle, width: 90 }} />
            </div>
            {[["feccuPct","FECCU"],["feccpPct","FECCP"],["beccPct","BECC"]].map(([k,l]) => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, gap: 8 }}>
                <span style={{ color: GRAY, fontSize: 11 }}>{l}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <input type="number" value={anual[k] ?? ""} onChange={e => updateAnual({ [k]: e.target.value })} style={{ ...numInputStyle, width: 48 }} />
                  <span style={{ color: GRAY, fontSize: 10 }}>%</span>
                  <span style={{ color: WHITE, fontSize: 11, fontWeight: 600, minWidth: 62, textAlign: "right" }}>{fmtUSD0((anual.objetivoCashCollected||0) * (anual[k]||0) / 100)}</span>
                </div>
              </div>
            ))}
            <div style={{ color: (((anual.feccuPct||0)+(anual.feccpPct||0)+(anual.beccPct||0))===100) ? "#22C55E" : "#EF4444", fontSize: 10, marginTop: 4 }}>
              Suma: {(anual.feccuPct||0)+(anual.feccpPct||0)+(anual.beccPct||0)}%{(((anual.feccuPct||0)+(anual.feccpPct||0)+(anual.beccPct||0))!==100) ? " (debería sumar 100%)" : ""}
            </div>
          </div>

          <div style={cardStyle}>
            <div style={labelStyle}>Leads Necesarios</div>
            <div style={{ color: GOLD, fontWeight: 900, fontSize: 22 }}>{fmtN(leadsNecesarios)}</div>
            <div style={{ color: GRAY, fontSize: 10, marginTop: 4 }}>conversaciones para cerrar {fmtN(clientesNecesarios)} clientes nuevos</div>
            <div style={{ color: GRAY, fontSize: 10, marginTop: 8 }}>MRR nuevo necesario: <span style={{ color: WHITE }}>{fmtUSD0(mrrNuevoNecesario)}</span></div>
          </div>
        </div>

        {/* Tabla Leadflow y Conversión / Ingresos */}
        <div style={{ ...cardStyle, marginBottom: 16, overflowX: "auto" }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 12 }}>Leadflow y Conversión / Ingresos</div>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
            <thead>
              <tr>
                <th style={{ ...thStyle, textAlign: "left" }}>Métrica</th>
                <th style={thStyle}>Situación Actual</th>
                <th style={thStyle}>Q1</th><th style={thStyle}>Q2</th><th style={thStyle}>Q3</th><th style={thStyle}>Q4</th>
              </tr>
            </thead>
            <tbody>
              {ingresoRows.map(row => (
                <tr key={row.key}>
                  <td style={tdLabelStyle}>{row.label}</td>
                  <td style={{ padding: "6px 8px", textAlign: "right", color: GRAY, fontSize: 12 }}>—</td>
                  {["q1","q2","q3","q4"].map(qk => (
                    <td key={qk} style={{ padding: "3px 5px" }}>
                      <QNumInput value={(q[qk]||{})[row.key]} onChange={v => updateQuarter(qk, { [row.key]: v })} />
                    </td>
                  ))}
                </tr>
              ))}
              <tr>
                <td style={{ ...tdLabelStyle, fontWeight: 700 }}>Ingresos Totales</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: GOLD, fontWeight: 700, fontSize: 12 }}>{fmtUSD0(facturacionAcumulada)}</td>
                {["q1","q2","q3","q4"].map(qk => (
                  <td key={qk} style={{ padding: "6px 8px", textAlign: "right", color: GOLD, fontWeight: 700, fontSize: 12 }}>{fmtUSD0(quarterIngresosTotales(qk))}</td>
                ))}
              </tr>
            </tbody>
          </table>
          <div style={{ color: GRAY, fontSize: 10, marginTop: 8 }}>Ingresos Totales = FECCU + FECCP + BECC del periodo. "Situación Actual" en Leads/Llamadas/Cierres/AOV no se registra en Finanzas — completalos a mano si querés compararlos.</div>
        </div>

        {/* Tabla Egresos */}
        <div style={{ ...cardStyle, overflowX: "auto" }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 12 }}>Egresos</div>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
            <thead>
              <tr>
                <th style={{ ...thStyle, textAlign: "left" }}>Categoría</th>
                <th style={thStyle}>Situación Actual</th>
                <th style={thStyle}>Q1</th><th style={thStyle}>Q2</th><th style={thStyle}>Q3</th><th style={thStyle}>Q4</th>
              </tr>
            </thead>
            <tbody>
              {egresoRows.map(row => (
                <tr key={row.key}>
                  <td style={tdLabelStyle}>{row.label}</td>
                  <td style={{ padding: "6px 8px", textAlign: "right", color: GRAY, fontSize: 12 }}>—</td>
                  {["q1","q2","q3","q4"].map(qk => (
                    <td key={qk} style={{ padding: "3px 5px" }}>
                      <QNumInput value={(q[qk]||{})[row.key]} onChange={v => updateQuarter(qk, { [row.key]: v })} />
                    </td>
                  ))}
                </tr>
              ))}
              <tr>
                <td style={{ ...tdLabelStyle, fontWeight: 700 }}>Egresos Totales</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: "#EF4444", fontWeight: 700, fontSize: 12 }}>{fmtUSD0(egresosAcumulados)}</td>
                {["q1","q2","q3","q4"].map(qk => (
                  <td key={qk} style={{ padding: "6px 8px", textAlign: "right", color: "#EF4444", fontWeight: 700, fontSize: 12 }}>{fmtUSD0(quarterEgresosTotales(qk))}</td>
                ))}
              </tr>
              <tr>
                <td style={{ ...tdLabelStyle, fontWeight: 700 }}>Profit</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: (facturacionAcumulada-egresosAcumulados)>=0?"#22C55E":"#EF4444", fontWeight: 700, fontSize: 12 }}>{fmtUSD0(facturacionAcumulada-egresosAcumulados)}</td>
                {["q1","q2","q3","q4"].map(qk => {
                  const p = quarterIngresosTotales(qk) - quarterEgresosTotales(qk);
                  return <td key={qk} style={{ padding: "6px 8px", textAlign: "right", color: p>=0?"#22C55E":"#EF4444", fontWeight: 700, fontSize: 12 }}>{fmtUSD0(p)}</td>;
                })}
              </tr>
            </tbody>
          </table>
          <div style={{ color: GRAY, fontSize: 10, marginTop: 8 }}>Egresos Totales = suma de categorías del periodo. Profit = Ingresos Totales − Egresos Totales.</div>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  // VISTA B — RESUMEN MENSUAL
  // ═══════════════════════════════════════════════════════════════════════
  const renderMensual = () => {
    const escActiva = mensual.escenarioActivo || "A";
    const escenarios = mensual.escenarios || { A: [], B: [] };
    const meses = escenarios[escActiva] || [];

    const setMeses = (nuevos) => updateMensual({ escenarios: { ...escenarios, [escActiva]: nuevos } });
    const updateMes = (id, patch) => setMeses(meses.map(m => m.id === id ? { ...m, ...patch } : m));
    const addMes = () => {
      const n = meses.length + 1;
      setMeses([...meses, { id: "m_"+uid(), label: `Mes ${n}`, periodo: "", convDia: "", cierres: 0, llamadasAgendadas: "", llamadasEfectivas: "", aovTC: metas.ticketNuevo||0, feccu: 0, feccp: 0, becc: 0 }]);
    };
    const removeMes = (id) => setMeses(meses.filter(m => m.id !== id));

    const mesIngresosTotales = (m) => (parseFloat(m.feccu)||0) + (parseFloat(m.feccp)||0) + (parseFloat(m.becc)||0);

    const rows = [
      { key: "llamadasAgendadas", label: "Llamadas Agendadas" },
      { key: "llamadasEfectivas", label: "Llamadas Efectivas" },
      { key: "cierres",           label: "Cierres" },
      { key: "aovTC",             label: "AOV TC" },
      { key: "feccu",             label: "FECCU" },
      { key: "feccp",             label: "FECCP" },
      { key: "becc",              label: "BECC" },
    ];

    return (
      <div>
        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
          <span style={{ color: GRAY, fontSize: 11, marginRight: 4 }}>Escenario:</span>
          <Pill active={escActiva === "A"} onClick={() => updateMensual({ escenarioActivo: "A" })}>A · Ramp moderado (120/día tope)</Pill>
          <Pill active={escActiva === "B"} onClick={() => updateMensual({ escenarioActivo: "B" })}>B · Ramp agresivo ($40K al 31-dic)</Pill>
        </div>

        <div style={{ ...cardStyle, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 640 }}>
            <thead>
              <tr>
                <th style={{ ...thStyle, textAlign: "left" }}>Métrica</th>
                {meses.map(m => {
                  const mesN = parseInt(m.label.replace(/\D/g,""),10) || 1;
                  const key = mesNKey(mesN);
                  const realUSD = cashCollectedUSD(key);
                  const comprometidoUSD = recurringByMesN[mesN] || 0;
                  return (
                    <th key={m.id} style={{ ...thStyle, minWidth: 110, whiteSpace: "normal", verticalAlign: "top" }}>
                      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                        <div style={{ color: WHITE, fontWeight: 700 }}>{m.label}</div>
                        <input value={m.periodo||""} onChange={e => updateMes(m.id, { periodo: e.target.value })} placeholder="periodo"
                          style={{ display: "block", width: "100%", background: "transparent", border: "none", color: GRAY, fontSize: 9, textAlign: "right", outline: "none", boxSizing: "border-box" }} />
                        <input value={m.convDia||""} onChange={e => updateMes(m.id, { convDia: e.target.value })} placeholder="conv/día"
                          style={{ display: "block", width: "100%", background: "transparent", border: "none", color: GRAY, fontSize: 9, textAlign: "right", outline: "none", boxSizing: "border-box" }} />
                        {realUSD > 0 && <div style={{ color: "#22C55E", fontSize: 9, fontWeight: 700 }}>Real: {fmtUSD0(realUSD)}</div>}
                        {comprometidoUSD > 0 && <div style={{ color: "#60A5FA", fontSize: 9, fontWeight: 700 }}>Comprometido: {fmtUSD0(comprometidoUSD)}</div>}
                        <button onClick={() => removeMes(m.id)} title="Eliminar mes" style={{ display: "block", marginLeft: "auto", background: "none", border: "none", color: "#E06C6C", fontSize: 10, cursor: "pointer", padding: 0 }}>eliminar</button>
                      </div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {rows.map(row => (
                <tr key={row.key}>
                  <td style={tdLabelStyle}>{row.label}</td>
                  {meses.map(m => (
                    <td key={m.id} style={{ padding: "3px 5px" }}>
                      <QNumInput value={m[row.key]} onChange={v => updateMes(m.id, { [row.key]: v })} />
                    </td>
                  ))}
                </tr>
              ))}
              <tr>
                <td style={{ ...tdLabelStyle, fontWeight: 700 }}>Ingresos Totales</td>
                {meses.map(m => (
                  <td key={m.id} style={{ padding: "6px 8px", textAlign: "right", color: GOLD, fontWeight: 700, fontSize: 12 }}>{fmtUSD0(mesIngresosTotales(m))}</td>
                ))}
              </tr>
            </tbody>
          </table>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
            <div style={{ color: GRAY, fontSize: 10 }}>Ingresos Totales = FECCU+FECCP+BECC (Plan, editable). "Real" bajo cada mes = facturación cargada en Finanzas para ese mes calendario, convertida a USD. "Comprometido" = se calcula solo desde Seguimiento Semanal: cierres con Meses Mínimos cargados cuyo contrato todavía cubre ese mes.</div>
            <button onClick={addMes} style={{ padding: "7px 16px", background: GOLD, color: "#141414", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 700, fontSize: 12, whiteSpace: "nowrap" }}>+ Agregar mes</button>
          </div>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  // VISTA C — OPTIMIZACIÓN DE MÉTRICAS
  // ═══════════════════════════════════════════════════════════════════════
  const renderOptimizacion = () => {
    const metricas = optim.metricas || [];
    const updateMetrica = (id, patch) => updateOptim({ metricas: metricas.map(m => m.id === id ? { ...m, ...patch } : m) });
    const addAccionable = (metricaId) => {
      const texto = (newAccInputs[metricaId] || "").trim();
      if (!texto) return;
      const m = metricas.find(x => x.id === metricaId);
      const nuevo = { id: "acc_"+uid(), texto, done: false, notas: "", hito15: false, hito30: false, hito60: false, hito90: false, hito120: false };
      updateMetrica(metricaId, { accionables: [...(m.accionables||[]), nuevo] });
      setNewAccInputs(p => ({ ...p, [metricaId]: "" }));
    };
    const updateAccionable = (metricaId, accId, patch) => {
      const m = metricas.find(x => x.id === metricaId);
      updateMetrica(metricaId, { accionables: (m.accionables||[]).map(a => a.id === accId ? { ...a, ...patch } : a) });
    };
    const removeAccionable = (metricaId, accId) => {
      const m = metricas.find(x => x.id === metricaId);
      updateMetrica(metricaId, { accionables: (m.accionables||[]).filter(a => a.id !== accId) });
    };

    return (
      <div>
        {metricas.map(m => {
          const expanded = expandedMetrica === m.id;
          const accionables = m.accionables || [];
          const doneCount = accionables.filter(a => a.done).length;
          return (
            <div key={m.id} style={{ ...cardStyle, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setExpandedMetrica(expanded ? null : m.id)}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ color: WHITE, fontWeight: 700, fontSize: 13 }}>{m.nombre}</span>
                  {accionables.length > 0 && <span style={{ color: GRAY, fontSize: 11 }}>{doneCount}/{accionables.length} accionables</span>}
                </div>
                <span style={{ color: GOLD, fontSize: 12 }}>{expanded ? "▲" : "▼"}</span>
              </div>

              {expanded && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                    <Input label="Valor Actual" value={m.valorActual} onChange={v => updateMetrica(m.id, { valorActual: v })} />
                    <Input label="KPI objetivo" value={m.kpiObjetivo} onChange={v => updateMetrica(m.id, { kpiObjetivo: v })} />
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    <label style={{ display: "block", color: GRAY, fontSize: 12, marginBottom: 4 }}>Detalle</label>
                    <textarea value={m.detalle||""} onChange={e => updateMetrica(m.id, { detalle: e.target.value })} rows={2}
                      style={{ width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 8, padding: "8px 10px", color: WHITE, fontSize: 13, outline: "none", boxSizing: "border-box", resize: "vertical", fontFamily: "inherit" }} />
                  </div>
                  <div style={{ marginBottom: 14 }}>
                    <label style={{ display: "block", color: GRAY, fontSize: 12, marginBottom: 4 }}>Notas de Implementación</label>
                    <textarea value={m.notas||""} onChange={e => updateMetrica(m.id, { notas: e.target.value })} rows={2}
                      style={{ width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 8, padding: "8px 10px", color: WHITE, fontSize: 13, outline: "none", boxSizing: "border-box", resize: "vertical", fontFamily: "inherit" }} />
                  </div>

                  <div style={labelStyle}>Accionables</div>
                  {accionables.map(a => (
                    <div key={a.id} style={{ background: "#111113", borderRadius: 8, padding: "10px 12px", marginBottom: 8, border: `1px solid ${BORDER}` }}>
                      <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                        <input type="checkbox" checked={!!a.done} onChange={e => updateAccionable(m.id, a.id, { done: e.target.checked })} style={{ marginTop: 3 }} />
                        <input value={a.texto} onChange={e => updateAccionable(m.id, a.id, { texto: e.target.value })}
                          style={{ flex: 1, background: "transparent", border: "none", color: a.done?GRAY:WHITE, fontSize: 13, outline: "none", textDecoration: a.done?"line-through":"none" }} />
                        <button onClick={() => removeAccionable(m.id, a.id)} style={{ background: "none", border: "none", color: "#E06C6C", cursor: "pointer", fontSize: 14, padding: 0 }}>×</button>
                      </div>
                      <input value={a.notas||""} onChange={e => updateAccionable(m.id, a.id, { notas: e.target.value })} placeholder="Notas de implementación de este accionable..."
                        style={{ width: "100%", background: "transparent", border: "none", borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 6, color: GRAY, fontSize: 11, outline: "none" }} />
                      <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                        {[["hito15","15d"],["hito30","30d"],["hito60","60d"],["hito90","90d"],["hito120","120d"]].map(([hk,hl]) => (
                          <label key={hk} style={{ display: "flex", alignItems: "center", gap: 3, color: GRAY, fontSize: 10, cursor: "pointer" }}>
                            <input type="checkbox" checked={!!a[hk]} onChange={e => updateAccionable(m.id, a.id, { [hk]: e.target.checked })} />
                            {hl}
                          </label>
                        ))}
                      </div>
                    </div>
                  ))}
                  <div style={{ display: "flex", gap: 8 }}>
                    <input value={newAccInputs[m.id]||""} onChange={e => setNewAccInputs(p => ({ ...p, [m.id]: e.target.value }))}
                      onKeyDown={e => { if (e.key === "Enter") addAccionable(m.id); }}
                      placeholder="Nuevo accionable..."
                      style={{ flex: 1, background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 8, padding: "8px 10px", color: WHITE, fontSize: 13, outline: "none" }} />
                    <button onClick={() => addAccionable(m.id)} style={{ padding: "8px 16px", background: GOLD, color: "#141414", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 700, fontSize: 12 }}>+ Agregar</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  // VISTA D — SEGUIMIENTO SEMANAL
  // ═══════════════════════════════════════════════════════════════════════
  const ESTADOS_PIPELINE = [
    ["por_confirmar", "Por confirmar"],
    ["agendado", "Agendado"],
    ["reprogramado", "Reprogramado"],
    ["realizado", "Reunión realizada"],
    ["no_califica", "No calificó"],
  ];
  const ESTADOS_TERMINALES = ["realizado", "no_califica"];

  const renderDiario = () => {
    const entries = diario.entries || [];
    const todayMesN = mesNForDate(new Date().toISOString().slice(0,10));
    // El selector de mes tiene que incluir TODOS los meses con datos — antes solo miraba las
    // semanas de "Registrar semana" (diario.entries), así que un cliente cargado en un mes sin
    // ninguna semana registrada quedaba invisible en la lista (aunque sí contaba en la
    // proyección de "Ingresos Recurrentes Comprometidos", que sí mira todos los clientes).
    const mesNSet = new Set([
      ...entries.map(e => mesNForDate(e.date)),
      ...todosLosClientes.map(c => mesNForDate(c.fecha)),
    ]);
    mesNSet.add(todayMesN);
    const mesNList = Array.from(mesNSet).filter(n => n && n > 0).sort((a,b) => a-b);
    const activeMesN = selMesN != null ? selMesN : todayMesN;

    const setEntryField = (k, v) => setEntryForm(f => ({ ...f, [k]: v }));
    const addEntry = () => {
      if (!entryForm.date) return;
      const entry = { id: "de_"+uid(), ...entryForm };
      updateDiario({ entries: [...entries, entry] });
      setEntryForm(emptyEntryForm());
    };
    const removeEntry = (id) => updateDiario({ entries: entries.filter(e => e.id !== id) });
    const updateEntry = (id, patch) => updateDiario({ entries: entries.map(e => e.id === id ? { ...e, ...patch } : e) });

    // Clientes cerrados — lista propia (diario.clientes), se guarda apenas tocás "+ Agregar
    // cliente". No depende de "+ Agregar semana" ni de tener una entrada de gasto ese día.
    const setClienteField = (k, v) => setClienteForm(f => ({ ...f, [k]: v }));
    const addCliente = () => {
      if (!clienteForm.nombre.trim() || !clienteForm.fecha) return;
      const cliente = { id: "cl_"+uid(), ...clienteForm };
      updateDiario({ clientes: [...diarioClientes, cliente] });
      setClienteForm({ ...emptyClienteForm(), fecha: clienteForm.fecha });
    };
    const removeCliente = (id) => updateDiario({ clientes: diarioClientes.filter(c => c.id !== id) });
    const updateCliente = (id, patch) => updateDiario({ clientes: diarioClientes.map(c => c.id === id ? { ...c, ...patch } : c) });

    const entriesForMes = entries.filter(e => mesNForDate(e.date) === activeMesN).sort((a,b) => a.date.localeCompare(b.date));
    const sum = (key) => entriesForMes.reduce((s,e) => s + (parseFloat(e[key])||0), 0);

    const rInversionAds = sum("inversionAds"), rGastosMkt = sum("gastosMarketing"), rComisiones = sum("comisionesVenta");
    const rLeads = sum("leads"), rLlamadas = sum("llamadas"), rCanceladas = sum("llamadasCanceladas"), rNoShows = sum("noShows");
    const rEfectivas = sum("llamadasEfectivas");
    const rFeccu = sum("feccu"), rFeccp = sum("feccp"), rBecc = sum("becc");

    // Clientes cerrados del mes (con respaldo automático para semanas viejas, ver
    // legacyClientesDeEntrada) — Cierres e Ing. Totales ya no se tipean a mano, salen de sumar esta lista.
    const clientesMes = clientesForMesN(activeMesN).sort((a,b) => (a.fecha||"").localeCompare(b.fecha||""));
    const rCierres = clientesMes.length;
    const rIngresos = clientesMes.reduce((s,c) => s + (parseFloat(c.valor)||0), 0);
    const clientesAds = clientesMes.filter(c => c.fuente === "ads");
    const clientesOrganico = clientesMes.filter(c => c.fuente === "organico");
    const clientesSinDato = clientesMes.filter(c => c.fuente !== "ads" && c.fuente !== "organico");
    const ingresosAds = clientesAds.reduce((s,c) => s + (parseFloat(c.valor)||0), 0);
    const ingresosOrganico = clientesOrganico.reduce((s,c) => s + (parseFloat(c.valor)||0), 0);
    const cacAdsReal = clientesAds.length > 0 ? rInversionAds / clientesAds.length : null;
    const roasAdsReal = rInversionAds > 0 ? ingresosAds / rInversionAds : null;

    const gastosAdquisicion = rInversionAds + rGastosMkt + rComisiones;
    const cac        = rCierres > 0 ? rInversionAds / rCierres : null;
    const cacBlended = rCierres > 0 ? gastosAdquisicion / rCierres : null;
    const aovTCMes    = rCierres > 0 ? rIngresos / rCierres : null;
    const feccuCacRatio = cacBlended ? rFeccu / cacBlended : null;
    const aovCacRatio   = cac ? aovTCMes / cac : null;
    const roas = gastosAdquisicion > 0 ? rIngresos / gastosAdquisicion : null;
    // Valor comprometido total de cada cliente del mes: Valor × Meses Mín. si están cargados
    // (representa la vida completa del contrato, no solo el primer pago) — mismo criterio que ya
    // usa "Ingresos Recurrentes Comprometidos" abajo.
    const projectedRevenue = clientesMes.reduce((s, c) => {
      const val = parseFloat(c.valor) || 0;
      const meses = parseFloat(c.mesesMinimos) || 0;
      return s + (meses > 0 ? val * meses : val);
    }, 0);
    const roasProyectado = gastosAdquisicion > 0 ? projectedRevenue / gastosAdquisicion : null;

    // "recurringByMesN" viene calculado a nivel de componente (se comparte con Vista B).
    const proximosMesesN = Array.from({ length: 6 }, (_, i) => todayMesN + i).filter(n => n > 0);

    // Tendencia de CAC Blended semana a semana, cruzando meses — responde "¿mejora o empeora al escalar?"
    // Cruza cada semana con los clientes cargados en esa MISMA fecha (por eso conviene usar la
    // misma fecha en "Registrar semana" y en "Clientes cerrados" cuando coinciden).
    const cacHistory = entries
      .filter(e => {
        const c = todosLosClientes.filter(cl => cl.fecha === e.date).length;
        const gasto = (parseFloat(e.inversionAds)||0) + (parseFloat(e.gastosMarketing)||0) + (parseFloat(e.comisionesVenta)||0);
        // Cierres sin gasto propio esa semana = cierre diferido de una tanda anterior (ver guía D).
        // Se excluyen de la tendencia porque su costo real ya está contado en la fila original —
        // incluirlos mostraría un CAC de $0 engañoso.
        return c > 0 && gasto > 0;
      })
      .sort((a,b) => a.date.localeCompare(b.date))
      .map(e => {
        const c = todosLosClientes.filter(cl => cl.fecha === e.date).length;
        const gasto = (parseFloat(e.inversionAds)||0) + (parseFloat(e.gastosMarketing)||0) + (parseFloat(e.comisionesVenta)||0);
        return { date: e.date, cac: gasto / c };
      });
    const cacHistoryRecent = cacHistory.slice(-10);

    // Leads pendientes de seguimiento — lista independiente, no atada a una semana puntual
    const pipeline = diario.pipeline || [];
    const setPipelineField = (k, v) => setPipelineForm(f => ({ ...f, [k]: v }));
    const addPipelineItem = () => {
      if (!pipelineForm.fecha) return;
      const item = { id: "pl_"+uid(), ...pipelineForm };
      updateDiario({ pipeline: [...pipeline, item] });
      setPipelineForm(emptyPipelineForm());
    };
    const updatePipelineItem = (id, patch) => updateDiario({ pipeline: pipeline.map(p => p.id === id ? { ...p, ...patch } : p) });
    const removePipelineItem = (id) => updateDiario({ pipeline: pipeline.filter(p => p.id !== id) });
    const todayStrPipeline = new Date().toISOString().slice(0,10);
    const pipelineSorted = [...pipeline].sort((a,b) => (a.fecha||"").localeCompare(b.fecha||""));

    const entryFields = [
      ["date","Semana (fecha de cierre)","date"], ["inversionAds","Inversión Ads","number"], ["gastosMarketing","Gastos Mkt","number"], ["comisionesVenta","Comisiones","number"],
      ["leads","Leads","number"], ["llamadas","Llamadas","number"], ["llamadasCanceladas","Canceladas","number"], ["noShows","No Shows","number"],
      ["llamadasEfectivas","Efectivas","number"], ["feccu","FECCU","number"], ["feccp","FECCP","number"], ["becc","BECC","number"],
    ];
    const FUENTE_COLOR = { ads: "#60A5FA", organico: "#4CAF7D" };
    const FUENTE_LABEL = { ads: "Ads", organico: "Orgánico", sin_dato: "sin dato" };

    return (
      <div>
        {/* Formulario de nueva entrada */}
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 12 }}>Registrar semana</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(100px, 1fr))", gap: 8, marginBottom: 12 }}>
            {entryFields.map(([k,l,t]) => (
              <div key={k}>
                <label style={{ display: "block", color: GRAY, fontSize: 10, marginBottom: 3 }}>{l}</label>
                <input type={t} value={entryForm[k]} onChange={e => setEntryField(k, e.target.value)}
                  style={{ width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none", boxSizing: "border-box" }} />
              </div>
            ))}
          </div>

          <div style={{ marginBottom: 12 }}>
            <label style={{ display: "block", color: GRAY, fontSize: 10, marginBottom: 3 }}>Notas / aprendizajes de la semana</label>
            <textarea value={entryForm.notas} onChange={e => setEntryField("notas", e.target.value)} rows={2} placeholder="Qué funcionó, qué no, qué vas a probar la próxima semana..."
              style={{ width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "8px 10px", color: WHITE, fontSize: 12, outline: "none", boxSizing: "border-box", resize: "vertical", fontFamily: "inherit" }} />
          </div>
          <button onClick={addEntry} style={{ padding: "8px 20px", background: GOLD, color: "#141414", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 700, fontSize: 12 }}>+ Agregar semana</button>
        </div>

        {/* Clientes cerrados — lista propia, se guarda con un solo click (no depende de "+ Agregar semana") */}
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 4 }}>🧾 Clientes cerrados</div>
          <div style={{ color: GRAY, fontSize: 11, marginBottom: 12 }}>Cada cliente que cerrás se guarda apenas tocás "+ Agregar cliente" — no hace falta tocar "+ Agregar semana" para que cuente. Si coincide con la misma fecha de una semana que registraste arriba, el sistema los cruza solo.</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
            <input value={clienteForm.nombre} onChange={e => setClienteField("nombre", e.target.value)} placeholder="Nombre del cliente"
              style={{ flex: "1 1 140px", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <input type="date" value={clienteForm.fecha} onChange={e => setClienteField("fecha", e.target.value)}
              style={{ background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <select value={clienteForm.fuente} onChange={e => setClienteField("fuente", e.target.value)}
              style={{ background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }}>
              <option value="ads">Pauta (Ads)</option>
              <option value="organico">Orgánico</option>
            </select>
            <input type="number" value={clienteForm.valor} onChange={e => setClienteField("valor", e.target.value)} placeholder="Cuánto pagó"
              style={{ width: 110, background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <input type="number" value={clienteForm.mesesMinimos} onChange={e => setClienteField("mesesMinimos", e.target.value)} placeholder="Meses mín."
              style={{ width: 90, background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <button onClick={addCliente} style={{ padding: "6px 14px", background: GOLD, color: "#141414", border: "none", borderRadius: 6, cursor: "pointer", fontWeight: 700, fontSize: 12, whiteSpace: "nowrap" }}>+ Agregar cliente</button>
          </div>
          {clientesMes.length === 0 ? (
            <div style={{ color: GRAY, fontSize: 12 }}>Sin clientes cargados en Mes {activeMesN}.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {clientesMes.map(c => (
                <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", background: "#111113", border: `1px solid ${FUENTE_COLOR[c.fuente]||BORDER}`, borderRadius: 8, padding: "8px 10px" }}>
                  <span style={{ color: GRAY, fontSize: 11, minWidth: 80 }}>{c.fecha}</span>
                  {c.id.startsWith("legacy_") ? (
                    <span style={{ color: GRAY, fontSize: 12, fontStyle: "italic" }}>cliente de una semana vieja, sin nombre registrado</span>
                  ) : (
                    <input value={c.nombre} onChange={e => updateCliente(c.id, { nombre: e.target.value })}
                      style={{ flex: "1 1 120px", background: "transparent", border: "none", color: WHITE, fontSize: 12, fontWeight: 600, outline: "none" }} />
                  )}
                  <span style={{ color: FUENTE_COLOR[c.fuente]||GRAY, fontSize: 10, fontWeight: 700 }}>{FUENTE_LABEL[c.fuente]||"sin dato"}</span>
                  <span style={{ color: WHITE, fontSize: 12 }}>{c.valor ? fmtUSD0(parseFloat(c.valor)) : "—"}</span>
                  <span style={{ color: GRAY, fontSize: 11 }}>{c.mesesMinimos ? `${c.mesesMinimos} meses mín.` : "sin meses mín."}</span>
                  {!c.id.startsWith("legacy_") && (
                    <button onClick={() => removeCliente(c.id)} style={{ background: "none", border: "none", color: "#E06C6C", cursor: "pointer", fontSize: 13, marginLeft: "auto", padding: 0 }}>×</button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* De dónde vinieron los clientes del mes seleccionado, y cuánto costó cada canal */}
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 4 }}>¿De dónde vinieron tus clientes? — Mes {activeMesN}</div>
          <div style={{ color: GRAY, fontSize: 11, marginBottom: 12 }}>Cruza los clientes que cargaste arriba (con su origen) contra la inversión en pauta de este mes, para saber el costo real de cada canal.</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 12 }}>
            <div style={{ background: "#111113", borderRadius: 10, padding: "12px 14px", borderLeft: `4px solid ${FUENTE_COLOR.ads}` }}>
              <div style={{ color: FUENTE_COLOR.ads, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Pauta (Ads)</div>
              <div style={{ color: WHITE, fontSize: 22, fontWeight: 900, marginTop: 6 }}>{clientesAds.length}</div>
              <div style={{ color: GRAY, fontSize: 11 }}>cliente{clientesAds.length===1?"":"s"} · {fmtUSD0(ingresosAds)} cobrado</div>
              <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8, color: GRAY, fontSize: 11 }}>
                Costo real por cliente: <span style={{ color: WHITE, fontWeight: 700 }}>{cacAdsReal!=null ? fmtUSD0(cacAdsReal) : "—"}</span>
              </div>
            </div>
            <div style={{ background: "#111113", borderRadius: 10, padding: "12px 14px", borderLeft: `4px solid ${FUENTE_COLOR.organico}` }}>
              <div style={{ color: FUENTE_COLOR.organico, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Orgánico</div>
              <div style={{ color: WHITE, fontSize: 22, fontWeight: 900, marginTop: 6 }}>{clientesOrganico.length}</div>
              <div style={{ color: GRAY, fontSize: 11 }}>cliente{clientesOrganico.length===1?"":"s"} · {fmtUSD0(ingresosOrganico)} cobrado</div>
              <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8, color: GRAY, fontSize: 11 }}>
                Costo: <span style={{ color: FUENTE_COLOR.organico, fontWeight: 700 }}>$0 — llegó sin pauta</span>
              </div>
            </div>
          </div>
          {roasAdsReal!=null && (
            <div style={{ color: GRAY, fontSize: 10, marginTop: 10 }}>ROAS real de Ads este mes: <span style={{ color: WHITE, fontWeight: 700 }}>{roasAdsReal.toFixed(2)}x</span> (lo que cobraste de clientes de Ads ÷ lo que invertiste en Ads).</div>
          )}
          {clientesSinDato.length > 0 && (
            <div style={{ color: GRAY, fontSize: 10, marginTop: 6 }}>+{clientesSinDato.length} cliente{clientesSinDato.length===1?"":"s"} de semanas viejas sin origen registrado (no entran en este cruce).</div>
          )}
        </div>

        {/* Leads pendientes de seguimiento */}
        <div style={{ ...cardStyle, marginBottom: 16 }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 4 }}>📋 Leads pendientes de seguimiento</div>
          <div style={{ color: GRAY, fontSize: 11, marginBottom: 12 }}>Leads con reunión o seguimiento agendado — quedan acá hasta que los resolvés, así no se te pierden. No están atados a una semana puntual porque el seguimiento puede caer semanas después. Los vencidos (fecha pasada, sin resolver) se marcan en rojo.</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
            <input value={pipelineForm.nombre} onChange={e => setPipelineField("nombre", e.target.value)} placeholder="Nombre / referencia (opcional)"
              style={{ flex: "1 1 160px", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <input type="date" value={pipelineForm.fecha} onChange={e => setPipelineField("fecha", e.target.value)}
              style={{ background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
            <select value={pipelineForm.estado} onChange={e => setPipelineField("estado", e.target.value)}
              style={{ background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }}>
              {ESTADOS_PIPELINE.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select>
            <input value={pipelineForm.notas} onChange={e => setPipelineField("notas", e.target.value)} placeholder="Notas (opcional)"
              style={{ flex: "1 1 160px", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 7px", color: WHITE, fontSize: 12, outline: "none" }} />
          </div>
          <button onClick={addPipelineItem} style={{ padding: "8px 20px", background: GOLD, color: "#141414", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 700, fontSize: 12 }}>+ Agregar lead</button>

          {pipelineSorted.length > 0 && (
            <div style={{ marginTop: 16 }}>
              {pipelineSorted.map(p => {
                const terminal = ESTADOS_TERMINALES.includes(p.estado);
                const overdue = !terminal && p.fecha && p.fecha < todayStrPipeline;
                return (
                  <div key={p.id} style={{ background: "#111113", borderRadius: 8, padding: "10px 12px", marginBottom: 8, border: `1px solid ${overdue ? "#EF4444" : BORDER}` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <input value={p.nombre||""} onChange={e => updatePipelineItem(p.id, { nombre: e.target.value })} placeholder="Nombre / referencia"
                        style={{ flex: "1 1 140px", background: "transparent", border: "none", color: terminal ? GRAY : WHITE, fontSize: 13, outline: "none", textDecoration: terminal ? "line-through" : "none" }} />
                      <input type="date" value={p.fecha||""} onChange={e => updatePipelineItem(p.id, { fecha: e.target.value })}
                        style={{ background: "#0c0c0e", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "4px 6px", color: overdue ? "#EF4444" : WHITE, fontSize: 11, outline: "none" }} />
                      <select value={p.estado} onChange={e => updatePipelineItem(p.id, { estado: e.target.value })}
                        style={{ background: "#0c0c0e", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "4px 6px", color: WHITE, fontSize: 11, outline: "none" }}>
                        {ESTADOS_PIPELINE.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                      </select>
                      {overdue && <span style={{ color: "#EF4444", fontSize: 10, fontWeight: 700 }}>VENCIDO</span>}
                      <button onClick={() => removePipelineItem(p.id)} style={{ background: "none", border: "none", color: "#E06C6C", cursor: "pointer", fontSize: 14, padding: 0, marginLeft: "auto" }}>×</button>
                    </div>
                    <input value={p.notas||""} onChange={e => updatePipelineItem(p.id, { notas: e.target.value })} placeholder="Notas de seguimiento..."
                      style={{ width: "100%", background: "transparent", border: "none", borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 6, color: GRAY, fontSize: 11, outline: "none" }} />
                  </div>
                );

            </div>

        </div>

        {/* Selector de mes */}
