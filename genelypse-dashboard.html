<style>:root{--bg:#0E0E10;--card:#17171A;--card2:#1E1E22;--bd:#2A2A2E;--pu:#8B5CF6;--pu2:#6D4FC4;--pu3:#A78BFA;--tx:#F5F5F3;--mut:#9B9B9F;--ok:#4CAF7D;--err:#E06C6C;--warn:#F2B84B;--info:#5B9BF5;--grad:linear-gradient(135deg,#7C3AED 0%,#A78BFA 45%,#6D4FC4 100%);--r:14px}
*{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2A2A2E;border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--pu)}
::selection{background:rgba(139,92,246,.3)}
h1,h2,h3,h4{margin:0 0 .4em;font-weight:700;letter-spacing:-.01em}h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}h4{font-size:14px}
p{margin:.3em 0}a{color:var(--pu3)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#101013;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--pu);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
input[type=checkbox]{width:auto;min-height:0}
select option{background:#17171A}
.muted{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.hide{display:none!important}
/* botones */
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;transition:.15s}
.btn:hover{border-color:var(--pu)}.btn:disabled{opacity:.5;cursor:default}
.btn.primario{background:var(--grad);border-color:transparent;color:#fff}.btn.primario:hover{filter:brightness(1.1)}
.btn.verde{background:#25D366;border-color:transparent;color:#06240f}
.btn.peligro{color:var(--err);border-color:#4a2a2a}
.btn.chico{padding:5px 10px;min-height:32px;font-size:13px}
.btn.ancho{width:100%}
.icon-btn{background:transparent;border:0;cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px;color:var(--mut)}.icon-btn:hover{background:var(--card2);color:var(--tx)}
.enlace{background:none;border:0;color:var(--pu3);cursor:pointer;padding:8px;text-align:center;width:100%}
/* cabecera */
.top{position:sticky;top:0;z-index:30;background:rgba(14,14,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em;font-size:15px}
.marca small{display:block;font-weight:500;letter-spacing:.02em;color:var(--mut);font-size:11px}
.grow{flex:1}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--mut)}.punto.on{background:var(--ok);box-shadow:0 0 6px rgba(76,175,125,.8)}
.yo{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:30px;padding:4px 12px 4px 4px}
.yo span.n{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1400px;margin:0 auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.tab:hover{color:var(--pu)}.tab.on{color:var(--pu);border-bottom-color:var(--pu)}
.main{max-width:1400px;margin:0 auto;padding:18px 16px 80px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:12px;flex:none}
.avatar.sm{width:20px;height:20px;font-size:9px}.avatar.lg{width:52px;height:52px;font-size:18px}
/* tarjetas y rejillas */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card.hover:hover{border-color:var(--pu)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.gauto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fila.sb{justify-content:space-between}
.pag-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pag-cab p{color:var(--mut);margin:0}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--pu)}
.kpi .v{font-size:32px;font-weight:800;line-height:1.1}.kpi .l{color:var(--mut);font-size:13px;margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pu))}
.kpi .v{color:var(--c,var(--tx))}
.seccion{margin-top:22px}.seccion>h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.barra{height:8px;background:#26262b;border-radius:99px;overflow:hidden}.barra span{display:block;height:100%;border-radius:99px;transition:width .4s}
.barra.alta{height:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);background:var(--card2);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}.chip.click{cursor:pointer}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px}
.chip-op{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);border-radius:99px;padding:4px 10px 4px 4px;cursor:pointer;font-size:13px}.chip-op.on{border-color:var(--pu);background:rgba(139,92,246,.18)}
/* alertas */
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);cursor:pointer}
.alerta:hover{border-color:var(--pu)}.alerta .ic{font-size:18px}

  function enviar(f) {
    if (!f.checkValidity()) {
      f.reportValidity();
      return;
    }
    f.dispatchEvent(new Event("submit", {
      bubbles: true,
      cancelable: true
    }));
  }
  document.addEventListener("click", function (e) {
    const b = e.target.closest && e.target.closest("button");
    if (!b || b.disabled || !b.form || (b.getAttribute("type") || "submit") !== "submit") return;
    e.preventDefault();
    enviar(b.form);
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing) return;
    const t = e.target;
    if (!t || t.tagName !== "INPUT" || !t.form || ["button", "submit", "checkbox", "radio"].includes(t.type)) return;
    e.preventDefault();
    enviar(t.form);
  }, true);
})();
</script></body></html>
