          {mesNList.map(n => (
            <Pill key={n} active={activeMesN === n} onClick={() => setSelMesN(n)}>Mes {n}{n===todayMesN ? " (actual)" : ""}</Pill>
          ))}
        </div>

        {/* Tabla de entradas del mes */}
        <div style={{ ...cardStyle, marginBottom: 16, overflowX: "auto" }}>
          <div style={{ color: WHITE, fontWeight: 700, fontSize: 13, marginBottom: 12 }}>Entradas — Mes {activeMesN}</div>
          {entriesForMes.length === 0 ? (
            <div style={{ color: GRAY, fontSize: 12 }}>Sin entradas registradas este mes.</div>
          ) : (
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 780 }}>
              <thead>
                <tr>
                  <th style={{ ...thStyle, textAlign: "left" }}>Fecha</th>
                  <th style={{ ...thStyle, textAlign: "left" }}>Clientes</th>
                  {entryFields.slice(1).map(([k,l]) => <th key={k} style={thStyle}>{l}</th>)}
                  <th style={thStyle}>Cierres</th>
                  <th style={thStyle}>Ing. Totales</th>
                  <th style={thStyle}></th>
                </tr>
              </thead>
              <tbody>
                {entriesForMes.map(e => {
                  const eClientes = todosLosClientes.filter(c => c.fecha === e.date);
                  const eCierres = eClientes.length;
                  const eIngresos = eClientes.reduce((s,c) => s + (parseFloat(c.valor)||0), 0);
                  return (
                    <tr key={e.id}>
                      <td style={{ padding: "5px 8px", color: WHITE, fontSize: 12 }}>{e.date}</td>
                      <td style={{ padding: "5px 8px", fontSize: 11 }}>
                        {eClientes.length === 0 ? <span style={{ color: GRAY }}>—</span> : eClientes.map((c,i) => (
                          <span key={c.id||i} style={{ color: FUENTE_COLOR[c.fuente]||GRAY }}>
                            {c.nombre || "(sin nombre)"}{i<eClientes.length-1?", ":""}
                          </span>
                        ))}
                      </td>
                      {entryFields.slice(1).map(([k]) => (
                        <td key={k} style={{ padding: "5px 8px", textAlign: "right", color: WHITE, fontSize: 12 }}>{e[k] || "—"}</td>
                      ))}
                      <td style={{ padding: "5px 8px", textAlign: "right", color: WHITE, fontSize: 12 }}>{eCierres || "—"}</td>
                      <td style={{ padding: "5px 8px", textAlign: "right", color: WHITE, fontSize: 12 }}>{eIngresos || "—"}</td>
                      <td style={{ padding: "5px 8px", textAlign: "right" }}>
                        <button onClick={() => removeEntry(e.id)} style={{ background: "none", border: "none", color: "#E06C6C", cursor: "pointer", fontSize: 13 }}>×</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        {/* Notas de la semana */}
        {entriesForMes.some(e => e.notas) && (
          <div style={{ ...cardStyle, marginBottom: 16 }}>
            <div style={labelStyle}>📝 Notas de la semana — Mes {activeMesN}</div>
            {entriesForMes.filter(e => e.notas).map(e => (
              <div key={e.id} style={{ marginTop: 10 }}>
                <div style={{ color: GRAY, fontSize: 10, marginBottom: 3 }}>{e.date}</div>
                <textarea value={e.notas} onChange={ev => updateEntry(e.id, { notas: ev.target.value })} rows={2}
                  style={{ width: "100%", background: "#111113", border: `1px solid ${BORDER}`, borderRadius: 8, padding: "8px 10px", color: WHITE, fontSize: 12, outline: "none", boxSizing: "border-box", resize: "vertical", fontFamily: "inherit" }} />
              </div>
            ))}
          </div>
        )}

        {/* Resumen + Resumen Adquisición */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 12 }}>
          <div style={cardStyle}>
            <div style={labelStyle}>Resumen — Mes {activeMesN}</div>
            {[["Leads",rLeads],["Llamadas",rLlamadas],["Canceladas",rCanceladas],["No Shows",rNoShows],["Llamadas Efectivas",rEfectivas],["Cierres",rCierres]].map(([l,v]) => (
              <div key={l} style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                <span style={{ color: GRAY, fontSize: 12 }}>{l}</span><span style={{ color: WHITE, fontSize: 12, fontWeight: 600 }}>{fmtN(v)}</span>
              </div>
            ))}
            <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8 }} />
            {[["FECCU",rFeccu],["FECCP",rFeccp],["BECC",rBecc],["Ingresos Totales",rIngresos]].map(([l,v]) => (
              <div key={l} style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                <span style={{ color: GRAY, fontSize: 12 }}>{l}</span><span style={{ color: GOLD, fontSize: 12, fontWeight: 700 }}>{fmtUSD0(v)}</span>
              </div>
            ))}
          </div>

          <div style={cardStyle}>
            <div style={labelStyle}>Resumen Adquisición — Mes {activeMesN}</div>
            {[["Inversión ADS",rInversionAds],["Otros Gastos Marketing",rGastosMkt],["Comisiones de Ventas",rComisiones],["Gastos en Adquisición",gastosAdquisicion]].map(([l,v]) => (
              <div key={l} style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                <span style={{ color: GRAY, fontSize: 12 }}>{l}</span><span style={{ color: WHITE, fontSize: 12, fontWeight: 600 }}>{fmtUSD0(v)}</span>
              </div>
            ))}
            <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8 }} />
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>CAC</span><span style={{ color: WHITE, fontSize: 12, fontWeight: 700 }}>{cac!=null ? fmtUSD0(cac) : "—"}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>CAC Blended</span><span style={{ color: WHITE, fontSize: 12, fontWeight: 700 }}>{cacBlended!=null ? fmtUSD0(cacBlended) : "—"}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>FECCU:CAC</span><span style={{ color: "#22C55E", fontSize: 12, fontWeight: 700 }}>{feccuCacRatio!=null ? feccuCacRatio.toFixed(2) : "—"}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>AOV TC:CAC</span><span style={{ color: "#22C55E", fontSize: 12, fontWeight: 700 }}>{aovCacRatio!=null ? aovCacRatio.toFixed(2) : "—"}</span>
            </div>
            <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 8, paddingTop: 8 }} />
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
              <span style={{ color: GRAY, fontSize: 12 }}>ROAS</span><span style={{ color: "#22C55E", fontSize: 12, fontWeight: 700 }}>{roas!=null ? roas.toFixed(2)+"x" : "—"}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: GRAY, fontSize: 12 }}>ROAS Proyectado</span><span style={{ color: "#22C55E", fontSize: 12, fontWeight: 700 }}>{roasProyectado!=null ? roasProyectado.toFixed(2)+"x" : "—"}</span>
            </div>
            <div style={{ color: GRAY, fontSize: 10, marginTop: 8 }}>ROAS = Ingresos Totales del mes ÷ Gastos en Adquisición. ROAS Proyectado suma, de cada cierre del mes con Meses Mín. cargados, el valor completo del contrato (Ing. Totales × Meses Mín.) en vez de solo el primer pago — referencia del sistema: 5x mínimo.</div>
          </div>
        </div>

        {/* Tendencia CAC Blended semana a semana — cruza meses, para ver si mejora al escalar */}
        {cacHistory.length > 1 && (
          <div style={{ ...cardStyle, marginTop: 12, overflowX: "auto" }}>
            <div style={labelStyle}>Tendencia CAC Blended — últimas {cacHistoryRecent.length} semanas con cierres</div>
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 8 }}>
              {cacHistoryRecent.map((h, i) => {
                const fullIdx = cacHistory.length - cacHistoryRecent.length + i;
                const prev = cacHistory[fullIdx - 1];
                const delta = prev ? h.cac - prev.cac : null;
                return (
                  <div key={h.date+i} style={{ minWidth: 90 }}>
                    <div style={{ color: GRAY, fontSize: 10 }}>{h.date}</div>
                    <div style={{ color: WHITE, fontSize: 13, fontWeight: 700 }}>{fmtUSD0(h.cac)}</div>
                    {delta != null && (
                      <div style={{ color: delta<=0 ? "#22C55E" : "#EF4444", fontSize: 10, fontWeight: 600 }}>
                        {delta<=0 ? "↓ " : "↑ "}{fmtUSD0(Math.abs(delta))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{ color: GRAY, fontSize: 10, marginTop: 10 }}>CAC Blended de cada semana con cierres Y gasto propio cargados (Inversión Ads + Gastos Mkt + Comisiones ÷ Cierres). Verde = bajó (mejor) vs. la última semana con cierres, rojo = subió — así ves si el costo por cliente aguanta a medida que metés más plata. Las filas de cierre diferido de una tanda anterior (sin gasto propio esa semana) no entran acá — su costo ya está contado en la semana original.</div>
          </div>
        )}

        {/* Ingresos recurrentes comprometidos (basado en Meses Mínimos de cada cierre) */}
        <div style={{ ...cardStyle, marginTop: 12 }}>
          <div style={labelStyle}>Ingresos Recurrentes Comprometidos</div>
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", marginTop: 4 }}>
            {proximosMesesN.map(n => (
              <div key={n} style={{ minWidth: 90 }}>
                <div style={{ color: GRAY, fontSize: 10 }}>Mes {n}{n===todayMesN ? " (actual)" : ""}</div>
                <div style={{ color: GOLD, fontSize: 14, fontWeight: 700 }}>{fmtUSD0(recurringByMesN[n]||0)}</div>
              </div>
            ))}
          </div>
          <div style={{ color: GRAY, fontSize: 10, marginTop: 10 }}>Se calcula solo: cada entrada con Cierres y Meses Mínimos cargados repite su ticket (Ing. Totales ÷ Cierres) durante esa cantidad de meses desde la fecha del cierre — así la proyección ya cuenta el ingreso recurrente de contratos vigentes sin que tengas que volver a cargarlo mes a mes.</div>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div>
          <div style={{ color: "#60A5FA", fontSize: 10, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", marginBottom: 4 }}>Proyección personal</div>
          <div style={{ color: WHITE, fontWeight: 800, fontSize: 16, letterSpacing: -0.2 }}>Proyección 2026</div>
          <div style={{ color: GRAY, fontSize: 12 }}>De {fmtUSD0(metas.mrrActual)}/mes ({metas.startDate}) a {fmtUSD0(metas.metaFinal)}/mes — hito {fmtUSD0(metas.hitoIntermedio)}/mes</div>
        </div>
      </div>

      {/* ── QUÉ HACER AHORA ── */}
      <div style={{ background: hayDatosReales ? (gapVsPlan>=0 ? "rgba(34,197,94,0.06)" : "rgba(239,68,68,0.06)") : CARD, border: `1px solid ${hayDatosReales ? (gapVsPlan>=0 ? "#22C55E55" : "#EF444455") : BORDER}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
        <div style={{ color: GOLD, fontWeight: 700, fontSize: 13, marginBottom: 10 }}>🎯 Qué hacer ahora</div>
        {!hayDatosReales ? (
          <div style={{ color: GRAY, fontSize: 12, lineHeight: 1.6 }}>
            Todavía no cargaste facturación real en <b style={{ color: WHITE }}>Finanzas → Mensual</b>. En cuanto la cargues, acá te va a decir si vas arriba o abajo del plan y qué hacer al respecto.
          </div>
        ) : (
          <div style={{ color: GRAY, fontSize: 12, lineHeight: 1.7 }}>
            Estás en <b style={{ color: WHITE }}>Mes {currentMesN}</b> desde que arrancó la proyección ({metas.startDate}), siguiendo el <b style={{ color: WHITE }}>Escenario {escActivaTop}</b>.
            {!hayMesProyectado ? (
              <div style={{ marginTop: 6 }}>Todavía no agregaste "Mes {currentMesN}" en Resumen Mensual, así que no hay plan con el que comparar tu facturación real — agregalo ahí para ver el avance.</div>
            ) : (
              <div style={{ marginTop: 6 }}>
                Facturación real acumulada: <b style={{ color: WHITE }}>{fmtUSD0(facturacionAcumulada)}</b> · Plan del Escenario {escActivaTop} a esta altura: <b style={{ color: WHITE }}>{fmtUSD0(targetAcumuladoHastaAhora)}</b>
                <div style={{ marginTop: 6, fontWeight: 700, color: gapVsPlan>=0 ? "#22C55E" : "#EF4444" }}>
                  {gapVsPlan>=0
                    ? `Vas ${fmtUSD0(gapVsPlan)} arriba del plan — seguí al mismo ritmo.`
                    : `Vas ${fmtUSD0(Math.abs(gapVsPlan))} abajo del plan. Para ponerte al día necesitás cerrar ${clientesParaPonerseAlDia} cliente${clientesParaPonerseAlDia===1?"":"s"} más${metas.ticketNuevo?` (ticket ${fmtUSD0(metas.ticketNuevo)})`:""}.`}
                </div>
              </div>
            )}
            <div style={{ display: "flex", gap: 20, marginTop: 10, flexWrap: "wrap" }}>
              <span>Al hito $10K te faltan <b style={{ color: WHITE }}>{fmtUSD0(gapAlHito)}</b></span>
              <span>A la meta {fmtUSD0(metas.metaFinal)} te faltan <b style={{ color: WHITE }}>{fmtUSD0(gapALaMeta)}</b></span>
            </div>
          </div>
        )}
      </div>

      {/* ── CÓMO USAR ESTO ── */}
      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
        <div onClick={() => setGuiaOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
          <div style={{ color: GOLD, fontWeight: 700, fontSize: 13 }}>📘 Cómo usar esto</div>
          <span style={{ color: GRAY, fontSize: 11 }}>{guiaOpen ? "ocultar ▲" : "ver ▼"}</span>
        </div>
        {guiaOpen && (
          <div style={{ color: GRAY, fontSize: 12, lineHeight: 1.7, marginTop: 12 }}>
            Esta sección tiene 4 pestañas — usalas en este orden:
            <ol style={{ margin: "8px 0", paddingLeft: 18 }}>
              <li style={{ marginBottom: 6 }}><b style={{ color: WHITE }}>A · Resumen Anual</b> — arrancá acá. Cargá tus 4 tasas reales (Agenda/Calificación/Show Up/Cierre) y tu ticket — con eso el sistema calcula cuántos leads necesitás en el año. Los campos Q1-Q4 son opcionales, para cuando quieras metas por trimestre.</li>
              <li style={{ marginBottom: 6 }}><b style={{ color: WHITE }}>B · Resumen Mensual</b> — elegí Escenario A o B (ya vienen precargados con números reales). Acá ves mes a mes cuánto deberías facturar — es la que más te sirve para saber si vas bien o mal este mes en particular.</li>
              <li style={{ marginBottom: 6 }}><b style={{ color: WHITE }}>C · Optimización de Métricas</b> — cuando alguna tasa esté por debajo del objetivo, entrá acá y anotá qué acciones concretas vas a tomar para mejorarla, con fecha.</li>
              <li><b style={{ color: WHITE }}>D · Seguimiento Semanal</b> — opcional. Acá hay dos formularios que van por separado, cada uno se guarda solo con su propio botón:
                <ol style={{ margin: "6px 0", paddingLeft: 18 }}>
                  <li style={{ marginBottom: 4 }}><b style={{ color: WHITE }}>Registrar semana</b> — tus números de gasto/funnel (leads, llamadas, inversión en pauta). Se guarda al tocar <b style={{ color: WHITE }}>"+ Agregar semana"</b>. Si no tenés tiempo para esto, no pasa nada — con la Mensual alcanza.</li>
                  <li><b style={{ color: WHITE }}>Clientes cerrados</b> — cada cliente que cerrás, con nombre, fecha, si vino de <b style={{ color: WHITE }}>Pauta (Ads)</b> u <b style={{ color: WHITE }}>Orgánico</b>, cuánto pagó y meses mínimos. Se guarda de una al tocar <b style={{ color: WHITE }}>"+ Agregar cliente"</b> — no depende de "Registrar semana" ni hace falta llenar el otro formulario para que un cliente cuente.</li>
                </ol>
                "Cierres" e "Ing. Totales" ya no se tipean a mano, salen de sumar los clientes cargados. Con el origen cargado, la tarjeta <b style={{ color: WHITE }}>¿De dónde vinieron tus clientes?</b> te muestra cuántos vinieron de cada canal y cuánto costó realmente cada uno de Ads (cruzando contra la Inversión Ads del mes). Con Meses Mín. cargado por cliente, el sistema proyecta los ingresos recurrentes comprometidos en "Ingresos Recurrentes Comprometidos", sin que tengas que volver a cargarlos mes a mes. Si un cliente cierra el mismo día que una semana que ya registraste, usá esa misma fecha — así el sistema los cruza solo en la tabla y en la Tendencia CAC. Arriba tenés el tablero de <b style={{ color: WHITE }}>Leads pendientes de seguimiento</b> — cargá ahí cualquier lead con reunión o seguimiento agendado (con fecha) para que no se te pierda, y un campo de <b style={{ color: WHITE }}>notas</b> por semana para ir dejando aprendizajes. <b style={{ color: WHITE }}>Cierre diferido de una tanda vieja:</b> si un lead que venía de una semana anterior cierra recién ahora, no hace falta editar nada viejo — agregalo directo en "Clientes cerrados" con la fecha real del cierre.</li>
            </ol>
            <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 10, marginTop: 4 }}>
              <b style={{ color: WHITE }}>Glosario rápido:</b> Tasa de Cierre = % de llamadas que terminan en cliente pagando · Show Up = % que se presenta a la llamada que agendó · FECCU/FECCP/BECC = las 3 partes en que se cobra un cliente (pago inicial ~70% / segundo pago ~20% / saldo final ~10%) · AOV/Ticket = lo que paga un cliente en promedio · MRR = facturación mensual recurrente.
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 20 }}>
        {[["anual","A · Resumen Anual"],["mensual","B · Resumen Mensual"],["optimizacion","C · Optimización de Métricas"],["diario","D · Seguimiento Semanal"]].map(([id,label]) => (
          <Pill key={id} active={view === id} onClick={() => setView(id)}>{label}</Pill>
        ))}
      </div>

      {view === "anual"        && renderAnual()}
      {view === "mensual"      && renderMensual()}
      {view === "optimizacion" && renderOptimizacion()}
      {view === "diario"       && renderDiario()}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────────────────────────
function SettingsTab({ data, onChange }) {
  const [key, setKey] = useState(data.settings?.apiKey || "");
  const [saved, setSaved] = useState(false);
  const [testStatus, setTestStatus] = useState(null);
  const [testMsg, setTestMsg] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [pinInput, setPinInput] = useState("");
  const [pinCurrent, setPinCurrent] = useState("");
  const [pinSaved, setPinSaved] = useState(false);
  const [pinError, setPinError] = useState(false);
  const hasPin = !!data.settings?.teamPin;

  const savePin = () => {
    if (hasPin && pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: pinInput.trim() } });
    setPinInput(""); setPinCurrent("");
    setPinSaved(true);
    setTimeout(()=>setPinSaved(false), 2000);
  };

  const removePin = () => {
    if (pinCurrent !== data.settings.teamPin) {
      setPinError(true);
      setTimeout(()=>setPinError(false), 2000);
      return;
    }
    onChange({ ...data, settings: { ...(data.settings||{}), teamPin: "" } });
    setPinInput(""); setPinCurrent("");
  };

  const saveKey = () => {
    onChange({ ...data, settings: { ...(data.settings||{}), apiKey: key.trim() } });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const testConnection = async () => {
    if (!key.trim()) return;
    setTestStatus("loading"); setTestMsg("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": key.trim(),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true",
        },
        body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:10, messages:[{ role:"user", content:"Responde solo: OK" }] }),
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      setTestStatus("ok"); setTestMsg("Conexión exitosa — Claude responde correctamente.");
    } catch(e) {
      setTestStatus("error"); setTestMsg(e.message || "API key inválida o error de red.");
    }
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gp_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.clients) throw new Error("Archivo inválido");
        onChange(parsed);
        setImportMsg("✓ Datos importados correctamente.");
        setTimeout(()=>setImportMsg(""), 4000);
      } catch {
        setImportMsg("Error: archivo no válido.");
        setTimeout(()=>setImportMsg(""), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ maxWidth:600 }}>
      <div style={{ marginTop:0, padding:16, background:"rgba(139,92,246,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10 }}>
        <div style={{ color:GOLD, fontWeight:600, fontSize:13, marginBottom:6 }}>✦ Conexión con Claude IA</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Pega tu API key de Anthropic para que el botón "Analizar con IA" en el canvas llame directamente a Claude y muestre el análisis en el dashboard. La key se guarda localmente, nunca sale de tu dispositivo.
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <input
            type="password"
            value={key}
            onChange={e=>{ setKey(e.target.value); setTestStatus(null); setTestMsg(""); }}
            placeholder="sk-ant-api03-..."
            style={{ flex:1, background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 12px", color:WHITE, fontSize:13, outline:"none" }}
          />
          <button onClick={testConnection} disabled={!key.trim() || testStatus==="loading"}
            style={{ padding:"8px 14px", background:"transparent", color:testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":GRAY, border:`1px solid ${testStatus==="ok"?GREEN:testStatus==="error"?"#EF4444":BORDER}`, borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:600, opacity: testStatus==="loading"?0.7:1 }}>
            {testStatus==="loading" ? "Probando…" : testStatus==="ok" ? "✓ OK" : testStatus==="error" ? "✕ Error" : "Probar"}
          </button>
          <button onClick={saveKey}
            style={{ padding:"8px 18px", background:GOLD, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            {saved ? "✓ Guardado" : "Guardar"}
          </button>
        </div>
        {testMsg && (
          <div style={{ marginTop:8, fontSize:11, color: testStatus==="ok" ? GREEN : "#EF4444" }}>{testMsg}</div>
        )}
        {!testMsg && data.settings?.apiKey && (
          <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>✓ API key activa — el análisis de IA y la importación de imágenes están habilitados.</div>
        )}
      </div>

      <div style={{ marginTop:20, padding:16, background:"rgba(76,175,125,0.06)", border:`1px solid ${GREEN}44`, borderRadius:10 }}>
        <div style={{ color:GREEN, fontWeight:600, fontSize:13, marginBottom:6 }}>Backup de datos</div>
        <div style={{ color:GRAY, fontSize:12, lineHeight:1.6, marginBottom:12 }}>
          Exportá todos tus clientes, tareas y procesos como archivo JSON. Antes de cualquier actualización del dashboard, hacé un backup.
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={handleExport}
            style={{ padding:"8px 18px", background:GREEN, color:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
            ↓ Exportar datos
          </button>
          <label style={{ padding:"8px 18px", background:"transparent", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:13 }}>
            ↑ Importar datos
            <input type="file" accept=".json" onChange={handleImport} style={{ display:"none" }} />
          </label>
        </div>
        {importMsg && <div style={{ marginTop:8, color:GREEN, fontSize:11 }}>{importMsg}</div>}
      </div>

    </div>
  );
}

// ─── METODOLOGÍA (documento enriquecido, global) ──────────────────────────────
function MetodoTab({ data, onChange }) {
  const doc = data.metodologiaDoc || { html:"", updatedAt:null };
  const editorRef = React.useRef(null);
  const [dirty, setDirty] = useState(false);
  const [fontSize, setFontSize] = useState("3");
  const [color, setColor] = useState("#FFFFFF");

  React.useEffect(() => {
    if (editorRef.current && !dirty) editorRef.current.innerHTML = doc.html || "";
    // eslint-disable-next-line
  }, []);

  const exec = (cmd, val) => {
    editorRef.current && editorRef.current.focus();
    document.execCommand(cmd, false, val);
    setDirty(true);
  };

  const save = () => {
    const html = editorRef.current ? editorRef.current.innerHTML : doc.html;
    onChange({ ...data, metodologiaDoc: { html, updatedAt: Date.now() } });
    setDirty(false);
  };

  const insertImage = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { exec("insertImage", reader.result); };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const insertYoutube = () => {
    const url = window.prompt("Pega el enlace de YouTube:");
    if (!url) return;
    const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);
    const id = m ? m[1] : null;
    if (!id) { window.alert("No se reconoció el enlace de YouTube."); return; }
    const iframe = `<div contenteditable="false" style="margin:10px 0;"><iframe width="480" height="270" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen style="border-radius:8px;border:1px solid ${BORDER}"></iframe></div><p><br/></p>`;
    editorRef.current && editorRef.current.focus();
    document.execCommand("insertHTML", false, iframe);
    setDirty(true);
  };

  const btnStyle = { padding:"6px 10px", background:"#222225", color:WHITE, border:`1px solid ${BORDER}`, borderRadius:6, cursor:"pointer", fontSize:12 };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:18, flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Documento vivo</div>
          <h2 style={{ color:WHITE, fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.3 }}>Metodología</h2>
          <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>
            {doc.updatedAt ? `Última actualización: ${new Date(doc.updatedAt).toLocaleString("es-CO")}` : "Sin guardar aún"}
          </div>
        </div>
        <button onClick={save} className={dirty ? "gp-btn-gold" : ""}
          style={{ padding:"10px 20px", background: dirty ? GOLD : "#222225", color: dirty ? "#141414" : GRAY, border:`1px solid ${dirty ? GOLD : BORDER}`, borderRadius:8, cursor: dirty ? "pointer" : "default", fontWeight:700, fontSize:13 }}>
          💾 {dirty ? "Guardar cambios" : "Guardado"}
        </button>
      </div>

      {/* Toolbar */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", marginBottom:8, padding:"8px 10px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8 }}>
        <button style={{ ...btnStyle, fontWeight:900 }} onClick={()=>exec("bold")}>B</button>
        <button style={{ ...btnStyle, fontStyle:"italic" }} onClick={()=>exec("italic")}>I</button>
        <button style={{ ...btnStyle, textDecoration:"underline" }} onClick={()=>exec("underline")}>U</button>
        <select style={btnStyle} value={fontSize} onChange={e=>{ setFontSize(e.target.value); exec("fontSize", e.target.value); }}>
          {["1","2","3","4","5","6","7"].map(n=><option key={n} value={n}>Tamaño {n}</option>)}
        </select>
        <input type="color" value={color} onChange={e=>{ setColor(e.target.value); exec("foreColor", e.target.value); }}
          style={{ width:34, height:30, border:`1px solid ${BORDER}`, borderRadius:6, background:"none", cursor:"pointer" }} title="Color de texto" />
        <button style={btnStyle} onClick={()=>exec("insertUnorderedList")}>• Lista</button>
        <button style={btnStyle} onClick={()=>exec("insertOrderedList")}>1. Lista</button>
        <button style={btnStyle} onClick={()=>exec("formatBlock", "H2")}>Título</button>
        <button style={btnStyle} onClick={()=>exec("formatBlock", "P")}>Párrafo</button>
        <button style={btnStyle} onClick={()=>{ const url = window.prompt("URL del enlace:"); if(url) exec("createLink", url); }}>🔗 Enlace</button>
        <label style={{ ...btnStyle, display:"inline-block" }}>
          🖼️ Imagen
          <input type="file" accept="image/*" onChange={insertImage} style={{ display:"none" }} />
        </label>
        <button style={btnStyle} onClick={insertYoutube}>▶️ YouTube</button>
        <button style={btnStyle} onClick={()=>exec("removeFormat")}>Limpiar formato</button>
      </div>

      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        onInput={()=>setDirty(true)}
        style={{ minHeight:420, background:"#0a0a0b", border:`1px solid ${BORDER}`, borderRadius:8, padding:"18px 20px", color:WHITE, fontSize:14, lineHeight:1.6, outline:"none" }}
      />
    </div>
  );
}

function HomeTab({ data, onGoToClients, onSelectClient, onUpdateIssues, onUpdateClient }) {
  const [addingTo, setAddingTo] = useState(null);   // client id con form abierto
  const [quickTitle, setQuickTitle] = useState("");
  const [quickAssignees, setQuickAssignees] = useState([]);

  const submitQuickTask = (client, e) => {
    if (e) e.stopPropagation();
    if (!quickTitle.trim()) return;
    const newTask = { id: uid(), n: null, week: "Semana 1", area: AREAS[0], title: quickTitle.trim(), assigneeIds: quickAssignees, done: false, doneAt: null };
    onUpdateClient({ ...client, tasks: [...(client.tasks || []), newTask] });
    setQuickTitle("");
    setQuickAssignees([]);
    setAddingTo(null);
  };
  const allTasks = data.clients.flatMap(c => c.tasks || []);
  const doneTasks = allTasks.filter(t => t.done);
  const pct = allTasks.length ? Math.round(doneTasks.length / allTasks.length * 100) : 0;

  const now = new Date();
  const upcoming = data.clients.flatMap(c =>
    (c.meetings || [])
      .filter(m => m.date && new Date(m.date) >= now)
      .map(m => ({ client: c, meeting: m, date: new Date(m.date) }))
  ).sort((a, b) => a.date - b.date).slice(0, 6);

  const byOwner = {};
  data.clients.forEach(c => {
    (c.tasks || []).filter(t => !t.done).forEach(t => {
      const ids = t.assigneeIds || (t.assigneeId ? [t.assigneeId] : []);
      const keys = ids.length ? ids.map(id => data.team.find(m=>m.id===id)?.name || "Sin asignar") : ["Sin asignar"];
      keys.forEach(key => {
        if (!byOwner[key]) byOwner[key] = { pending: 0, clients: new Set() };
        byOwner[key].pending++;
        byOwner[key].clients.add(c.name);
      });
    });
  });

  const recentlyDone = data.clients.flatMap(c =>
    (c.tasks || [])
      .filter(t => t.done && t.doneAt && (Date.now() - t.doneAt) < 7 * 24 * 60 * 60 * 1000)
      .map(t => ({ ...t, clientName: c.name }))
  ).sort((a, b) => b.doneAt - a.doneAt).slice(0, 8);

  const fmtDate = d => d.toLocaleDateString("es-CO", { weekday:"short", day:"2-digit", month:"short" });
  const today = new Date().toLocaleDateString("es-CO", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });

// ─── ROOT COMPONENT ───────────────────────────────────────────────────────────
// ─── CALENDARIO COLOMBIA (en vivo) ────────────────────────────────────────────
const MESES_CO = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_CO = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

function nowBogota() {
  // Fecha/hora real "en vivo", normalizada a la zona horaria de Colombia (America/Bogota, UTC-5, sin horario de verano)
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Bogota", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false,
  }).formatToParts(new Date());
  const get = (t) => parts.find(p=>p.type===t)?.value;
  return new Date(`${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}:${get("second")}`);
}

// ─── EXPORTACIÓN ICS ───────────────────────────────────────────────────────────
function icsEscape(s) { return (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function pad2(n) { return String(n).padStart(2,"0"); }
function buildIcs(events) {
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Genelypse Growth Partner//Calendario//ES","CALSCALE:GREGORIAN"];
  events.forEach(e => {
    lines.push("BEGIN:VEVENT");
    lines.push("UID:"+e.id+"@genelypse-growth-partner");
    lines.push("SUMMARY:"+icsEscape(`${e.title} — ${e.empresa}`));
    if (e.time) {
      const [y,m,d] = e.date.split("-");
      const [hh,mm] = e.time.split(":");
      lines.push(`DTSTART;TZID=America/Bogota:${y}${m}${d}T${hh}${mm}00`);
      const endH = pad2((parseInt(hh,10)+1) % 24);
      lines.push(`DTEND;TZID=America/Bogota:${y}${m}${d}T${endH}${mm}00`);
    } else {
      lines.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""));
    }
    if (e.desc) lines.push("DESCRIPTION:"+icsEscape(e.desc));
    if (e.link) lines.push("URL:"+e.link);
    if (e.guestEmails) {
      e.guestEmails.split(",").map(x=>x.trim()).filter(Boolean).forEach(mail => {
        lines.push(`ATTENDEE;CN=${icsEscape(mail)}:mailto:${mail}`);
      });
    }
    lines.push("LOCATION:"+icsEscape(e.empresa));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadIcs(filename, content) {
  try {
    const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  } catch (e) { console.warn("No se pudo generar el .ics:", e); }
}

// conexiones, reuniones) se propaga automáticamente al portafolio principal de esa
// empresa (client.tasks / client.visits / client.conexiones / client.meetings).
function TrazabilidadTab({ data, onChange }) {
  const clients = data.clients || [];
  const team = data.team || [];
  const actas = (data.trazabilidad && data.trazabilidad.actas) || [];
  const [showForm, setShowForm] = useState(false);

    empresaId: clients[0]?.id || "",
    responsableId: "",
    problematicas: "", howknow: "", soluciones: "", acuerdos: "",
    tareas: [], visitas: [], conexiones: [], reuniones: [],
  });
  const [form, setForm] = useState(blankForm);
  const set = (patch) => setForm(f => ({ ...f, ...patch }));

  // ── filas dinámicas ──
  const addTarea = () => set({ tareas: [...form.tareas, { key:uid(), title:"", assigneeIds:[], week:WEEKS[0], area:AREAS[0] }] });

  const delTarea = (key) => set({ tareas: form.tareas.filter(t=>t.key!==key) });

  const addVisita = () => set({ visitas: [...form.visitas, { key:uid(), userId:"", context:"" }] });
  const updVisita = (key, patch) => set({ visitas: form.visitas.map(v=>v.key===key?{...v,...patch}:v) });
  const delVisita = (key) => set({ visitas: form.visitas.filter(v=>v.key!==key) });

  const addConexion = () => set({ conexiones: [...form.conexiones, { key:uid(), userId:"", context:"", link:"" }] });
  const updConexion = (key, patch) => set({ conexiones: form.conexiones.map(c=>c.key===key?{...c,...patch}:c) });
  const delConexion = (key) => set({ conexiones: form.conexiones.filter(c=>c.key!==key) });

  const addReunion = () => set({ reuniones: [...form.reuniones, { key:uid(), fecha:"", titulo:"", tipo:"virtual", guestEmails:"" }] });
  const updReunion = (key, patch) => set({ reuniones: form.reuniones.map(r=>r.key===key?{...r,...patch}:r) });
  const delReunion = (key) => set({ reuniones: form.reuniones.filter(r=>r.key!==key) });

  const canSave = form.fecha && form.empresaId && form.responsableId;

  const saveActa = () => {
    if (!canSave) return;
    const clientIdx = clients.findIndex(c=>c.id===form.empresaId);
    if (clientIdx === -1) return;
    const client = clients[clientIdx];

    const newTasks = form.tareas.filter(t=>t.title.trim()).map(t => ({
      id: uid(), n:null, week:t.week, area:t.area, title:t.title.trim(), assigneeIds:t.assigneeIds, done:false, doneAt:null, fromActa:true,
    }));
    const newVisits = form.visitas.filter(v=>v.userId).map(v => ({
      id: uid(), userId:v.userId, date:form.fecha, context:v.context.trim(), createdAt:Date.now(), fromActa:true,
    }));
    const newConexiones = form.conexiones.filter(c=>c.userId).map(c => ({
      id: uid(), userId:c.userId, date:form.fecha, context:c.context.trim(), link:c.link.trim(), createdAt:Date.now(), fromActa:true,
    }));
    const newMeetings = form.reuniones.filter(r=>r.fecha).map(r => ({
      id: uid(), date:r.fecha, title:r.titulo.trim()||"Reunión", desc:"", taskId:null, type:r.tipo, guestEmails:r.guestEmails.trim(), fromActa:true,
    }));

    const updatedClient = {
      ...client,
      tasks: [...(client.tasks||[]), ...newTasks],
      visits: [...(client.visits||[]), ...newVisits],
      conexiones: [...(client.conexiones||[]), ...newConexiones],
      meetings: [...(client.meetings||[]), ...newMeetings].sort((a,b)=>a.date.localeCompare(b.date)),
    };
    const newClients = clients.map((c,i) => i===clientIdx ? updatedClient : c);

    const acta = {
      id: uid(), fecha: form.fecha, empresaId: form.empresaId, responsableId: form.responsableId,
      problematicas: form.problematicas.trim(), howknow: form.howknow.trim(), soluciones: form.soluciones.trim(), acuerdos: form.acuerdos.trim(),
      tareaIds: newTasks.map(t=>t.id), visitaIds: newVisits.map(v=>v.id), conexionIds: newConexiones.map(c=>c.id), reunionIds: newMeetings.map(m=>m.id),
      createdAt: Date.now(),
    };

    onChange({
      ...data,
      clients: newClients,
      trazabilidad: { ...(data.trazabilidad||{}), actas: [...actas, acta] },
    });
    setForm(blankForm());
    setShowForm(false);
  };

  const sortedActas = [...actas].sort((a,b)=>b.fecha.localeCompare(a.fecha) || b.createdAt-a.createdAt);
  const inputStyle = { width:"100%", background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:12.5, outline:"none", boxSizing:"border-box" };

    <div style={{ maxWidth:900 }}>

// ─── ENLACES DE PLANTILLA ──────────────────────────────────────────────────────
function EnlacesPlantillaTab({ data, onChange }) {
  const plantillas = data.plantillas || { links: [], categorias: ["General"] };
  const links = plantillas.links || [];
  const categorias = plantillas.categorias || ["General"];
  const [filter, setFilter] = useState("Todas");
  const [showForm, setShowForm] = useState(false);
  const [fecha, setFecha] = useState(() => nowBogota().toISOString().slice(0,10));
  const [nombre, setNombre] = useState("");
  const [url, setUrl] = useState("");
  const [categoria, setCategoria] = useState(categorias[0] || "General");
  const [newCat, setNewCat] = useState("");

  const savePlantillas = (patch) => onChange({ ...data, plantillas: { ...plantillas, ...patch } });

  const addCategoria = () => {
    const c = newCat.trim();
    if (!c || categorias.includes(c)) return;
    savePlantillas({ categorias: [...categorias, c] });
    setCategoria(c);
    setNewCat("");
  };

  const addLink = () => {
    if (!nombre.trim() || !url.trim()) return;
    const newLink = { id: uid(), fecha, nombre: nombre.trim(), url: url.trim(), categoria: categoria || "General", createdAt: Date.now() };
    savePlantillas({ links: [...links, newLink] });
    setNombre(""); setUrl(""); setShowForm(false);
  };
  const deleteLink = (id) => savePlantillas({ links: links.filter(l=>l.id!==id) });

  const filtered = filter === "Todas" ? links : links.filter(l=>l.categoria===filter);
  const sorted = [...filtered].sort((a,b)=>b.createdAt-a.createdAt);
  const inputStyle = { background:"#111113", border:`1px solid ${BORDER}`, borderRadius:8, padding:"7px 10px", color:WHITE, fontSize:12.5, outline:"none" };

  return (
    <div style={{ maxWidth:820 }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ color:GOLD_DIM, fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:6 }}>Biblioteca</div>
          <h2 style={{ color:WHITE, fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.3 }}>Enlaces de Plantilla</h2>
          <div style={{ color:GRAY, fontSize:12, marginTop:5 }}>Guarda enlaces de plantillas, documentos o recursos de cualquier plataforma, organizados por categoría.</div>
        </div>
        <button onClick={()=>setShowForm(s=>!s)}
          style={{ padding:"9px 18px", background: showForm?"#333":GOLD, color: showForm?WHITE:"#141414", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>
          {showForm ? "✕ Cancelar" : "+ Nuevo enlace"}
        </button>
      </div>

      {showForm && (
        <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:16, marginBottom:20, display:"flex", flexDirection:"column", gap:10 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div>
              <label style={{ display:"block", color:GRAY, fontSize:11, marginBottom:4 }}>Fecha</label>
              <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={{...inputStyle, width:"100%", colorScheme:"dark", boxSizing:"border-box"}} />
            </div>
            <div>
              <label style={{ display:"block", color:GRAY, fontSize:11, marginBottom:4 }}>Nombre del enlace *</label>
              <input value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Plantilla de propuesta comercial"
                style={{...inputStyle, width:"100%", boxSizing:"border-box"}} />
            </div>
          </div>
          <div>
            <label style={{ display:"block", color:GRAY, fontSize:11, marginBottom:4 }}>URL *</label>
            <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://..."
              style={{...inputStyle, width:"100%", boxSizing:"border-box"}} />
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"flex-end", flexWrap:"wrap" }}>
            <div style={{ flex:1, minWidth:160 }}>
              <label style={{ display:"block", color:GRAY, fontSize:11, marginBottom:4 }}>Categoría</label>
              <select value={categoria} onChange={e=>setCategoria(e.target.value)} style={{...inputStyle, width:"100%"}}>
                {categorias.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Nueva categoría..."
              onKeyDown={e=>e.key==="Enter"&&addCategoria()}
              style={{...inputStyle, flex:1, minWidth:140}} />
            <button onClick={addCategoria} style={{ padding:"7px 12px", background:"transparent", border:`1px dashed ${GOLD_DIM}`, borderRadius:8, color:GOLD, cursor:"pointer", fontSize:12 }}>+ Categoría</button>
          </div>
          <button onClick={addLink} disabled={!nombre.trim()||!url.trim()}
            style={{ padding:"9px 18px", background:(nombre.trim()&&url.trim())?GOLD:"#333", color:(nombre.trim()&&url.trim())?"#141414":GRAY, border:"none", borderRadius:8, cursor:(nombre.trim()&&url.trim())?"pointer":"not-allowed", fontWeight:700, fontSize:13, alignSelf:"flex-end" }}>

        </div>

      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:16 }}>
        {["Todas",...categorias].map(c=><Pill key={c} active={filter===c} onClick={()=>setFilter(c)}>{c}</Pill>)}
      </div>

      {sorted.length === 0 ? (
        <div style={{ textAlign:"center", padding:"50px 0", color:GRAY, fontSize:13 }}>No hay enlaces guardados todavía.</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {sorted.map(l => (
            <div key={l.id} style={{ display:"flex", alignItems:"center", gap:10, background:CARD, border:`1px solid ${BORDER}`, borderRadius:10, padding:"10px 14px", flexWrap:"wrap" }}>

              <a href={l.url} target="_blank" rel="noreferrer" style={{ flex:1, minWidth:160, color:WHITE, fontSize:13, fontWeight:600, textDecoration:"none" }}>
