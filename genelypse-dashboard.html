<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genelypse Growth Partner — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(ellipse at 15% 8%, rgba(139,92,246,0.05) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 92%, rgba(139,92,246,0.03) 0%, transparent 45%),
        #0E0E10;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2A2A2E; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #8B5CF6; }

    /* Text selection */
    ::selection { background: rgba(139,92,246,0.25); color: #F5F5F3; }

    /* Input/Select focus glow */
    input:focus, select:focus, textarea:focus {
      box-shadow: 0 0 0 2px rgba(139,92,246,0.18) !important;
      outline: none !important;
    }

    /* Smooth global transitions */
    button { font-family: inherit; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease; }
    input, select, textarea { font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes goldShimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 6px rgba(139,92,246,0.3); }
      50%       { box-shadow: 0 0 14px rgba(139,92,246,0.6); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .gp-fade-in { animation: fadeInUp 0.28s ease forwards; }

    /* Nav tabs */
    .gp-nav-tab {
      position: relative;
      padding: 17px 15px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 12.5px;
      font-family: 'Inter', inherit;
      font-weight: 500;
      color: #9B9B9F;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }
    .gp-nav-tab:hover { color: #8B5CF6; }
    .gp-nav-tab.active {
      color: #8B5CF6;
      font-weight: 700;
      border-bottom-color: #8B5CF6;
    }

    /* Status indicator */
    .gp-status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .gp-status-dot.online  { background: #4CAF7D; box-shadow: 0 0 5px rgba(76,175,125,0.7); animation: pulseDot 2.5s ease infinite; }
    .gp-status-dot.saving  { background: #8B5CF6; animation: pulseDot 0.9s ease infinite; }
    .gp-status-dot.error   { background: #E06C6C; }
    .gp-status-dot.sync    { background: #9B9B9F; }

    /* Gold gradient logo text */
    .gp-logo-text {
      background: linear-gradient(135deg, #7C3AED 0%, #A78BFA 45%, #6D4FC4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Card hover lift */
    .gp-card-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    }
    .gp-card-lift:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 28px rgba(0,0,0,0.45) !important;
    }

    /* Tool icon buttons */
    .gp-tool-btn {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      border: 1px solid rgba(42,42,46,0.9);
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s ease;
    }
    .gp-tool-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(139,92,246,0.3);
    }
    .gp-tool-btn.active {
      background: rgba(139,92,246,0.08);
      border-color: rgba(139,92,246,0.45);
      box-shadow: 0 0 10px rgba(139,92,246,0.15);
    }

    /* Gold button */
    .gp-btn-gold {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D4FC4 100%) !important;
      box-shadow: 0 2px 10px rgba(139,92,246,0.22) !important;
    }
    .gp-btn-gold:hover {
      background: linear-gradient(135deg, #9D7BF0 0%, #7C5CD6 100%) !important;
      box-shadow: 0 4px 18px rgba(139,92,246,0.38) !important;
      transform: translateY(-1px) !important;
    }
  </style>
</head>

const STORAGE_KEY = "gp_metodo_v4";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

function contrastColor(hex) {
  if (!hex || hex.length < 7) return null;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5 ? "#1A1A1A" : "#FFFFFF";
}

function storageGet() {
  try {
    if (window.storage) return window.storage.get(STORAGE_KEY) || null;
  } catch (_) {}
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function storageSet(val) {
  try {
    if (window.storage) { window.storage.set(STORAGE_KEY, val); return; }
  } catch (_) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(val)); } catch (_) {}
}
function storageGetTs() {
  try { return parseInt(localStorage.getItem(STORAGE_KEY + "_ts") || "0"); } catch(_) { return 0; }
}
function storageSetTs(ts) {
  try { localStorage.setItem(STORAGE_KEY + "_ts", ts.toString()); } catch(_) {}
}

// ─── FIREBASE ARRAY FIX ──────────────────────────────────────────────────────
// Firebase convierte arrays a objetos con claves numéricas. Esta función los revierte.
function fbToJs(v) {
  if (v === null || v === undefined || typeof v !== "object" || Array.isArray(v)) return v;
  const keys = Object.keys(v);
  const isArr = keys.length > 0 && keys.every(k => /^\d+$/.test(k)) &&
    keys.map(Number).sort((a,b)=>a-b).every((k,i)=>k===i);
  if (isArr) return keys.sort((a,b)=>Number(a)-Number(b)).map(k=>fbToJs(v[k]));
  const out = {};
  for (const k of keys) out[k] = fbToJs(v[k]);
  return out;
}

function weekStats(tasks, week) {
  tasks = tasks || [];
  const wt = tasks.filter(t => t.week === week);
  return { done: wt.filter(t=>t.done).length, total: wt.length };
}

function overallPct(tasks) {
  tasks = tasks || [];
  if (!tasks.length) return 0;
  return Math.round((tasks.filter(t=>t.done).length / tasks.length) * 100);
}

        <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
          {comerciales.map(c => (
            <span key={c.id} style={{ display:"flex", alignItems:"center", gap:6, background:`${GOLD}12`, border:`1px solid ${GOLD}33`, color:GOLD, fontSize:12, fontWeight:600, padding:"5px 10px", borderRadius:20 }}>
              👤 {c.name}
              <button onClick={()=>removeComercial(c.id)} style={{ background:"none", border:"none", color:GOLD, cursor:"pointer", fontSize:13, lineHeight:1, padding:0 }}>×</button>
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── EJECUCION TAB ────────────────────────────────────────────────────────────
function EjecucionTab({ client, team, onChange, currentUserId }) {
  const [weekFilter, setWeekFilter] = useState("Todas");
  const [areaFilter, setAreaFilter] = useState("Todas");
  const [ownerFilter, setOwnerFilter] = useState("Todos");
  const [customTitle, setCustomTitle] = useState("");
  const [customWeek, setCustomWeek] = useState("Semana 1");
  const [customArea, setCustomArea] = useState(AREAS[0]);
  const [customAssignees, setCustomAssignees] = useState([]);

  const tasks = client.tasks || [];

  const filtered = tasks.filter(t => {
    if (weekFilter !== "Todas" && t.week !== weekFilter) return false;
    if (areaFilter !== "Todas" && t.area !== areaFilter) return false;
    if (ownerFilter !== "Todos" && !(t.assigneeIds||[]).includes(ownerFilter)) return false;
    return true;
  });

  const toggleTask = (taskId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, done: !t.done, doneAt: !t.done ? Date.now() : null } : t);
    onChange({ ...client, tasks: updated });
  };

  const assignTask = (taskId, assigneeIds) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, assigneeIds: assigneeIds||[] } : t);
    onChange({ ...client, tasks: updated });
  };

  const updateTaskFull = (taskId, patch) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, ...patch } : t);
    onChange({ ...client, tasks: updated });
  };

  const deleteTask = (taskId) => {
    if (!confirm("¿Eliminar esta tarea?")) return;
    onChange({ ...client, tasks: tasks.filter(t => t.id !== taskId) });
  };

  const urgentTask = (taskId) => {
    const updated = tasks.map(t => t.id === taskId ? { ...t, urgent: !t.urgent } : t);
    onChange({ ...client, tasks: updated });
  };

  // Group by area when showing all weeks
  const grouped = {};
  if (weekFilter === "Todas") {
    filtered.forEach(t => {
      if (!grouped[t.area]) grouped[t.area] = [];
      grouped[t.area].push(t);
    });
  }

  const meetings = client.meetings || [];
  const [showMeetingForm, setShowMeetingForm] = useState(false);
  const [mDate, setMDate] = useState("");
  const [mTitle, setMTitle] = useState("");
  const [mDesc, setMDesc] = useState("");
  const [mTaskId, setMTaskId] = useState("");
  const [mType, setMType] = useState("virtual");
  const [mGuests, setMGuests] = useState("");

  const saveMeeting = () => {
    if (!mDate) return;
    const newM = { id: uid(), date: mDate, title: mTitle.trim() || "Reunión", desc: mDesc.trim(), taskId: mTaskId || null, type: mType, guestEmails: mGuests.trim() };
    onChange({ ...client, meetings: [...meetings, newM].sort((a,b)=>a.date.localeCompare(b.date)) });
    setMDate(""); setMTitle(""); setMDesc(""); setMTaskId(""); setMType("virtual"); setMGuests(""); setShowMeetingForm(false);
  };
  const deleteMeeting = (id) => onChange({ ...client, meetings: meetings.filter(m=>m.id!==id) });

  const upcomingMeetings = meetings.filter(m => new Date(m.date) >= new Date()).sort((a,b)=>a.date.localeCompare(b.date));
  const pastMeetings = meetings.filter(m => new Date(m.date) < new Date()).sort((a,b)=>b.date.localeCompare(a.date));
  const fmtMeeting = d => new Date(d).toLocaleDateString("es-CO", { weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });

  return (
    <div>
      {/* Reuniones */}
      <div style={{ background:"#0a0a0b", border:`1px solid #60A5FA22`, borderLeft:`4px solid #60A5FA`, borderRadius:10, padding:"14px 16px", marginBottom:20 }}>
        {/* Header */}
        <div style={{ marginBottom:12 }}>
          <div style={{ color:"#60A5FA88", fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Agenda</div>
          <div style={{ color:WHITE, fontWeight:800, fontSize:14, letterSpacing:-0.2 }}>Reuniones del Cliente</div>
        </div>
        {meetings.length === 0 && !showMeetingForm ? (
          <button onClick={()=>setShowMeetingForm(true)}
            style={{ width:"100%", padding:"12px", background:"rgba(96,165,250,0.06)", border:"1px dashed rgba(96,165,250,0.3)", borderRadius:8, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
            <span style={{ fontSize:14 }}>📅</span>
            <span style={{ color:GRAY, fontSize:12 }}>Agendar primera reunión</span>
          </button>
        ) : (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: (upcomingMeetings.length > 0 || showMeetingForm) ? 12 : 0, gap:8 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              {upcomingMeetings.length > 0 && (
                <span style={{ background:"rgba(96,165,250,0.12)", color:"#60A5FA", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20, border:"1px solid rgba(96,165,250,0.2)" }}>
                  {upcomingMeetings.length} próxima{upcomingMeetings.length>1?"s":""}
                </span>
              )}
            </div>
            <button onClick={()=>setShowMeetingForm(s=>!s)}
              style={{ padding:"5px 12px", borderRadius:7, fontSize:12, cursor:"pointer", border:`1px solid ${showMeetingForm?GOLD:BORDER}`, background:showMeetingForm?"rgba(139,92,246,0.1)":"transparent", color:showMeetingForm?GOLD:GRAY, fontWeight:600 }}>
              {showMeetingForm ? "✕ Cancelar" : "+ Agendar"}
            </button>
          </div>
        )}

        {showMeetingForm && (
          <div style={{ padding:"12px 14px", background:"#111113", borderRadius:8, marginBottom:12, display:"flex", flexDirection:"column", gap:8 }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Fecha y hora *</div>
                <input type="datetime-local" value={mDate} onChange={e=>setMDate(e.target.value)}
                  style={{ width:"100%", background:BG, border:`1px solid ${mDate?GOLD:BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none", colorScheme:"dark" }} />
              </div>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Título</div>
                <input value={mTitle} onChange={e=>setMTitle(e.target.value)} placeholder="Ej: Reunión de seguimiento"
                  style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none" }} />
              </div>
            </div>
            <div>
              <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Descripción / agenda</div>
              <textarea value={mDesc} onChange={e=>setMDesc(e.target.value)} rows={2} placeholder="Temas a tratar, objetivos de la reunión..."
                style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none", resize:"vertical" }} />
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Tipo</div>
                <select value={mType} onChange={e=>setMType(e.target.value)}
                  style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none" }}>
                  <option value="virtual">💻 Virtual</option>
                  <option value="presencial">📍 Presencial</option>
                </select>
              </div>
              <div>
                <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Correos invitados (Google Calendar)</div>
                <input value={mGuests} onChange={e=>setMGuests(e.target.value)} placeholder="correo1@empresa.com, correo2@empresa.com"
                  style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none" }} />
              </div>
            </div>
            <div>
              <div style={{ color:GRAY, fontSize:10, marginBottom:3 }}>Vincular a tarea (opcional)</div>
              <select value={mTaskId} onChange={e=>setMTaskId(e.target.value)}
                style={{ width:"100%", background:BG, border:`1px solid ${BORDER}`, borderRadius:7, padding:"6px 10px", color:WHITE, fontSize:12, outline:"none" }}>
                <option value="">— Sin tarea vinculada —</option>
                {(client.tasks||[]).filter(t=>!t.done).map(t => (
                  <option key={t.id} value={t.id}>#{t.n} {t.title}</option>
                ))}
              </select>
            </div>
            <button onClick={saveMeeting} disabled={!mDate}
              style={{ padding:"7px 18px", background:mDate?GOLD:"#333", color:mDate?"#141414":GRAY, border:"none", borderRadius:7, cursor:mDate?"pointer":"not-allowed", fontWeight:700, fontSize:12, alignSelf:"flex-end" }}>
              Guardar reunión
            </button>
          </div>
        )}

        {upcomingMeetings.map(m => {
          const linked = m.taskId ? (client.tasks||[]).find(t=>t.id===m.taskId) : null;
          return (
            <div key={m.id} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"9px 0", borderBottom:`1px solid ${BORDER}33` }}>
              <div style={{ minWidth:96, color:"#60A5FA", fontSize:11, fontWeight:600, paddingTop:1 }}>{fmtMeeting(m.date)}</div>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                  <span style={{ color:WHITE, fontSize:13, fontWeight:600 }}>{m.title}</span>
                  <span style={{ fontSize:10, color: m.type==="presencial" ? "#F59E0B" : "#60A5FA", background: m.type==="presencial" ? "rgba(245,158,11,0.1)" : "rgba(96,165,250,0.1)", padding:"1px 7px", borderRadius:10, fontWeight:700 }}>
                    {m.type==="presencial" ? "📍 Presencial" : "💻 Virtual"}
                  </span>
                </div>
                {m.desc && <div style={{ color:GRAY, fontSize:11, marginTop:2, lineHeight:1.4 }}>{m.desc}</div>}
                {m.guestEmails && <div style={{ color:GRAY, fontSize:10, marginTop:3 }}>✉ {m.guestEmails}</div>}
                {linked && <div style={{ color:GOLD_DIM, fontSize:10, marginTop:3 }}>↳ #{linked.n} {linked.title}</div>}
              </div>
              <button onClick={()=>deleteMeeting(m.id)} style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:13, flexShrink:0 }}>×</button>
            </div>
          );
        })}

        {pastMeetings.length > 0 && upcomingMeetings.length === 0 && (
          <div style={{ color:GRAY, fontSize:11, marginTop:4 }}>
            Última: {pastMeetings[0].title} — {fmtMeeting(pastMeetings[0].date)}
          </div>
        )}
      </div>

      {/* Week stats */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:20 }}>
        {WEEKS.map((w, wi) => {
          const s = weekStats(tasks, w);
          const pct = s.total ? Math.round(s.done/s.total*100) : 0;
          const c = pct >= 100 ? GREEN : pct >= 50 ? GOLD : "#60A5FA";
          return (
            <div key={w} style={{ background:"#0a0a0b", border:`1px solid ${c}22`, borderTop:`2px solid ${c}55`, borderRadius:10, padding:"12px 14px" }}>
              <div style={{ color:`${c}88`, fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>Semana {wi+1}</div>
              <div style={{ fontSize:24, fontWeight:900, color:c, lineHeight:1, marginBottom:6 }}>{pct}%</div>
              <ProgressBar pct={pct} color={c} height={4} />
              <div style={{ fontSize:11, color:GRAY, marginTop:6 }}>{s.done}/{s.total} tareas</div>
            </div>
          );
        })}
      </div>

      {/* Launch milestones */}
      {(() => {
        const start = client.profile?.startDate;
        if (!start) return (
          <div style={{ background:"rgba(139,92,246,0.06)", border:`1px solid ${GOLD_DIM}`, borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:11, color:GOLD_DIM }}>
            ⚡ Define la <strong style={{color:GOLD}}>Fecha inicio</strong> en Perfil para ver los hitos de lanzamiento MVP y Full.
          </div>
        );
        const d = new Date(start);
        const mvp = new Date(d); mvp.setDate(mvp.getDate() + 14);
        const full = new Date(d); full.setDate(full.getDate() + 21);
        const fmt = dt => dt.toLocaleDateString("es-CO", { day:"2-digit", month:"short" });
        const today = new Date();
        const diffDays = (dt) => Math.ceil((dt - today) / 86400000);
        const mvpDiff = diffDays(mvp), fullDiff = diffDays(full);
        const status = (diff) => diff < 0 ? { color:"#E06C6C", label:`hace ${-diff}d` } : diff === 0 ? { color:GREEN, label:"hoy" } : { color:GOLD, label:`en ${diff}d` };
        return (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            {[
              { icon:"🎯", name:"MVP Launch", overline:"Semana 2", date:mvp, diff:mvpDiff, desc:"Mínimo viable activo", baseColor:GOLD },
              { icon:"🚀", name:"Full Launch", overline:"Semana 3", date:full, diff:fullDiff, desc:"Sistema completo en marcha", baseColor:GREEN },
            ].map(m => {
              const st = status(m.diff);
              return (
                <div key={m.name} style={{ background:"#0a0a0b", border:`1px solid ${m.baseColor}22`, borderLeft:`4px solid ${m.baseColor}`, borderRadius:10, padding:"12px 14px" }}>
                  <div style={{ color:`${m.baseColor}88`, fontSize:9, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:4 }}>{m.overline}</div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ fontSize:18 }}>{m.icon}</span>
                    <div style={{ color:WHITE, fontWeight:800, fontSize:13, letterSpacing:-0.2 }}>{m.name}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"baseline", gap:8 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:st.color }}>{fmt(m.date)}</div>
                    <div style={{ fontSize:10, background:`${st.color}15`, color:st.color, padding:"1px 6px", borderRadius:4, border:`1px solid ${st.color}33` }}>{st.label}</div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* Filters */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {["Todas",...WEEKS].map(w=><Pill key={w} active={weekFilter===w} onClick={()=>setWeekFilter(w)}>{w}</Pill>)}
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {["Todas",...AREAS].map(a=><Pill key={a} active={areaFilter===a} onClick={()=>setAreaFilter(a)}>{a}</Pill>)}
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:16, alignItems:"center", flexWrap:"wrap" }}>
        <Pill active={ownerFilter==="Todos"} onClick={()=>setOwnerFilter("Todos")}>Todos</Pill>
        {team.map(m=><Pill key={m.id} active={ownerFilter===m.id} onClick={()=>setOwnerFilter(m.id)}>{m.name}</Pill>)}
      </div>

      {/* Quick-add bar */}
      <div style={{ display:"flex", gap:6, marginBottom:16, alignItems:"center", flexWrap:"wrap",
        background:"#0d0d0f", border:`1px solid ${BORDER}`, borderRadius:8, padding:"8px 10px" }}>
        <input
          value={customTitle} onChange={e=>setCustomTitle(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter" && customTitle.trim()) {
            onChange({...client, tasks:[...tasks,{id:uid(),n:null,week:customWeek,area:customArea,title:customTitle.trim(),assigneeIds:customAssignees,done:false,doneAt:null}]});
            setCustomTitle(""); setCustomAssignees([]);
          }}}
          placeholder="+ Nueva tarea para este cliente..."
          style={{ flex:1, minWidth:160, background:"transparent", border:"none", color:WHITE, fontSize:12, outline:"none", padding:"2px 0" }}
        />
        <select multiple value={customAssignees} onChange={e=>setCustomAssignees([...e.target.selectedOptions].map(o=>o.value))}
          title="Ctrl/Cmd+click para elegir varios"
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none", minWidth:110, height:30 }}>
          {team.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
        <select value={customWeek} onChange={e=>setCustomWeek(e.target.value)}
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none" }}>
          {WEEKS.map(w=><option key={w} value={w}>{w}</option>)}
        </select>
        <select value={customArea} onChange={e=>setCustomArea(e.target.value)}
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:5, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none" }}>
          {AREAS.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <button
          onClick={() => {
            if (!customTitle.trim()) return;
            onChange({...client, tasks:[...tasks,{id:uid(),n:null,week:customWeek,area:customArea,title:customTitle.trim(),assigneeIds:customAssignees,done:false,doneAt:null}]});
            setCustomTitle(""); setCustomAssignees([]);
          }}
          style={{ padding:"4px 12px", background:customTitle.trim()?GREEN:"#222225", color:customTitle.trim()?"#141414":GRAY, border:`1px solid ${customTitle.trim()?GREEN:BORDER}`, borderRadius:5, cursor:"pointer", fontWeight:700, fontSize:12, transition:"all 0.15s", flexShrink:0 }}>
          Añadir
        </button>
      </div>

      {/* Task list */}
      {weekFilter === "Todas" ? (
        Object.entries(grouped).map(([area, areaTask]) => (
          <div key={area} style={{ marginBottom:20 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
              <span style={{ fontSize:12, fontWeight:600, color:GOLD, textTransform:"uppercase", letterSpacing:1 }}>{area}</span>
            </div>
            {areaTask.map(t => <TaskRow key={t.id} task={t} team={team} onToggle={toggleTask} onAssign={assignTask} onDelete={deleteTask} onUrgent={urgentTask} onUpdate={updateTaskFull} currentUserId={currentUserId} />)}
          </div>
        ))
      ) : (
        filtered.map(t => <TaskRow key={t.id} task={t} team={team} onToggle={toggleTask} onAssign={assignTask} onDelete={deleteTask} onUrgent={urgentTask} onUpdate={updateTaskFull} currentUserId={currentUserId} />)
      )}

      {filtered.length === 0 && (
        <div style={{ color:GRAY, textAlign:"center", padding:"40px 0" }}>No hay tareas con estos filtros.</div>
      )}
    </div>
  );
}

function TaskRow({ task, team, onToggle, onAssign, onDelete, onUrgent, onUpdate, currentUserId }) {
  const assigneeIds = task.assigneeIds || (task.assigneeId ? [task.assigneeId] : []);
  const assignedNames = assigneeIds.map(id => team.find(m=>m.id===id)?.name).filter(Boolean);
  const [open, setOpen] = useState(false);
  const logCount = (task.registroActividad||[]).length;
  return (
    <div style={{ marginBottom:4 }}>
      <div style={{
        display:"flex", alignItems:"center", gap:8, padding:"8px 10px", borderRadius:8,
        background: task.urgent ? "rgba(239,68,68,0.04)" : task.done ? "rgba(76,175,125,0.05)" : "transparent",
        border:`1px solid ${task.urgent ? "rgba(239,68,68,0.3)" : task.done ? "rgba(76,175,125,0.2)" : BORDER}`,
        borderBottomLeftRadius: open?0:8, borderBottomRightRadius: open?0:8,
        opacity: task.done ? 0.6 : 1,
        transition:"all 0.15s",
      }}>
        <input type="checkbox" checked={task.done} onChange={()=>onToggle(task.id)}
          style={{ accentColor:GOLD, width:15, height:15, cursor:"pointer", flexShrink:0 }} />
        <button onClick={()=>onUrgent && onUrgent(task.id)} title={task.urgent?"Quitar prioridad":"Marcar como prioritaria"}
          style={{ background:"none", border:"none", cursor:"pointer", fontSize:13, padding:"0 1px", flexShrink:0, opacity: task.urgent ? 1 : 0.25, transition:"opacity 0.15s" }}>⚡</button>
        {task.n != null && <span style={{ fontFamily:"monospace", fontSize:10, color:GRAY, minWidth:24, flexShrink:0 }}>#{task.n}</span>}
        <span style={{ flex:1, fontSize:12, color:WHITE, textDecoration:task.done?"line-through":"none", lineHeight:1.4 }}>{task.title}</span>
        {assignedNames.length > 0 && (
          <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, flexShrink:0, border:`1px solid ${GOLD_DIM}55`, color:GOLD_DIM, background:"rgba(139,92,246,0.08)", maxWidth:180, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}
            title={assignedNames.join(", ")}>
            {assignedNames.join(", ")}
          </span>
        )}
        <select multiple value={assigneeIds} onChange={e=>onAssign(task.id, [...e.target.selectedOptions].map(o=>o.value))}
          title="Ctrl/Cmd+click para elegir varios"
          style={{ background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"3px 6px", color:GRAY, fontSize:11, outline:"none", maxWidth:110, height:26 }}>
          {team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
        <button onClick={()=>setOpen(o=>!o)} title="Bitácora de la tarea"
          style={{ background: open?"rgba(139,92,246,0.15)":"none", border:`1px solid ${open?GOLD_DIM:BORDER}`, borderRadius:6, color: open?GOLD:GRAY, cursor:"pointer", fontSize:11, padding:"3px 8px", flexShrink:0, fontWeight:600 }}>
          📋{logCount>0?` ${logCount}`:""}
        </button>
        <button onClick={()=>onDelete(task.id)}
          style={{ background:"none", border:"none", color:GRAY, cursor:"pointer", fontSize:14, padding:"0 2px", flexShrink:0 }}>×</button>
      </div>
      {open && onUpdate && (
        <TaskBitacora task={task} team={team} currentUserId={currentUserId} onUpdate={(patch)=>onUpdate(task.id, patch)} />
      )}
    </div>
  );
}

// ─── BITÁCORA POR TAREA ─────────────────────────────────────────────────────────
// Formato: Estado | Responsable | Prioridad | Fase | Fecha límite — Descripción —
// Checklist — Tiempo (inicio/fin) — Registro de actividad (con timestamp) —
// Evidencias — Observaciones.
function TaskBitacora({ task, team, currentUserId, onUpdate }) {
  const [newCheck, setNewCheck] = useState("");
  const [newLog, setNewLog] = useState("");
  const [newEvidencia, setNewEvidencia] = useState("");

  const checklist = task.checklist || [];
  const registro = task.registroActividad || [];
  const evidencias = task.evidencias || [];
  const assigneeIds = task.assigneeIds || (task.assigneeId ? [task.assigneeId] : []);
  const responsableNames = assigneeIds.map(id=>team.find(m=>m.id===id)?.name).filter(Boolean).join(", ") || "Sin asignar";
  const currentUserName = team.find(m=>m.id===currentUserId)?.name;

  const fmtFecha = (iso) => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
  const fmtHora = (ts) => new Date(ts).toLocaleString("es-CO", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

  const addCheck = () => {
    if (!newCheck.trim()) return;
    onUpdate({ checklist: [...checklist, { id:uid(), label:newCheck.trim(), done:false }] });
    setNewCheck("");
  };
  const toggleCheck = (id) => onUpdate({ checklist: checklist.map(c=>c.id===id?{...c,done:!c.done}:c) });
  const delCheck = (id) => onUpdate({ checklist: checklist.filter(c=>c.id!==id) });

  const addLog = () => {
    if (!newLog.trim()) return;
    onUpdate({ registroActividad: [...registro, { id:uid(), ts:Date.now(), userId:currentUserId||null, text:newLog.trim() }] });
    setNewLog("");
  };

  const addEvidencia = () => {
    if (!newEvidencia.trim()) return;
    onUpdate({ evidencias: [...evidencias, { id:uid(), name:newEvidencia.trim(), ts:Date.now() }] });
    setNewEvidencia("");
  };
  const delEvidencia = (id) => onUpdate({ evidencias: evidencias.filter(e=>e.id!==id) });

  const fieldStyle = { background:"#111113", border:`1px solid ${BORDER}`, borderRadius:6, padding:"4px 8px", color:WHITE, fontSize:11.5, outline:"none" };

  return (
    <div style={{ border:`1px solid ${GOLD_DIM}55`, borderTop:"none", borderBottomLeftRadius:8, borderBottomRightRadius:8, background:"#0a0a0b", padding:"12px 14px", fontSize:12, color:GRAY, lineHeight:1.7 }}>
      {/* Línea de metadatos */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:"4px 14px", marginBottom:8, alignItems:"center" }}>
        <span><b style={{color:WHITE}}>Estado:</b>{" "}
          <select value={task.estado||"pendiente"} onChange={e=>onUpdate({estado:e.target.value})} style={fieldStyle}>
            {ESTADOS_TAREA.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </span>
        <span><b style={{color:WHITE}}>Responsable:</b> {responsableNames}</span>
        <span><b style={{color:WHITE}}>Prioridad:</b>{" "}
          <select value={task.prioridad||"media"} onChange={e=>onUpdate({prioridad:e.target.value})} style={fieldStyle}>
            {PRIORIDADES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
        </span>
        <span><b style={{color:WHITE}}>Fase:</b>{" "}
          <select value={task.fase||task.area||AREAS[0]} onChange={e=>onUpdate({fase:e.target.value})} style={fieldStyle}>
            {AREAS.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
        </span>
        <span><b style={{color:WHITE}}>Fecha límite:</b>{" "}
          <input type="date" value={task.fechaLimite||""} onChange={e=>onUpdate({fechaLimite:e.target.value})} style={{...fieldStyle, colorScheme:"dark"}} />
          {task.fechaLimite && <span style={{marginLeft:4}}>({fmtFecha(task.fechaLimite)})</span>}
        </span>
      </div>

      {/* Descripción */}
      <div style={{ marginBottom:8 }}>
        <b style={{color:WHITE}}>Descripción:</b>{" "}
        <textarea value={task.descripcion||""} onChange={e=>onUpdate({descripcion:e.target.value})} rows={2} placeholder="Descripción de la tarea..."
          style={{ ...fieldStyle, width:"100%", resize:"vertical", boxSizing:"border-box", marginTop:4, display:"block" }} />
      </div>

      {/* Checklist */}
      <div style={{ marginBottom:8 }}>
        <b style={{color:WHITE}}>Checklist:</b>
        <div style={{ display:"flex", flexWrap:"wrap", gap:"4px 14px", marginTop:4 }}>
          {checklist.map(c => (
            <span key={c.id} style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer" }} onClick={()=>toggleCheck(c.id)}>
              <span>{c.done?"☑":"☐"}</span>
              <span style={{ color: c.done?GRAY:WHITE, textDecoration: c.done?"line-through":"none" }}>{c.label}</span>
              <span onClick={e=>{e.stopPropagation();delCheck(c.id);}} style={{ color:GRAY, fontSize:12, marginLeft:2 }}>×</span>
            </span>
          ))}
        </div>
        <div style={{ display:"flex", gap:6, marginTop:6 }}>
          <input value={newCheck} onChange={e=>setNewCheck(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCheck()}
            placeholder="+ Ítem del checklist..." style={{...fieldStyle, flex:1, minWidth:140}} />
          <button onClick={addCheck} style={{ padding:"4px 10px", background:"transparent", border:`1px dashed ${GOLD_DIM}`, borderRadius:6, color:GOLD, cursor:"pointer", fontSize:11 }}>+ Añadir</button>
        </div>
      </div>

      {/* Tiempo */}
      <div style={{ marginBottom:8 }}>
        <b style={{color:WHITE}}>Tiempo:</b>{" "}
        Inicio <input type="time" value={task.tiempoInicio||""} onChange={e=>onUpdate({tiempoInicio:e.target.value})} style={{...fieldStyle, colorScheme:"dark"}} />
        {" "}/ Fin <input type="time" value={task.tiempoFin||""} onChange={e=>onUpdate({tiempoFin:e.target.value})} style={{...fieldStyle, colorScheme:"dark"}} />
      </div>

      {/* Registro de actividad */}
      <div style={{ marginBottom:8 }}>
        <b style={{color:WHITE}}>Registro de actividad:</b>
        <div style={{ marginTop:4, display:"flex", flexDirection:"column", gap:3 }}>
          {registro.length===0 && <div style={{ color:GRAY, fontStyle:"italic" }}>Sin entradas todavía.</div>}
          {[...registro].sort((a,b)=>a.ts-b.ts).map(r => {
            const u = team.find(m=>m.id===r.userId);
            return (
              <div key={r.id} style={{ fontSize:11.5 }}>
                <span style={{ color:GOLD_DIM }}>{fmtHora(r.ts)}</span>{" — "}
                {u && <span style={{ color:WHITE, fontWeight:600 }}>{u.name}: </span>}
                <span>{r.text}</span>
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:6, marginTop:6 }}>
          <input value={newLog} onChange={e=>setNewLog(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addLog()}
            placeholder={currentUserName ? `Registrar avance como ${currentUserName}...` : "Selecciona 'Quién eres' arriba para registrar avances..."}
            style={{...fieldStyle, flex:1, minWidth:180}} />
          <button onClick={addLog} style={{ padding:"4px 10px", background:"transparent", border:`1px dashed ${GOLD_DIM}`, borderRadius:6, color:GOLD, cursor:"pointer", fontSize:11 }}>+ Registrar</button>
        </div>
      </div>

      {/* Evidencias */}
      <div style={{ marginBottom:8 }}>
        <b style={{color:WHITE}}>Evidencias:</b>{" "}
        {evidencias.map(e => (
          <span key={e.id} style={{ marginRight:8 }}>📎 {e.name} <span onClick={()=>delEvidencia(e.id)} style={{ color:GRAY, cursor:"pointer" }}>×</span></span>
        ))}
        <div style={{ display:"flex", gap:6, marginTop:6 }}>
          <input value={newEvidencia} onChange={e=>setNewEvidencia(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEvidencia()}
            placeholder="Nombre del archivo o enlace de evidencia..." style={{...fieldStyle, flex:1, minWidth:180}} />
          <button onClick={addEvidencia} style={{ padding:"4px 10px", background:"transparent", border:`1px dashed ${GOLD_DIM}`, borderRadius:6, color:GOLD, cursor:"pointer", fontSize:11 }}>📎 Añadir</button>
        </div>
      </div>

      {/* Observaciones */}
      <div>
        <b style={{color:WHITE}}>Observaciones:</b>{" "}
        <textarea value={task.observaciones||""} onChange={e=>onUpdate({observaciones:e.target.value})} rows={2} placeholder="Observaciones libres..."
          style={{ ...fieldStyle, width:"100%", resize:"vertical", boxSizing:"border-box", marginTop:4, display:"block" }} />
      </div>
    </div>
  );
}

// ─── FLOW CANVAS ──────────────────────────────────────────────────────────────
function FlowCanvas({ flow, clientName, clientProfile, clientTasks, onUpdate, apiKey }) {
  const outerRef = useRef(null);
  const [pan, setPan] = useState({ x:0, y:0 });
  const [zoom, setZoom] = useState(1);
  const [isPanning, setIsPanning] = useState(false);
  const [panStart, setPanStart] = useState(null);
  const [dragState, setDragState] = useState(null);
  const [connectMode, setConnectMode] = useState(false);
  const [connectFrom, setConnectFrom] = useState(null);
  const [editingNodeId, setEditingNodeId] = useState(null);
  const [editingEdgeId, setEditingEdgeId] = useState(null);
  const [snapGrid, setSnapGrid] = useState(false);
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [selectionRect, setSelectionRect] = useState(null);
  const [toolMode, setToolMode] = useState("select");
  const [selectedEdgeId, setSelectedEdgeId] = useState(null);
  const spacePanning = useRef(false);
  const importInputRef = useRef(null);
  const [history, setHistory] = useState([]);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [clipboard, setClipboard] = useState(null); // {nodes: [], edges: []}
  const [nodeSearch, setNodeSearch] = useState("");
  const [importLoading, setImportLoading] = useState(false);
  const [importError, setImportError] = useState(null);
  const [importPreview, setImportPreview] = useState(null);
  const [importPreviewEditing, setImportPreviewEditing] = useState([]);

  const NODE_COLORS = [
    { label:"Default",   bg:null },
    // Pasteles
    { label:"Blanco",    bg:"#FFFFFF" },
    { label:"Crema",     bg:"#FFFBEB" },
    { label:"Azul claro",bg:"#EFF6FF" },
    { label:"Verde claro",bg:"#ECFDF5" },
    { label:"Rosa claro",bg:"#FFF1F2" },
    { label:"Morado cl.",bg:"#F5F3FF" },
    // Vivos
    { label:"Amarillo",  bg:"#FACC15" },
    { label:"Naranja",   bg:"#F97316" },
    { label:"Rojo",      bg:"#EF4444" },
    { label:"Rosa",      bg:"#EC4899" },
    { label:"Morado",    bg:"#8B5CF6" },
    { label:"Azul",      bg:"#3B82F6" },
    { label:"Cyan",      bg:"#06B6D4" },
    { label:"Verde",     bg:"#22C55E" },
    { label:"Lima",      bg:"#84CC16" },
    // Oscuros
    { label:"Carbón",    bg:"#1E1E2E" },
    { label:"Navy",      bg:"#1E3A5F" },
    { label:"Bosque",    bg:"#14532D" },
  ];

  const nodes = Array.isArray(flow.nodes) ? flow.nodes : [];
  const edges = Array.isArray(flow.edges) ? flow.edges : [];

  const snap = (v) => snapGrid ? Math.round(v/20)*20 : v;

  const canvasPoint = (e) => {
    const rect = outerRef.current.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - pan.x) / zoom,
      y: (e.clientY - rect.top - pan.y) / zoom,
    };
  };

  const saveHistory = useCallback((f) => {
    setHistory(h => [...h.slice(-20), JSON.stringify(f)]);
  }, []);

  const update = (f) => { saveHistory(flow); onUpdate(f); };

  // Wheel zoom
  useEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    const handler = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      setZoom(z => Math.min(2, Math.max(0.3, +(z + delta).toFixed(1))));
    };
    el.addEventListener("wheel", handler, { passive: false });
    return () => el.removeEventListener("wheel", handler);
  }, []);

  const onOuterPointerDown = (e) => {
    setSelectedEdgeId(null);
    if (e.button === 1) {
      e.preventDefault();
      setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      setIsPanning(true);
      return;
    }
    if (e.button !== 0) return;
    if (toolMode === "pan") {
      e.preventDefault();
      setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      setIsPanning(true);
    } else {
      const pt = canvasPoint(e);
      setSelectionRect({ x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y });
      setDragState({ type:"rubber" });
      if (!e.shiftKey) setSelectedIds(new Set());
    }
  };
  const onOuterPointerMove = (e) => {
    if (isPanning && panStart) {
      setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
    }
    if (dragState?.type === "rubber") {
      const pt = canvasPoint(e);
      setSelectionRect(r => r ? { ...r, x2: pt.x, y2: pt.y } : r);
    }
    if (dragState?.type === "nodes") {
      const pt = canvasPoint(e);
      const newNodes = nodes.map(n => {
        const off = dragState.offsets.find(o=>o.id===n.id);
        if (!off) return n;
        return { ...n, x: snap(pt.x - off.ox), y: snap(pt.y - off.oy) };
      });
      onUpdate({ ...flow, nodes: newNodes });
    }
  };
  const onOuterPointerUp = () => {
    setIsPanning(false);
    if (dragState?.type === "rubber" && selectionRect) {
      const rx1 = Math.min(selectionRect.x1, selectionRect.x2);
      const ry1 = Math.min(selectionRect.y1, selectionRect.y2);
      const rx2 = Math.max(selectionRect.x1, selectionRect.x2);
      const ry2 = Math.max(selectionRect.y1, selectionRect.y2);
      const selected = nodes.filter(n => {
        const nw = n.w || 180, nh = 80;
        return n.x < rx2 && n.x + nw > rx1 && n.y < ry2 && n.y + nh > ry1;
      });
      if (selected.length > 0) {
        setSelectedIds(prev => {
          const next = new Set(prev);
          selected.forEach(n => next.add(n.id));
          return next;
        });
      }
      setSelectionRect(null);
    }
    setDragState(null);
  };

  const addNode = (type) => {
    const cfg = NODE_TYPES[type] || NODE_TYPES.speech;
    const newNode = {
      id: uid(), type, text: cfg.label,
      x: snap(200 - pan.x/zoom + Math.random()*40),
      y: snap(120 - pan.y/zoom + Math.random()*40),
      ...(cfg.defaultShape ? { shape: cfg.defaultShape } : {}),
    };
    update({ ...flow, nodes: [...nodes, newNode] });
  };

  const onNodePointerDown = (e, nodeId) => {
    e.stopPropagation();
    if (connectMode) {
      if (!connectFrom) { setConnectFrom(nodeId); return; }
      if (connectFrom !== nodeId) {
        update({ ...flow, edges: [...edges, { id:uid(), from:connectFrom, to:nodeId, label:"" }] });
      }
      setConnectFrom(null);
      setConnectMode(false);
      return;
    }
    let newSelectedIds;
    if (e.shiftKey) {
      newSelectedIds = new Set(selectedIds);
      if (newSelectedIds.has(nodeId)) newSelectedIds.delete(nodeId);
      else newSelectedIds.add(nodeId);
    } else if (!selectedIds.has(nodeId)) {
      newSelectedIds = new Set([nodeId]);
    } else {
      newSelectedIds = new Set(selectedIds);
    }
    setSelectedIds(newSelectedIds);
    setSelectedEdgeId(null);
    const dragIds = new Set(newSelectedIds);
    dragIds.add(nodeId);
    const pt = canvasPoint(e);
    const offsets = [...dragIds].map(id => {
      const n = nodes.find(x=>x.id===id);
      return { id, ox: pt.x - (n?.x||0), oy: pt.y - (n?.y||0) };
    });
    setDragState({ type:"nodes", offsets });
  };

  const updateNodeProp = (id, patch) => {
    update({ ...flow, nodes: nodes.map(n => n.id===id ? {...n,...patch} : n) });
  };

  const deleteNode = (id) => {
    update({ ...flow, nodes: nodes.filter(n=>n.id!==id), edges: edges.filter(e=>e.from!==id&&e.to!==id) });
    setSelectedIds(prev => { const next = new Set(prev); next.delete(id); return next; });
  };

  const deleteEdge = (id) => { update({ ...flow, edges: edges.filter(e=>e.id!==id) }); };

  const undo = () => {
    if (!history.length) return;
    const prev = JSON.parse(history[history.length-1]);
    setHistory(h => h.slice(0,-1));
    onUpdate(prev);
  };

  // Port-based connection points — exits from the correct edge of each node
  const getPortPt = (nodeId, otherId) => {
    const n = nodes.find(x=>x.id===nodeId);
    const o = nodes.find(x=>x.id===otherId);
    if (!n) return null;
    const cfg = NODE_TYPES[n.type] || NODE_TYPES.speech;
    if (cfg.swimlane) {
      return { x: n.x + (n.w||cfg.defaultW||680)/2, y: n.y + (n.h||cfg.defaultH||200)/2, side:"center" };
    }
    const nw = n.w || 180;
    const nh = 56 + Math.ceil(((n.text||"").length / 22)) * 17;
    const cx = n.x + nw / 2;
    const cy = n.y + nh / 2;
    if (n.shape === "circle") {
      if (!o) return { x: cx, y: cy, side:"bottom" };
      const ow = o.w||180, oh = 60;
      const angle = Math.atan2((o.y+oh/2)-cy, (o.x+ow/2)-cx);
      return { x: cx + Math.cos(angle)*60, y: cy + Math.sin(angle)*60, side:"edge" };
    }
    if (!o) return { x: cx, y: n.y + nh, side:"bottom" };
    const ow = o.w||180, oh = 60;
    const ocx = o.x + ow/2, ocy = o.y + oh/2;
    const dx = ocx - cx, dy = ocy - cy;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > ady * 1.4) {
      return dx > 0 ? { x: n.x + nw, y: cy, side:"right" } : { x: n.x, y: cy, side:"left" };
    }
    return dy > 0 ? { x: cx, y: n.y + nh, side:"bottom" } : { x: cx, y: n.y, side:"top" };
  };
  // Compat shim for any callers still using getNodeCenter
  const getNodeCenter = (id) => getPortPt(id, null);

  const getShapeStyle = (shape) => {
    switch(shape) {
      case "rounded":       return { borderRadius: 28 };
      case "pill":          return { borderRadius: 100 };
      case "circle":        return { borderRadius:"50%", width:120, minHeight:120, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" };
      case "diamond":       return { clipPath:"polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)", minHeight:120, width:180, border:"none" };
      case "hexagon":       return { clipPath:"polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)", minHeight:100, border:"none" };
      case "parallelogram": return { clipPath:"polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%)", minHeight:70, border:"none" };
      default:              return { borderRadius: 10 };
    }
  };

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      // Ctrl+C — copy selected nodes
      if ((e.ctrlKey || e.metaKey) && e.key === "c") {
        if (selectedIds.size > 0) {
          const copiedNodes = nodes.filter(n=>selectedIds.has(n.id));
          const copiedEdges = edges.filter(ed=>selectedIds.has(ed.from)&&selectedIds.has(ed.to));
          setClipboard({ nodes:copiedNodes, edges:copiedEdges });
        }
        return;
      }
      // Ctrl+V — paste at +40,+40 offset
      if ((e.ctrlKey || e.metaKey) && e.key === "v") {
        if (clipboard) {
          const idMap = {};
          const newNodes = clipboard.nodes.map(n => {
            const newId = uid();
            idMap[n.id] = newId;
            return { ...n, id:newId, x:n.x+40, y:n.y+40 };
          });
          const newEdges = clipboard.edges.map(ed => ({
            ...ed, id:uid(), from:idMap[ed.from]||ed.from, to:idMap[ed.to]||ed.to
          }));
          update({ ...flow, nodes:[...nodes,...newNodes], edges:[...edges,...newEdges] });
          setSelectedIds(new Set(newNodes.map(n=>n.id)));
        }
        return;
      }
      // Ctrl+D — duplicate selected
      if ((e.ctrlKey || e.metaKey) && e.key === "d") {
        e.preventDefault();
        if (selectedIds.size > 0) {
          const toDup = nodes.filter(n=>selectedIds.has(n.id));
          const idMap = {};
          const newNodes = toDup.map(n=>{ const newId=uid(); idMap[n.id]=newId; return {...n,id:newId,x:n.x+40,y:n.y+40}; });
          const newEdges = edges.filter(ed=>selectedIds.has(ed.from)&&selectedIds.has(ed.to)).map(ed=>({...ed,id:uid(),from:idMap[ed.from],to:idMap[ed.to]}));
          update({ ...flow, nodes:[...nodes,...newNodes], edges:[...edges,...newEdges] });
          setSelectedIds(new Set(newNodes.map(n=>n.id)));
        }
        return;
      }
      if (e.key === "Delete" || e.key === "Backspace") {
        if (selectedIds.size > 0) {
          const ids = selectedIds;
          update({
            ...flow,
            nodes: nodes.filter(n=>!ids.has(n.id)),
            edges: edges.filter(ed=>!ids.has(ed.from)&&!ids.has(ed.to))
          });
          setSelectedIds(new Set());
        } else if (selectedEdgeId) {
          update({ ...flow, edges: edges.filter(ed=>ed.id!==selectedEdgeId) });
          setSelectedEdgeId(null);
        }
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [selectedIds, selectedEdgeId, nodes, edges, flow, clipboard]);

  // Space key = temporary pan mode
  useEffect(() => {
    const onDown = (e) => {
      if (e.code !== "Space" || e.repeat) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      e.preventDefault();
      spacePanning.current = true;
      setToolMode("pan");
    };
    const onUp = (e) => {
      if (e.code !== "Space") return;
      if (spacePanning.current) {
        spacePanning.current = false;
        setToolMode("select");
      }
    };
    window.addEventListener("keydown", onDown);
    window.addEventListener("keyup", onUp);
    return () => { window.removeEventListener("keydown", onDown); window.removeEventListener("keyup", onUp); };
  }, []);

  // Analysis block
  const buildAnalysis = () => {
    const lines = [];
    lines.push(`═══════════════════════════════════════════`);
    lines.push(`ANÁLISIS DE PROCESO COMERCIAL — ${clientName}`);
    lines.push(`═══════════════════════════════════════════`);
    lines.push(``);
    lines.push(`DATOS DEL CLIENTE:`);
    lines.push(`  Canal de adquisición: ${clientProfile.channel||"—"}`);
    lines.push(`  Valor de contrato: ${clientProfile.contractValue||"—"}`);
    lines.push(`  Fecha inicio: ${clientProfile.startDate||"—"}`);
    if (clientProfile.notes) lines.push(`  Notas: ${clientProfile.notes}`);
    lines.push(``);
    lines.push(`PROGRESO GROWTH PARTNER AI:`);
    WEEKS.forEach(w => {
      const s = weekStats(clientTasks, w);
      lines.push(`  ${w}: ${s.done}/${s.total} tareas completadas (${s.total ? Math.round(s.done/s.total*100) : 0}%)`);
    });
    lines.push(``);
    lines.push(`PROCESO: ${flow.name}`);
    lines.push(`  Nodos: ${nodes.length}  |  Conexiones: ${edges.length}`);
    lines.push(``);
    if (!nodes.length) { lines.push("  (Canvas vacío — aún no se han definido pasos)"); }
    else {
      lines.push(`NODOS:`);
      nodes.forEach((n,i) => {
        lines.push(`  ${i+1}. [${NODE_TYPES[n.type]?.label||n.type}] ${n.text}`);
      });
      lines.push(``);
      lines.push(`CONEXIONES:`);
      if (!edges.length) { lines.push("  (Sin conexiones definidas)"); }
      else {
        edges.forEach(e => {
          const f = nodes.find(n=>n.id===e.from);
          const t = nodes.find(n=>n.id===e.to);
          lines.push(`  ${f?.text||"?"} --> ${t?.text||"?"} ${e.label ? `[${e.label}]` : ""}`);
        });
      }
      // Flag orphans
      const connected = new Set([...edges.map(e=>e.from), ...edges.map(e=>e.to)]);
      const orphans = nodes.filter(n=>!connected.has(n.id));
      if (orphans.length) {
        lines.push(``);
        lines.push(`ALERTAS:`);
        orphans.forEach(n => lines.push(`  ⚠ Nodo huérfano (sin conexiones): "${n.text}"`));
      }
      const decisions = nodes.filter(n=>n.type==="decision");
      decisions.forEach(d => {
        const outgoing = edges.filter(e=>e.from===d.id);
        if (outgoing.some(e=>!e.label)) lines.push(`  ⚠ Decisión sin etiqueta en ramas: "${d.text}"`);
      });
    }
    lines.push(``);
    lines.push(`═══════════════════════════════════════════`);
    lines.push(`Pega este bloque en Claude para obtener retroalimentación`);
    lines.push(`detallada del proceso comercial.`);
    lines.push(`═══════════════════════════════════════════`);
    return lines.join("\n");

        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "x-api-key": apiKey,
            "anthropic-version":"2023-06-01",
            "anthropic-dangerous-direct-browser-access":"true",
          },
          body: JSON.stringify({
            model:"claude-sonnet-4-6",
            max_tokens:4096,
            messages:[{
              role:"user",
              content:[
                { type:"image", source:{ type:"base64", media_type:mediaType, data:base64 } },
                { type:"text", text:`Analizá este diagrama de flujo y extraé todos los nodos y conexiones en JSON.

Devolvé ÚNICAMENTE un objeto JSON válido sin texto extra ni bloques de código:
{
  "nodes": [
    { "id": "1", "type": "speech", "text": "texto del nodo", "x": 100, "y": 100 }
  ],
  "edges": [
    { "id": "e1", "from": "1", "to": "2", "label": "" }
  ]
}

Tipos de nodo disponibles:
- "bpmn_start": evento de inicio del flujo (círculo verde)
- "bpmn_end": evento de fin (círculo rojo)
- "decision": rombo de decisión / pregunta con bifurcación
- "accion": acción, tarea o paso del proceso
- "alerta": alerta, objeción o punto de atención
- "speech": mensaje, texto o paso genérico

Posiciones x (50–1200), y (50–2000). Mantené el layout visual original. Mínimo 150px vertical entre nodos, 200px horizontal entre columnas.
Edges: label "Sí", "No" o "" si no tiene texto.
Extraé TODOS los nodos visibles. Texto máx 100 caracteres.` }
              ]
            }]
          }),
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error.message);
        const content = (json.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("No se pudo extraer el diagrama.");
        const parsed = JSON.parse(jsonMatch[0]);
        if (!parsed.nodes || !Array.isArray(parsed.nodes)) throw new Error("Formato inválido.");
        setImportPreview(parsed);
        setImportPreviewEditing(parsed.nodes.map(n=>({...n})));
      } catch(e) {
        setImportError("Error: " + (e.message || "verificá tu API key."));
      } finally {
        setImportLoading(false);
        e.target.value = "";
      }
    };
    reader.readAsDataURL(file);
  };

${text}`;
